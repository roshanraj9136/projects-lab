[`TLB`,`Recent address translations ka chhota fast cache.`]
],
steps:[
{t:`Real life samjho`, b:`<p>Har program sochta hai <strong>poori building uski hai</strong> (virtual memory). Reception (MMU) "room 42" ko asli room number me badalta hai. Isse:</p><ul><li>Ek program doosre ki memory nahi chhed sakta</li><li>RAM se zyada memory use ho sakti hai (disk ki madad se)</li></ul>`},
{t:`Address kaise badalta hai`, d:`vmem`, b:`<ol><li>Pehle <strong>TLB</strong> dekho. Mil gaya (hit): turant.</li><li>Nahi mila (miss): <strong>page table</strong> dekho. Thoda slow.</li><li>Page RAM me hai hi nahi: <strong>page fault</strong>.</li></ol>`},
{t:`Page fault me kya hota hai`, b:`<ol><li>CPU OS ko bulata hai (trap).</li><li>OS khaali frame dhoondhta hai. Nahi mila to koi page <strong>nikaalta</strong> hai.</li><li>Disk se page RAM me laata hai.</li><li>Page table update.</li><li>Wahi instruction <strong>dobara</strong> chalti hai.</li></ol><p>Disk RAM se lagbhag <strong>1 lakh guna</strong> slow hai, isliye page fault bahut mehenga.</p>`},
{t:`Page replacement: kaunsa page nikaalein?`, b:`<div class="tbl-wrap"><table>
<tr><th>Algorithm</th><th>Kaise</th><th>Note</th></tr>
<tr><td>FIFO</td><td>sabse purana aaya wala nikaalo</td><td>Belady's anomaly hota hai</td></tr>
<tr><td>Optimal</td><td>jo sabse der baad use hoga</td><td>future chahiye, sirf comparison ke liye</td></tr>
<tr><td>LRU</td><td>jo sabse pehle use hua tha</td><td>achha, lekin exact banana mehenga</td></tr>
<tr><td>Clock</td><td>LRU ka sasta version</td><td>real systems yahi use karte hain</td></tr>
</table></div>`},
{t:`Belady's anomaly aur thrashing`, b:`<ul><li><strong>Belady's anomaly:</strong> FIFO me frames <strong>badhaane</strong> pe page faults <strong>badh</strong> sakte hain. LRU aur Optimal me ye nahi hota.</li><li><strong>Thrashing:</strong> memory itni kam ki system zyada time page laane-le jaane me lagata hai, kaam me nahi. CPU usage gir jaata hai, aur OS aur processes daal ke haalat aur bigaad deta hai.</li></ul>`},
{t:`Paging vs Segmentation`, b:`<ul><li><strong>Paging:</strong> barabar size ke tukde. External fragmentation nahi.</li><li><strong>Segmentation:</strong> matlab wale alag size ke tukde (code, stack, heap). External fragmentation hota hai.</li></ul>`}
],
say:`Virtual memory gives every process its own address space. The MMU translates virtual pages to physical frames using a page table, with the TLB caching recent translations. If a page is not in RAM, a page fault occurs: the OS loads it from disk, evicting a page if needed, then restarts the instruction. Common replacement algorithms are FIFO, which suffers from Belady's anomaly, LRU, and the clock algorithm, which approximates LRU cheaply. Thrashing is when the system spends most of its time handling page faults instead of doing useful work.`,
hook:`TLB hit = fast. Page fault = disk = bahut slow. FIFO me Belady.`,
check:[
[`Belady's anomaly kis algorithm me hota hai?`,`FIFO me.`],
[`TLB kya hai?`,`Recent virtual se physical address translations ka fast cache.`]
]
}
],
cards:[
{q:`Process vs thread — what is shared?`, s:`Threads share karte hain: code, heap, global data, files. Apna: stack, registers, program counter. Process ki memory alag hoti hai.`, a:`Threads in a process share the code, heap, global data and open files; each has its own stack, registers and program counter. Separate processes have separate address spaces.`},
{q:`Why is a context switch expensive?`, s:`Registers save/load, aur process switch me memory map badalta hai: TLB saaf, CPU cache thanda.`, a:`Beyond saving and restoring registers, a process switch changes the address space, flushing the TLB and leaving CPU caches cold.`},
{q:`What is a race condition?`, s:`Do threads same data ek saath badlein aur result timing pe depend kare. count++ bhi 3 steps hai.`, a:`When multiple threads access shared data and the result depends on timing, such as two threads both reading and incrementing a counter.`},
{q:`Mutex vs semaphore?`, s:`Mutex: ek thread andar, owner hai (jisne lagaya wahi khole). Semaphore: counter, N threads, owner nahi.`, a:`A mutex allows one thread and is owned by the thread that locked it. A semaphore is a counter allowing up to N threads and has no owner.`},
{q:`What are the four conditions for deadlock?`, s:`Mutual exclusion, hold and wait, no preemption, circular wait. Chaaron chahiye. Ek todo to deadlock nahi.`, a:`Mutual exclusion, hold and wait, no preemption, and circular wait. All four must hold, so breaking any one prevents deadlock.`},
{q:`How do you prevent deadlock in practice?`, s:`Saare threads locks ek hi order me lein. Circular wait ban hi nahi sakta.`, a:`Enforce a global lock ordering so every thread acquires locks in the same order, which makes circular wait impossible.`},
{q:`What happens on a page fault?`, s:`CPU OS ko bulata hai → OS frame dhoondhta/khaali karta hai → disk se page laata hai → page table update → instruction dobara.`, a:`The CPU traps to the OS, which finds or frees a frame, loads the page from disk, updates the page table, and restarts the instruction.`},
{q:`What is Belady's anomaly?`, s:`FIFO me frames badhaane pe page faults badh sakte hain. LRU/Optimal me nahi hota.`, a:`With FIFO page replacement, adding more frames can increase page faults. LRU and optimal do not suffer from it.`},
{q:`What is thrashing?`, s:`Memory itni kam ki system zyada time page swap me lagata hai, kaam me nahi. CPU usage gir jaata hai.`, a:`When processes have too few frames, so the system spends most of its time servicing page faults and CPU utilization collapses.`},
{q:`What is the TLB?`, s:`Recent address translations ka fast cache. Hit = page table dekhne ki zaroorat nahi.`, a:`A small fast cache of recent virtual-to-physical translations, which avoids walking the page table on every access.`}
]
});
</script>

TOPICS.push({
id:'net', name:'Computer Networks', tier:'crit',
intro:`Networks tumhara coursework hai, aur resume me CORS aur sub-100ms sync bhi likha hai. "URL daal ke Enter dabane pe kya hota hai" bahut saare interviews me poocha jaata hai. Iska 2 minute ka answer tayyar rakho.`,
lessons:[
{
h:`Network layers, TCP aur UDP`,
words:[
[`Protocol`,`Baat karne ke rules jo dono side maante hain.`],
[`Packet`,`Data ka chhota tukda jo network pe jaata hai.`],
[`IP address`,`Computer ka network pe pata.`],

],
steps:[
{t:`Layers: courier jaisa`, b:`<div class="tbl-wrap"><table>
<tr><th>Layer</th><th>Kaam</th><th>Example</th><th>Courier me</th></tr>
<tr><td>Application</td><td>asli message</td><td>HTTP, DNS</td><td>chitthi ka content</td></tr>

</table></div>`},
{t:`TCP vs UDP`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>TCP</th><th>UDP</th></tr>
<tr><td>Pehle connection</td><td>haan (handshake)</td><td>nahi</td></tr>
<tr><td>Data pahunchne ki guarantee</td><td>haan (khoya to dobara)</td><td>nahi</td></tr>
<tr><td>Order sahi</td><td>haan</td><td>nahi</td></tr>
<tr><td>Speed</td><td>thoda slow</td><td>fast</td></tr>
<tr><td>Use</td><td>web, SSH, database</td><td>video call, games, DNS</td></tr>
</table></div><p>Real life: <strong>TCP = phone call</strong> ("sun rahe ho?" "haan"). <strong>UDP = maidan me chillana</strong>, koi confirmation nahi.</p>`},
{t:`Video call me UDP kyun?`, b:`<p>Ek frame kho gaya aur TCP usko dobara bheje, tab tak wo pal <strong>nikal chuka</strong> hai. Purana frame bekaar hai, aur uske intezaar me baaki sab bhi ruk jaata. Live cheezon me <strong>chhodna intezaar se behtar</strong> hai.</p>`},
{t:`TCP 3-way handshake`, d:`tcp`, b:`<ol><li><strong>SYN:</strong> client: "baat karni hai, mera number x se shuru"</li><li><strong>SYN-ACK:</strong> server: "mila, mera number y se shuru"</li><li><strong>ACK:</strong> client: "tumhara bhi mila"</li></ol><p><strong>3 kyun, 2 kyun nahi?</strong> Dono ko confirm karna hai ki saamne wala <strong>bhej bhi sakta hai aur sun bhi sakta hai</strong>. 2 me server ko kabhi pata nahi chalega ki uska SYN pahuncha ya nahi.</p>`},
{t:`Flow control vs congestion control`, b:`<ul><li><strong>Flow control:</strong> receiver kehta hai "itna hi bhejo, mera buffer chhota hai". Receiver ko bachata hai.</li><li><strong>Congestion control:</strong> sender network ki bheed dekh ke speed kam karta hai (slow start). Network ko bachata hai.</li></ul>`}
],
say:`TCP is connection-oriented: it performs a three-way handshake, guarantees delivery and ordering through acknowledgements and retransmission, and has flow and congestion control. UDP has none of that, which makes it faster and better for real-time data like video calls and games, where a late packet is useless. The handshake needs three messages so both sides confirm the other can send and receive and agree on sequence numbers. Flow control protects the receiver; congestion control protects the network.`,
hook:`TCP = phone call. UDP = chillana. SYN → SYN-ACK → ACK.`,
check:[[`DNS aam taur pe TCP pe chalta hai ya UDP?`,`UDP (port 53). Chhota sawaal-jawab hai, fast chahiye.`]]
},
{
h:`URL daal ke Enter dabaya: kya hota hai?`,
words:[
[`DNS`,`Naam (google.com) ko IP address me badalne wala system. Internet ki phone book.`],
[`TLS`,`Connection ko encrypt karne wala protocol. HTTPS ka "S".`],
[`DOM`,`Browser me page ka tree structure.`]
],
steps:[
{t:`Poori journey ek nazar me`, d:`url`, b:`<p>Real life: dost ke ghar jaana. Contacts me pata dhoondho (DNS), darwaaza khatkhatao (TCP), secret code tay karo taaki padosi na sunein (TLS), jo chahiye maango (HTTP), phir jo mila use sajao (render).</p>`},
{t:`Step 1: DNS`, b:`<p>Browser ko <code>google.com</code> ka IP chahiye. Kram se dhoondhta hai:</p><ol><li>Browser cache</li><li>OS cache</li><li>Resolver (ISP ya 8.8.8.8)</li><li>Root server → <code>.com</code> server → google ka server</li></ol><p>IP mil gaya.</p>`},
{t:`Step 2 aur 3: TCP aur TLS`, b:`<ul><li><strong>TCP:</strong> port 443 pe 3-way handshake.</li><li><strong>TLS:</strong> server apna <strong>certificate</strong> dikhata hai (main asli google hoon). Browser trusted authority (CA) se check karta hai. Phir dono ek <strong>secret key</strong> tay karte hain.</li></ul>`},
{t:`Step 4: HTTP request`, code:`
GET / HTTP/1.1
Host: google.com
Accept: text/html`, after:`<p>Server HTML wapas bhejta hai, sab encrypted channel me.</p>`},
{t:`Step 5 aur 6: Parse aur render`, b:`<ol><li>HTML se <strong>DOM</strong> tree banta hai.</li><li>CSS se <strong>CSSOM</strong> banta hai.</li><li>Normal <code>&lt;script&gt;</code> HTML padhna rok deta hai. <code>async</code>/<code>defer</code> nahi rokte.</li><li>DOM + CSSOM = render tree → <strong>layout</strong> (kahan, kitna bada) → <strong>paint</strong> (rang) → screen pe.</li></ol>`}
],
say:`First the browser resolves the domain through DNS, checking caches and then a recursive resolver, which queries the root, TLD and authoritative servers. It opens a TCP connection to port 443 with a three-way handshake, then performs a TLS handshake where the server's certificate is verified and a session key is agreed. The browser sends an HTTP GET request over the encrypted connection. It parses the HTML into the DOM and CSS into the CSSOM, builds the render tree, then does layout, paint and compositing.`,
hook:`DNS → TCP → TLS → HTTP → Parse → Render.`,
check:[[`TLS me certificate kyun check hota hai?`,`Ye confirm karne ke liye ki server asli hai, nakli nahi.`]]
},
{
h:`HTTP versions, redirects aur HTTPS`,
words:[
[`Redirect`,`Server kehta hai "ye cheez ab doosre URL pe hai".`],
[`Symmetric encryption`,`Ek hi key se lock aur unlock. Fast.`],
[`Asymmetric encryption`,`Public key se lock, private key se unlock. Slow.`]
],
steps:[
{t:`301 vs 302`, b:`<ul><li><strong>301 (permanent):</strong> browser isko <strong>yaad rakh leta hai</strong>. Galti se 301 diya to users baar baar purane redirect pe jaate rahenge, fix karna mushkil.</li><li><strong>302 (temporary):</strong> yaad nahi rakhta.</li><li>Method (POST) same rakhna ho to <strong>307 / 308</strong>.</li></ul>`},
{t:`HTTP/1.1 vs 2 vs 3`, b:`<div class="tbl-wrap"><table>
<tr><th>Version</th><th>Kya naya</th><th>Problem</th></tr>
<tr><td>HTTP/1.1</td><td>ek connection pe ek request</td><td>browser 6 connection kholta hai</td></tr>
<tr><td>HTTP/2</td><td>ek connection pe kai requests saath</td><td>ek packet khoya to sab rukte hain (TCP)</td></tr>
<tr><td>HTTP/3</td><td>QUIC (UDP pe) chalta hai</td><td>ek khoya packet sirf apni request rokta hai</td></tr>
</table></div>`},
{t:`HTTPS me 2 tarah ki encryption kyun?`, b:`<ul><li><strong>Asymmetric</strong> (slow): sirf shuru me, server ki pehchaan aur secret key tay karne ke liye.</li><li><strong>Symmetric</strong> (fast): baaki saara data isi se encrypt hota hai.</li></ul><p>Real life: pehli baar ek taale wale dabbe me secret chaabi bhej di. Uske baad sab baatein usi chaabi se.</p>`}
],
say:`A 301 is a permanent redirect that browsers cache aggressively, while a 302 is temporary; 307 and 308 preserve the request method. HTTP/1.1 handles one request at a time per connection, HTTP/2 multiplexes many streams over one TCP connection but suffers TCP head-of-line blocking, and HTTP/3 runs over QUIC on UDP to avoid it. HTTPS uses asymmetric cryptography only to authenticate the server and agree a session key, then encrypts data with fast symmetric encryption.`,
hook:`301 = yaad reh jaata hai. HTTPS: shuru me asymmetric, baad me symmetric.`,
check:[[`HTTP/2 ki badi problem kya hai?`,`TCP pe hai, to ek packet khoya to saari streams ruk jaati hain.`]]
},
{
h:`CORS: browser ka security guard`,
words:[
[`Origin`,`Scheme + host + port. Jaise <code>https://algorace.app:443</code>`],
[`Same-origin policy`,`Browser ka rule: ek origin ka page doosre origin ka response padh nahi sakta.`],
[`Preflight`,`Asli request se pehle browser ki bheji OPTIONS request: "kya allowed hai?"`]
],
steps:[
{t:`Origin kya hai`, b:`<div class="tbl-wrap"><table>
<tr><th>URL</th><th>https://app.com jaisa same origin?</th></tr>
<tr><td>https://app.com/page2</td><td>haan (sirf path alag)</td></tr>
<tr><td>http://app.com</td><td>nahi (scheme alag)</td></tr>
<tr><td>https://api.app.com</td><td>nahi (host alag)</td></tr>
<tr><td>https://app.com:8080</td><td>nahi (port alag)</td></tr>
</table></div>`},
{t:`Ye rule kyun hai?`, b:`<p>Tum bank me logged in ho. Ek kharaab website kholi. Rule na hota to wo website tumhare browser se bank ko request bhej ke <strong>tumhara balance padh</strong> leti (cookie apne aap jaati hai).</p><p>Same-origin policy isse rokti hai. <strong>CORS</strong> wo tareeka hai jisse server kehta hai "is origin ko padhne do".</p>`},
{t:`Preflight kab hota hai`, b:`<p>Browser pehle <code>OPTIONS</code> request bhejta hai jab:</p><ul><li>Method GET/POST/HEAD ke alawa ho (PUT, DELETE)</li><li>Custom header ho, jaise <code>Authorization</code></li><li>Content-Type JSON ho</li></ul><p>Server ko jawab dena hota hai: <code>Access-Control-Allow-Origin</code>, <code>-Methods</code>, <code>-Headers</code>.</p>`},
{t:`Postman me chalta hai, browser me nahi. Kyun?`, b:`<p>CORS <strong>browser</strong> check karta hai, server nahi. Postman aur curl me koi security guard hai hi nahi. Isliye wahan request chal jaati hai.</p>`},
{t:`Galatfehmi: CORS server ko bachata hai`, b:`<p><strong>Nahi.</strong> CORS <strong>users</strong> ko bachata hai. Hacker curl se tumhara server waise bhi call kar sakta hai. <code>Access-Control-Allow-Origin: *</code> lagane se kuch "fix" nahi hota, bas users ki ek suraksha hat jaati hai.</p>`}
],
say:`The same-origin policy stops a page from reading responses from a different origin, where origin is the scheme, host and port. CORS lets a server opt in by sending headers like Access-Control-Allow-Origin. It is enforced by the browser, not the server, which is why a request can work in Postman but fail in the browser. For non-simple requests — other methods, custom headers like Authorization, or JSON bodies — the browser first sends an OPTIONS preflight. CORS protects users from malicious sites reading their authenticated data; it does not protect the server.`,
hook:`CORS = browser ka guard. Users ko bachata hai, server ko nahi.`,
check:[[`<code>https://app.com</code> aur <code>https://app.com:8080</code> same origin?`,`Nahi, port alag hai.`]]
}
],
cards:[
{q:`TCP vs UDP?`, s:`TCP: connection, delivery aur order ki guarantee, slow (phone call). UDP: kuch guarantee nahi, fast (video, games, DNS).`, a:`TCP is connection-oriented with guaranteed, ordered delivery and congestion control. UDP is connectionless with no guarantees but lower latency, suited to video, games and DNS.`},
{q:`Why does TCP use a three-way handshake?`, s:`Dono side confirm karein ki saamne wala bhej aur sun sakta hai, aur sequence numbers tay hon. 2 me server ko pata nahi chalega uska SYN pahuncha.`, a:`So both sides confirm the other can send and receive and agree on initial sequence numbers. With two messages, the server would not know its SYN arrived.`},
{q:`What happens when you type a URL and press Enter?`, s:`DNS (naam → IP) → TCP handshake → TLS (certificate + key) → HTTP GET → HTML se DOM, CSS se CSSOM → layout → paint.`, a:`DNS resolution, a TCP handshake, a TLS handshake, an HTTP request, then parsing HTML into the DOM and CSS into the CSSOM, followed by layout, paint and compositing.`},
{q:`Flow control vs congestion control?`, s:`Flow: receiver kehta hai kitna bhejo (receiver ko bachata). Congestion: sender network ki bheed dekh ke speed kam karta (network ko bachata).`, a:`Flow control is receiver-driven and prevents overwhelming the receiver. Congestion control is sender-driven and prevents overloading the network.`},
{q:`301 vs 302?`, s:`301 permanent, browser yaad rakhta hai. 302 temporary. Method same rakhna ho to 307/308.`, a:`301 is a permanent redirect that browsers cache; 302 is temporary. 307 and 308 preserve the request method.`},
{q:`HTTP/1.1 vs HTTP/2 vs HTTP/3?`, s:`1.1: ek connection ek request. 2: ek connection kai requests, lekin TCP packet khoya to sab ruke. 3: QUIC/UDP, ye problem nahi.`, a:`HTTP/1.1 serves one request at a time per connection; HTTP/2 multiplexes streams over one TCP connection but has head-of-line blocking; HTTP/3 uses QUIC over UDP to avoid it.`},
{q:`Why does TLS use both asymmetric and symmetric encryption?`, s:`Asymmetric slow hai, sirf shuru me pehchaan aur key tay karne ke liye. Baaki data fast symmetric se.`, a:`Asymmetric cryptography is slow, so it is used only to authenticate the server and agree a session key; bulk data is encrypted with fast symmetric encryption.`},
{q:`What is CORS and who enforces it?`, s:`Server ka tareeka ki doosre origin ko response padhne de. Browser enforce karta hai, isliye Postman me chal jaata hai.`, a:`CORS lets a server allow cross-origin reads via response headers. The browser enforces it, which is why the same request can work in Postman but fail in a browser.`},
{q:`When does the browser send a preflight request?`, s:`PUT/DELETE jaisa method, Authorization jaisa custom header, ya JSON content type ho to pehle OPTIONS bhejta hai.`, a:`For non-simple requests: methods other than GET, POST or HEAD, custom headers like Authorization, or content types such as JSON.`}
]

TOPICS.push({
id:'compiler', name:'Compilers & WebAssembly', tier:'crit',
intro:`MiniLang tumhe baaki candidates se alag banata hai. Bahut kam logon ne apna compiler banaya hota hai. Lekin isi wajah se sabse gehre sawaal yahin aayenge, aur parser samjha nahi sake to project turant kamzor lagega.`,
lessons:[
{
h:`Compiler ke 4 stages`,
words:[
[`Compiler`,`Program jo tumhara code padh ke machine ke samajhne layak instructions banata hai.`],
[`Token`,`Code ka ek shabd, jaise <code>let</code>, <code>x</code>, <code>=</code>, <code>2</code>.`],
[`AST`,`Abstract Syntax Tree: code ka tree jo batata hai kaunsa hissa kisse juda hai.`],
[`Bytecode`,`Chhoti simple instructions jo VM chalata hai.`],
[`VM`,`Virtual Machine: software ka chhota computer jo bytecode chalata hai.`]
],
steps:[
{t:`Real life samjho`, b:`<p>Compiler code ko waise padhta hai jaise tum ek sentence padhte ho:</p><ol><li>Shabd alag karo (<strong>lexer</strong>)</li><li>Grammar samjho, kaun kisse juda (<strong>parser</strong>)</li><li>Matlab check karo. "Table ne idea khaya" grammar me sahi, matlab me galat (<strong>semantic analysis</strong>)</li><li>Simple steps me translate karo (<strong>code generation</strong>)</li></ol>`},
{t:`Stage 1: Lexer`, code:`
Code:    let x = 2 + 3;
Tokens:  LET  IDENT(x)  EQUAL  NUM(2)  PLUS  NUM(3)  SEMICOLON`, after:`<p>Space aur comments hat jaate hain. Har token ke saath <strong>line aur column</strong> bhi save hota hai, taaki error message sahi jagah dikha sake.</p>`},
{t:`Stage 2: Parser`, d:`pipeline`, b:`<p>Tokens se <strong>AST</strong> banta hai. <code>2 + 3 * 4</code> me <code>*</code> <strong>neeche</strong> hai, kyunki wo pehle hoga. Tree ka shape hi precedence batata hai.</p>`},
{t:`Stage 3: Semantic analysis`, b:`<p>Yahan <strong>symbol table</strong> banti hai: har variable ka naam, type, scope.</p><ul><li><code>y = 5</code> likha lekin <code>y</code> declare nahi kiya: error</li><li><code>int a = "hello"</code>: type error</li></ul><p>"MiniLang statically typed hai" ka matlab yahi: ye errors <strong>chalane se pehle</strong> pakde jaate hain.</p>`},
{t:`Stage 4: Code generation`, code:`
2 + 3 * 4   becomes:

PUSH 2
PUSH 3
PUSH 4
MUL
ADD`, after:`<p>AST ko neeche se upar padh ke instructions banti hain. Phir <strong>VM</strong> inhe chalata hai.</p>`}
],
say:`My compiler has four stages. The lexer turns characters into tokens and records line and column numbers. The parser turns tokens into an abstract syntax tree, where the tree shape encodes operator precedence. The semantic analyzer builds a scoped symbol table and checks names and types, which is where static typing happens. The code generator walks the tree and emits bytecode, which a stack-based virtual machine executes.`,
hook:`Characters → tokens → AST → checked AST → bytecode → VM.`,
check:[[`"Undeclared variable" error kis stage me pakda jaata hai?`,`Semantic analysis me, symbol table se.`]]
},
{
h:`Parser: recursive descent aur precedence`,
words:[
[`Grammar`,`Language ke rules, jaise "expression = term + term".`],
[`Recursive descent`,`Har grammar rule ke liye ek function, jo doosre rules ke functions call karta hai.`],
[`Precedence`,`Kaunsa operator pehle chalega (BODMAS).`],
[`Associativity`,`Same operators me left se ya right se: <code>a - b - c</code>.`]
],
steps:[
{t:`Recursive descent kya hai`, code:`
expression  →  term ( ("+" | "-") term )*
term        →  factor ( ("*" | "/") factor )*
factor      →  NUMBER | "(" expression ")"`, after:`<p>Har line ke liye ek function: <code>parseExpression()</code>, <code>parseTerm()</code>, <code>parseFactor()</code>. Expression term ko call karta hai, term factor ko.</p><p>Isko <strong>LL(1)</strong> parser bhi kehte hain: left se padho, ek token aage dekh ke decide karo.</p>`},
{t:`Precedence tree ke shape se aati hai`, b:`<p><code>*</code> wala function (<code>parseTerm</code>) <code>+</code> wale se <strong>neeche</strong> call hota hai. To <code>*</code> tree me <strong>gehra</strong> jaata hai aur pehle calculate hota hai. Yahi BODMAS hai.</p>`},
{t:`Left recursion: parser hamesha ke liye atak jaata hai`, code:`
expression  →  expression "+" term     // left recursion

Expr parseExpression() {
    Expr left = parseExpression();      // pehla kaam: khud ko call!
    ...
}`, after:`<p>Function <strong>ek bhi token padhe bina</strong> khud ko call karta hai. Infinite recursion, stack overflow.</p><p>Real life: recipe me likha hai "soup banane ke liye pehle soup banao". Shuru hi nahi hoga.</p>`},
{t:`Fix: while loop`, code:`
Expr parseExpression() {
    Expr left = parseTerm();
    while (match(PLUS) || match(MINUS)) {
        Token op = previous();
        Expr right = parseTerm();
        left = make<Binary>(std::move(left), op, std::move(right));
    }
    return left;
}`, after:`<p>Loop har baar purane <code>left</code> ko naye node me lapet deta hai. Isse <code>a - b - c</code> = <code>(a - b) - c</code> banta hai: <strong>left associative</strong>.</p><p>Right associative (jaise <code>=</code>) chahiye to loop ki jagah khud ko recursion se call karo.</p>`},
{t:`Parse tree vs AST`, b:`<ul><li><strong>Parse tree:</strong> grammar ki har cheez, brackets bhi, har beech ka rule bhi.</li><li><strong>AST:</strong> sirf kaam ki cheez. Brackets hat jaate hain, kyunki unka asar tree ke shape me aa chuka hai.</li></ul><p>AST isliye, kyunki aage ke saare stages isi pe chalte hain.</p>`}
],
say:`Recursive descent is a top-down parser with one function per grammar rule, which handles LL grammars. Precedence comes from the call structure: the function for multiplication is called from the function for addition, so multiplication ends up deeper in the tree and is evaluated first. Left recursion makes a recursive descent function call itself before consuming any token, causing infinite recursion, so I rewrite it as a loop, which also gives left associativity. The AST keeps only meaningful structure, unlike a parse tree.`,
hook:`Left recursion = soup banane ke liye soup. Fix = while loop.`,
check:[[`<code>a - b - c</code> ka sahi grouping?`,`<code>(a - b) - c</code>. Left associative.`]]
},
{
h:`Stack-based VM kaise chalta hai`,
words:[
[`Stack`,`Plates ka dher. Upar se hi rakho, upar se hi uthao.`],
[`Instruction pointer (IP)`,`Batata hai abhi kaunsi instruction chalani hai.`],
[`Opcode`,`Instruction ka code, jaise PUSH, ADD.`]
],
steps:[
{t:`Real life samjho`, b:`<p>Calculator jisme <strong>plates ka dher</strong> hai. PUSH = plate upar rakho. ADD = upar ki 2 plates uthao, jodo, ek plate wapas rakho.</p>`},
{t:`2 + 3 * 4 ko step by step chalao`, b:`<div class="tbl-wrap"><table>
<tr><th>Instruction</th><th>Stack (neeche → upar)</th></tr>
<tr><td>PUSH 2</td><td>2</td></tr>
<tr><td>PUSH 3</td><td>2, 3</td></tr>
<tr><td>PUSH 4</td><td>2, 3, 4</td></tr>
<tr><td>MUL</td><td>2, 12</td></tr>
<tr><td>ADD</td><td>14</td></tr>
</table></div>`},
{t:`VM ka main loop (fetch-decode-execute)`, code:`
while (true) {
    Op op = code[ip++];                // FETCH: instruction lo
    switch (op) {                      // DECODE: kaunsi hai?
        case PUSH: stack.push(code[ip++]); break;
        case ADD: { int b = stack.pop();
                    int a = stack.pop();
                    stack.push(a + b); break; }
        case JUMP: ip = code[ip]; break;
        case HALT: return;
    }                                  // EXECUTE ho gaya
}`},
{t:`Stack VM vs Register VM`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>Stack-based</th><th>Register-based</th></tr>
<tr><td>Instruction</td><td><code>PUSH 2; PUSH 3; ADD</code></td><td><code>ADD r1, r2, r3</code></td></tr>
<tr><td>Code banana</td><td>bahut aasaan (tree se seedha)</td><td>mushkil (register allocation)</td></tr>
<tr><td>Speed</td><td>zyada instructions</td><td>kam instructions, fast</td></tr>
<tr><td>Examples</td><td>JVM, Python, WebAssembly</td><td>Lua, Android Dalvik</td></tr>
</table></div><p>Zyada tar khud ke banaye VM stack-based hote hain, kyunki AST se code banana seedha hai.</p>`}
],
say:`My VM is stack-based. Instructions take their operands from an operand stack, so 2 plus 3 times 4 becomes push 2, push 3, push 4, multiply, add. It runs a fetch-decode-execute loop: fetch the instruction at the instruction pointer, decode the opcode in a switch, execute it by popping and pushing, and advance the pointer or jump. Stack VMs are easy to generate code for by walking the AST, which is why the JVM, CPython and WebAssembly use them. Register VMs execute fewer instructions but need register allocation.`,
hook:`Stack VM = plates ka dher. Fetch → decode → execute.`,
check:[[`JVM stack-based hai ya register-based?`,`Stack-based.`]]
},
{
h:`WebAssembly aur Emscripten`,
words:[
[`WebAssembly (WASM)`,`Browser me lagbhag native speed se chalne wala low-level code format.`],
[`Linear memory`,`WASM ki memory: ek lambi byte array jo JavaScript ke saath share hoti hai.`],
[`Emscripten`,`Tool jo C/C++ ko WebAssembly me compile karta hai.`]
],
steps:[
{t:`WebAssembly kya hai`, b:`<p>C/C++ jaisi language ko browser me <strong>tez</strong> chalane ka tareeka. JavaScript ke saath chalta hai, uski jagah nahi leta.</p><p>Isme sirf <strong>4 types</strong> hain: i32, i64, f32, f64. Bas numbers.</p>`},
{t:`Memory: ek lamba shelf`, b:`<p>WASM ki memory ek <strong>lamba numbered shelf</strong> hai (byte array), jo JavaScript bhi dekh sakta hai.</p><p><strong>String type hai hi nahi!</strong></p>`},
{t:`JavaScript se string kaise bhejein`, b:`<ol><li>WASM ke andar memory maango (allocate).</li><li>String ke letters us jagah likho.</li><li>WASM function ko do cheezein do: <strong>kahan se shuru (pointer)</strong> aur <strong>kitne letters (length)</strong>.</li><li>Kaam ke baad memory free karo.</li></ol><p>Real life: "shelf number 100 se shuru, 5 letters padho".</p>`},
{t:`Emscripten kya banata hai`, b:`<ul><li>Ek <code>.wasm</code> file (tumhara compiled C++)</li><li>Ek <strong>JavaScript glue file</strong> jo wasm load karti hai, memory set karti hai, aur C library ki cheezein provide karti hai</li></ul><p>C++ function JS ko dene ke 2 tareeke: <strong>embind</strong> (<code>EMSCRIPTEN_BINDINGS</code>, C++ classes aur strings aasaani se), ya <code>EMSCRIPTEN_KEEPALIVE</code> + <code>ccall</code>.</p>`},
{t:`VM ko JS me dobara kyun nahi likha?`, b:`<ul><li><strong>Ek hi code:</strong> C++ aur JS do versions rakhte to dono alag behave karne lagte.</li><li><strong>Speed:</strong> lagbhag native, aur predictable.</li><li><strong>Server nahi chahiye:</strong> sab browser me chalta hai, koi hosting cost nahi, koi sandbox server nahi.</li></ul>`}
],
say:`WebAssembly is a compact binary format that runs in the browser at near-native speed. It has only four numeric types and a single linear memory, which is a resizable byte array shared with JavaScript. There is no string type, so to pass a string I allocate memory inside WebAssembly, write the bytes, and pass a pointer and a length. Emscripten compiles C++ into a wasm module plus JavaScript glue code, and functions can be exposed with embind or exported and called through ccall. I compiled the VM instead of rewriting it so there is one implementation, predictable performance, and no server.`,
hook:`WASM me string nahi. String bhejo = pointer + length.`,
check:[[`WASM me kitne value types hain?`,`4: i32, i64, f32, f64.`]]
}
],
cards:[
{q:`What are the four stages of your compiler?`, s:`Lexer (chars → tokens), Parser (tokens → AST), Semantic analysis (symbol table, type check), Code generation (AST → bytecode). Phir VM chalata hai.`, a:`The lexer produces tokens, the parser builds an AST, semantic analysis resolves names and checks types using a symbol table, and code generation emits bytecode for the VM.`},
{q:`What does the semantic analyzer do?`, s:`Symbol table banata hai, undeclared variables aur type errors pakadta hai, chalane se pehle. Isi ko static typing kehte hain.`, a:`It builds a scoped symbol table, resolves identifiers and checks types, reporting errors like undeclared variables before the program runs.`},
{q:`How does a recursive descent parser handle precedence?`, s:`Har precedence level ka alag function. * wala function + wale ke andar se call hota hai, to * tree me neeche jaata hai aur pehle chalta hai.`, a:`With one function per precedence level, where higher-precedence levels are called from lower ones, so tighter operators end up deeper in the AST.`},
{q:`Why does left recursion break recursive descent?`, s:`Function bina token padhe khud ko call karta hai: infinite recursion. Fix: while loop.`, a:`The function for a rule like expression → expression + term calls itself before consuming a token, causing infinite recursion. Rewrite it as a loop.`},
{q:`Parse tree vs AST?`, s:`Parse tree me grammar ki sab cheezein (brackets bhi). AST me sirf kaam ki cheezein, kyunki brackets ka asar shape me aa gaya.`, a:`A parse tree contains every grammar symbol including parentheses; an AST keeps only the meaningful structure, since precedence is already captured in its shape.`},
{q:`Stack-based vs register-based VM?`, s:`Stack: PUSH/ADD, code banana aasaan (JVM, Python, WASM). Register: kam instructions, fast, lekin register allocation chahiye.`, a:`Stack VMs take operands implicitly from a stack, making code generation simple. Register VMs name operands explicitly and execute fewer instructions but need register allocation.`},
{q:`Trace the bytecode for 2 + 3 * 4.`, s:`PUSH 2, PUSH 3, PUSH 4, MUL (stack: 2, 12), ADD (stack: 14).`, a:`PUSH 2, PUSH 3, PUSH 4, MUL leaves 2 and 12 on the stack, then ADD leaves 14.`},
{q:`How do you pass a string from JavaScript to WebAssembly?`, s:`WASM me string type nahi. Andar memory lo, letters likho, pointer + length do, baad me free karo.`, a:`WebAssembly has no string type, so allocate memory in the module, write the encoded bytes into linear memory, pass a pointer and length, and free it afterwards.`},
{q:`Why compile the VM to WebAssembly instead of rewriting it in JavaScript?`, s:`Ek hi codebase, lagbhag native speed, aur server ki zaroorat nahi.`, a:`It keeps a single implementation, gives predictable near-native performance, and runs entirely in the browser without a server.`}
]
});

TOPICS.push({

intro:`S3 Summer Labs ki internship tumhare resume ki sabse strong cheez hai. Isme GPR, Bayesian Optimization aur SHAP likha hai, jo advanced topics hain. ML interviewer seedha R² = 0.91 pe sawaal karega, aur ek sawaal aisa hai jiske liye tumhe pakka tayyar rehna hai.`,
lessons:[
{
h:`ML basics: training, testing aur overfitting`,
words:[
[`Model`,`Data se seekha hua formula jo prediction karta hai.`],
[`Feature`,`Input jo model ko diya jaata hai. Jaise LED signal ki value.`],
[`Label / target`,`Jo predict karna hai. Jaise hemoglobin.`],
[`Overfitting`,`Model ne training data rat liya, naye data pe fail.`],
[`Cross-validation`,`Data ko kai hisson me baant ke baar baar test karna.`]
],
steps:[
{t:`Train aur test alag kyun?`, b:`<p>Student ko wahi sawaal exam me do jo usne ratte the, to 100% aayega. Lekin usne <strong>samjha</strong> ya nahi, pata nahi chalega.</p><p>Isliye data do hisson me: <strong>train</strong> (padhne ke liye) aur <strong>test</strong> (exam, jo model ne kabhi nahi dekha).</p>`},
{t:`Overfitting vs underfitting`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>Train score</th><th>Test score</th><th>Matlab</th></tr>
<tr><td>Underfitting</td><td>kam</td><td>kam</td><td>model bahut simple</td></tr>

],
say:`We split data into training and test sets so the model is evaluated on data it has never seen. Overfitting means high training performance but poor test performance, because the model memorized noise; underfitting means poor performance on both. Bias is error from overly simple assumptions and variance is sensitivity to the specific training data, and increasing model complexity lowers bias but raises variance. K-fold cross-validation trains and tests k times on different splits and averages the scores for a more reliable estimate.`,
hook:`Train achha, test bura = overfitting (ratta).`,
check:[[`Train 99%, test 60%. Kya problem?`,`Overfitting.`]]
},
{
h:`Sabse important sawaal: patient data leakage`,
words:[
[`Data leakage`,`Test ki jaankari galti se training me pahunch jaana. Score jhootha achha aata hai.`],
[`GroupKFold`,`Cross-validation jo ek group (jaise ek patient) ka saara data ek hi side rakhta hai.`]
],
steps:[

{t:`Sahi tareeka: patient se split karo`, code:`
from sklearn.model_selection import GroupKFold, cross_val_score

gkf = GroupKFold(n_splits=5)
scores = cross_val_score(model, X, y, groups=patient_ids, cv=gkf)`, after:`<p>Ab ek patient ke <strong>saare</strong> samples ya to train me hain ya test me. Kabhi dono me nahi.</p>`},
{t:`Interview me kaise sambhalein`, b:`<p><strong>Agar tumne patient se split kiya tha:</strong> turant bolo aur kyun zaroori hai wo bhi bolo. Ye ek line tumhe bahut strong dikhayegi.</p><p><strong>Agar nahi kiya tha:</strong> <strong>sach bolo.</strong> "Maine random k-fold use kiya tha, jisme patient leakage hota hai. Ab main GroupKFold se dobara karta, aur honest R² shayad kam aata." Ye answer galat 0.91 ko defend karne se <strong>kahin zyada</strong> respect dilata hai.</p><p><strong>Pehle apna code check karo ki tumne kya kiya tha.</strong></p>`}
],
say:`My dataset had multiple samples per patient, so random k-fold cross-validation would leak patient identity between training and test folds. The model could learn individual characteristics like skin tone and sensor placement rather than the underlying physiology, inflating the score. The correct approach is GroupKFold with patient ID as the group, so all samples from one patient are on the same side of the split, which gives an honest estimate for new patients.`,
hook:`Same patient train aur test dono me = leakage. GroupKFold by patient.`,
check:[[`Leakage se score kaisa dikhta hai?`,`Jhootha achha. Naye patient pe model fail hota hai.`]]
},
{
h:`Metrics: R², RMSE aur MAE`,
words:[
[`R²`,`Model data ke upar-neeche hone ka kitna hissa samjha pa raha hai (0 se 1).`],
[`RMSE`,`Average galti, badi galtiyon ko zyada saza. Asli units me.`],
[`MAE`,`Seedha average galti. Asli units me.`]
],
steps:[
{t:`R² = 0.91 ka matlab`, b:`<p>Hemoglobin ki values patients me upar-neeche hoti hain. R² = 0.91 matlab us upar-neeche ka <strong>91% hissa</strong> model samjha pa raha hai.</p>`},
{t:`R² dhokha kaise deta hai`, b:`<ul><li><strong>Data ki range pe depend:</strong> data me bahut kam se bahut zyada values ho to R² apne aap achha aata hai.</li><li>Faaltu feature jodne pe bhi R² <strong>kabhi kam nahi</strong> hota.</li><li><strong>Koi unit nahi:</strong> doctor ko "0.91" se kuch pata nahi chalta.</li></ul>`},
{t:`Doctor ko kya chahiye: RMSE / MAE`, b:`<p>Doctor poochega: <strong>"kitne g/dL galat hai?"</strong></p><p>Example: MAE = 0.8 g/dL matlab average 0.8 g/dL ki galti. Ye number decide karta hai device kaam ka hai ya nahi.</p><p><strong>Bonus point:</strong> medical device ke liye standard <strong>Bland-Altman plot</strong> hai (bias aur limits of agreement). Ye naam lena strong signal hai.</p>`}
],
say:`R squared is the fraction of variance in the target explained by the model, so 0.91 means ninety-one percent of the variation is captured. But it depends on the spread of the sample, never decreases when features are added, and has no units. For a clinical estimate I would always report RMSE or MAE in grams per decilitre, because that tells a clinician how far off the prediction is, and I would use a Bland-Altman analysis to assess agreement with the reference method.`,
hook:`R² akele mat bolo. RMSE/MAE g/dL me bolo.`,
check:[[`Doctor ko kaunsa number samajh aayega: R² ya MAE?`,`MAE, kyunki wo g/dL me hai.`]]
},
{
h:`Models: Random Forest, Gradient Boosting, L1 aur L2`,
words:[
[`Decision tree`,`Haan/nahi sawaalon ki chain jo prediction tak le jaati hai.`],
[`Ensemble`,`Kai models ko milake ek behtar model.`],
[`Regularization`,`Model ko zyada complex hone se rokne ki saza.`]
],
steps:[
{t:`Random Forest`, b:`<p>500 alag logon se andaaza poochho aur <strong>average</strong> lo. Kisi ki galti ek taraf, kisi ki doosri taraf, cancel ho jaati hai.</p><ul><li>Bahut saare gehre trees, <strong>parallel</strong> me, random data aur random features pe.</li><li><strong>Variance kam</strong> karta hai.</li><li>Trees badhaane se overfit nahi hota.</li></ul>`},
{t:`Gradient Boosting`, b:`<p>Relay race: har naya runner <strong>pichhle ki galti theek</strong> karta hai.</p><ul><li>Chhote trees, <strong>ek ke baad ek</strong>. Har tree pichhli galti (residual) pe train hota hai.</li><li><strong>Bias kam</strong> karta hai.</li><li>Zyada rounds pe <strong>overfit ho sakta hai</strong>, isliye learning rate aur early stopping chahiye.</li></ul>`},
{t:`L1 vs L2`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>L1 (Lasso)</th><th>L2 (Ridge)</th></tr>
<tr><td>Kya karta hai</td><td>kuch weights <strong>bilkul 0</strong></td><td>sab weights thode chhote</td></tr>
<tr><td>Real life</td><td>strict editor: faaltu shabd hata do</td><td>narm editor: sab thoda chhota karo</td></tr>
<tr><td>Kab</td><td>feature selection chahiye</td><td>features aapas me jude hon</td></tr>
</table></div>`}
],
say:`Random Forest trains many deep trees in parallel on bootstrap samples with random feature subsets and averages them, which mainly reduces variance. Gradient Boosting trains shallow trees sequentially, each fitting the errors of the previous ensemble, which mainly reduces bias but can overfit without a learning rate and early stopping. L1 regularization drives some weights exactly to zero and performs feature selection, while L2 shrinks all weights smoothly.`,
hook:`RF = parallel, variance kam. Boosting = sequence, bias kam. L1 = features hatao.`,
check:[[`Kaunsa zyada overfit karta hai: RF ya Boosting?`,`Gradient Boosting, agar rounds bahut zyada hon.`]]
},
{
h:`GPR, Bayesian Optimization, SHAP aur PPG signal`,
words:[
[`GPR`,`Gaussian Process Regression: prediction ke saath uncertainty bhi deta hai.`],
[`Kernel`,`Rule jo batata hai do inputs kitne "milte julte" hain.`],
[`Hyperparameter`,`Model ki setting jo training se pehle chuni jaati hai (jaise tree depth).`],
[`PPG`,`Photoplethysmography: light se blood flow napna (finger pe camera/LED).`]
],
steps:[
{t:`GPR: "kitna pakka hoon" bhi batata hai`, b:`<p>Weather forecaster jo kehta hai: weather station ke paas "30°C ± 2", aur jungle ke beech "30°C ± 15". Jahan data nahi, wahan <strong>uncertainty badh</strong> jaati hai.</p><ul><li><strong>Kernel</strong> (jaise RBF): paas ke inputs ka output bhi milta julta hoga.</li><li>Har point pe <strong>mean + variance</strong> deta hai.</li></ul>`},
{t:`Chhote clinical data pe GPR kyun?`, b:`<ul><li><strong>Uncertainty sabse zaroori:</strong> ajeeb reading aayi to model keh sakta hai "mujhe bharosa nahi". Medical device me ye bahut zaroori hai.</li><li>200 samples pe neural network overfit karega. GPR chhote data pe achha chalta hai.</li><li>Dikkat: O(n³). 200 pe theek, 10 lakh pe nahi.</li></ul>`},
{t:`Bayesian Optimization`, b:`<p>Khazana dhoondhne wala jo <strong>har pichhli khudai</strong> dekh ke agli jagah chunta hai.</p><ul><li>Ab tak ke results pe ek surrogate model (GPR) banao.</li><li><strong>Acquisition function</strong> (EI ya UCB) agla point chunta hai: jahan achha lagta hai (exploit) ya jahan pata nahi (explore).</li><li>Grid search pichhle results <strong>ignore</strong> karta hai. BO sab use karta hai, isliye kam tries me achha answer.</li></ul>`},
{t:`SHAP: kis feature ne kitna yogdaan diya`, b:`<p>Team jeeti. Har player ko kitna credit? Har possible team combination me dekho ki player jodne se kitna farak pada, aur average lo. Yahi <strong>Shapley value</strong>.</p><ul><li><strong>Local:</strong> <em>is</em> patient ki prediction kyun aisi aayi.</li><li><strong>Global:</strong> poore data pe kaunsa feature sabse important.</li></ul>`},
{t:`PPG signal aur bandpass filter`, b:`<p>Dil ki dhadkan se finger me blood flow badalta hai, jo light me dikhta hai.</p><ul><li>Dhadkan aam taur pe <strong>30 se 240 bpm</strong> = <strong>0.5 se 4 Hz</strong>.</li><li><strong>Bandpass filter</strong> sirf is range ko rakhta hai: bahut dheemi cheezein (saans, haath hilna) aur bahut tez (noise) hata deta hai.</li></ul><p><strong>Apne project ke asli numbers yaad karo.</strong> Ye tumhara kaam hai, poocha jaayega.</p>`},
{t:`NumPy loop se fast kyun?`, b:`<ul><li>Python loop: har element pe interpreter kaam karta hai, har number ek alag object.</li><li>NumPy: numbers ek lagataar array me, aur ek hi <strong>C loop</strong> sab pe chalta hai.</li><li>Result: 10 se 100 guna fast.</li></ul>`}
],
say:`Gaussian Process Regression places a prior over functions defined by a kernel, and returns both a mean prediction and a variance, so uncertainty grows away from the training data. That makes it well suited to a small clinical dataset, where knowing when not to trust a prediction matters. Bayesian Optimization fits a surrogate model to previous results and uses an acquisition function to balance exploration and exploitation, so it finds good hyperparameters in fewer evaluations than grid search. SHAP uses Shapley values to fairly attribute each prediction to features, both locally and globally.`,
hook:`GPR = prediction + "kitna pakka". BO = pichhle results se agla try. SHAP = fair credit.`,
check:[[`PPG ke liye bandpass range lagbhag kya?`,`0.5 se 4 Hz (30 se 240 bpm).`]]
}
],
cards:[
{q:`Why is random k-fold wrong for data with multiple samples per patient?`, s:`Same patient train aur test dono me aa jaata hai. Model patient ko pehchaan leta hai, score jhootha achha. GroupKFold by patient use karo.`, a:`It leaks patient identity across folds, so the model learns individual characteristics and the score is inflated. Use GroupKFold with patient ID as the group.`},
{q:`What is overfitting?`, s:`Model ne training data rat liya. Train pe bahut achha, naye data pe bura.`, a:`When a model fits the training data, including its noise, so well that it performs poorly on unseen data.`},
{q:`Explain the bias-variance tradeoff.`, s:`Bias = simple soch se galti. Variance = data badla to model bahut badla. Complex model: bias kam, variance zyada.`, a:`Bias is error from overly simple assumptions; variance is sensitivity to the training data. More complex models lower bias but raise variance.`},
{q:`Why can R² be misleading?`, s:`Data ki range pe depend karta hai, features jodne se kam nahi hota, aur koi unit nahi. RMSE/MAE bhi batao.`, a:`It depends on the variance of the sample, never decreases when features are added, and has no units, so report RMSE or MAE in real units as well.`},
{q:`Random Forest vs Gradient Boosting?`, s:`RF: parallel trees ka average, variance kam. GB: ek ke baad ek trees galti theek karte hain, bias kam, overfit ho sakta hai.`, a:`Random Forest averages many independent deep trees and reduces variance. Gradient Boosting builds shallow trees sequentially on residuals and reduces bias, but can overfit.`},
{q:`L1 vs L2 regularization?`, s:`L1: kuch weights bilkul 0, feature selection. L2: sab weights thode chhote.`, a:`L1 drives some weights exactly to zero and selects features; L2 shrinks all weights smoothly.`},
{q:`Why use Gaussian Process Regression on a small clinical dataset?`, s:`Prediction ke saath uncertainty deta hai, chhote data pe achha, overfit kam. Dikkat: O(n³).`, a:`It provides calibrated uncertainty, which grows away from the data, and works well with few samples. Its cost is cubic in the number of samples.`},
{q:`What does an acquisition function do in Bayesian Optimization?`, s:`Agla point chunta hai: jahan achha dikhta hai (exploit) ya jahan pata nahi (explore). Pichhle sab results use hote hain.`, a:`It chooses the next point to evaluate by balancing exploitation of promising regions and exploration of uncertain ones, using all previous results.`},
{q:`What are SHAP values?`, s:`Har feature ka fair credit: har combination me feature jodne ka average farak. Local (ek prediction) aur global (poora data).`, a:`Shapley-value based attributions that give each feature its average marginal contribution across all feature combinations, explaining individual predictions and global importance.`},
{q:`Why is NumPy faster than a Python loop?`, s:`Data ek lagataar array me, ek C loop sab pe chalta hai. Python loop har element pe interpreter aur alag object.`, a:`NumPy stores data in contiguous typed arrays and runs compiled C loops over them, avoiding per-element interpreter overhead and boxed objects.`}
]
});

id:'devops', name:'Docker, Linux & Git', tier:'mod',
intro:`Resume me CI/CD, 99.5% uptime aur zero-downtime deploy likha hai. Ye sawaal medium level pe poochhe jaate hain. Aur tumhare paas asli container debugging ka experience hai, jo kisi bhi rata hua flag se zyada kaam aayega.`,
lessons:[
{
h:`Docker basics`,
words:[

[`Container`,`Image se chalu kiya gaya running app.`],
[`Dockerfile`,`Image banane ki recipe.`],
[`Layer`,`Dockerfile ki har line ek layer banati hai.`]
],
steps:[
{t:`Image vs container`, b:`<p><strong>Image</strong> = recipe (freeze kiya hua). <strong>Container</strong> = us recipe se bana khana, jiske upar ek sticky note hai jispe likh sakte ho (writable layer). Container band hua to sticky note bhi gaya.</p>`},
{t:`Container vs VM`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>Container</th><th>VM</th></tr>
<tr><td>Kernel</td><td>host ka <strong>share</strong> karta hai</td><td>apna alag</td></tr>
<tr><td>Size</td><td>MB</td><td>GB</td></tr>
<tr><td>Start</td><td>milliseconds</td><td>seconds/minutes</td></tr>
<tr><td>Isolation</td><td>kam</td><td>zyada</td></tr>
</table></div><p>Container Linux ke <strong>namespaces</strong> (kya dikhega) aur <strong>cgroups</strong> (kitna use kar sakta hai) se banta hai.</p><p>Real life: container = ek building ke flat (plumbing share). VM = alag ghar (apni plumbing).</p>`},
{t:`Layer order kyun matter karta hai`, d:`docker`, code:`
# GALAT: code badla to npm ci dobara chalega
COPY . .
RUN npm ci

# SAHI: package.json badla tabhi npm ci dobara
COPY package*.json ./
RUN npm ci
COPY . .`, after:`<p>Ek layer badli to <strong>uske upar ki saari layers</strong> dobara banti hain. Isliye kam badalne wali cheezein upar (pehle) rakho.</p>`},
{t:`Multi-stage build`, code:`
FROM node:20 AS builder
WORKDIR /app
COPY . .
RUN npm ci && npm run build

FROM node:20-slim
COPY --from=builder /app/dist ./dist
CMD ["node", "dist/server.js"]`, after:`<p>Pehle stage me build karo, final image me sirf built files. Compiler aur dev libraries final image me nahi jaati. Image ~1GB se ~150MB tak.</p>`},
{t:`Kuch aur zaroori cheezein`, b:`<ul><li><strong>CMD vs ENTRYPOINT:</strong> ENTRYPOINT = kaunsa program. CMD = default arguments. <code>docker run</code> me arguments diye to CMD replace hota hai.</li><li><strong>Volume vs bind mount:</strong> volume Docker sambhalta hai (database data). Bind mount tumhare computer ka folder (development me live reload).</li><li><strong>Memory limit cross:</strong> OOM killer process maar deta hai, <strong>exit code 137</strong>. <code>docker inspect</code> me <code>OOMKilled: true</code>.</li></ul>`}
],
say:`An image is a stack of read-only layers built from a Dockerfile, and a container is a running instance with a writable layer on top. Containers share the host kernel and are isolated with namespaces and limited with cgroups, which makes them lighter than virtual machines but less isolated. Because a changed layer invalidates every layer after it, I copy the dependency manifest and install before copying the source code. Multi-stage builds keep build tools out of the final image. If a container exceeds its memory limit, it is OOM-killed with exit code 137.`,
hook:`Pehle package.json + install, phir code copy. OOM = exit 137.`,
check:[[`Container VM se halka kyun hai?`,`Host ka kernel share karta hai, apna OS nahi chalata.`]]
},
{
h:`Linux commands jo poochhe jaate hain`,
words:[
[`Process`,`Chalta hua program.`],
[`Permission`,`Kaun file padh, likh ya chala sakta hai.`]
],
steps:[
{t:`Problem dhoondhne ke commands`, b:`<div class="tbl-wrap"><table>
<tr><th>Kya jaanna hai</th><th>Command</th></tr>
<tr><td>Live CPU/memory</td><td><code>top</code> ya <code>htop</code></td></tr>
<tr><td>Sabse zyada memory kaun kha raha</td><td><code>ps aux --sort=-%mem | head</code></td></tr>
<tr><td>Kitni RAM bachi</td><td><code>free -h</code></td></tr>
<tr><td>Disk bhari hai?</td><td><code>df -h</code></td></tr>
<tr><td>Port 3000 kaun use kar raha</td><td><code>lsof -i :3000</code> ya <code>ss -ltnp</code></td></tr>
<tr><td>Service ke logs</td><td><code>journalctl -u myapp -f</code></td></tr>
<tr><td>File me text dhoondho</td><td><code>grep -r "error" logs/</code></td></tr>
</table></div>`},
{t:`Permissions: 755 ka matlab`, b:`<p>3 digit: <strong>owner, group, others</strong>. Har digit = read (4) + write (2) + execute (1).</p><div class="tbl-wrap"><table>
<tr><th>Digit</th><th>Jod</th><th>Matlab</th></tr>
<tr><td>7</td><td>4+2+1</td><td>rwx (sab)</td></tr>
<tr><td>5</td><td>4+1</td><td>r-x (padho, chalao)</td></tr>
<tr><td>4</td><td>4</td><td>r-- (sirf padho)</td></tr>
</table></div><p><code>755</code> = owner sab kuch, baaki sirf padh aur chala sakte hain.</p>`},
{t:`chmod vs chown`, b:`<ul><li><code>chmod 755 file</code>: permissions badlo</li><li><code>chown roshan file</code>: owner badlo</li></ul><p><strong>Folder pe</strong> execute (x) ka matlab: folder ke andar <strong>jaa sakte ho</strong>.</p>`}
],
say:`To debug a Linux server I use top or htop for live CPU and memory, ps sorted by memory to find the heaviest process, free and df for memory and disk, lsof or ss to see which process holds a port, and journalctl for service logs. File permissions are three digits for owner, group and others, each the sum of read four, write two and execute one, so 755 means the owner has full access and everyone else can read and execute. chmod changes permissions and chown changes ownership.`,
hook:`r=4, w=2, x=1. 755 = owner sab, baaki padho + chalao.`,
check:[[`644 ka matlab?`,`Owner padh aur likh sakta hai (6), baaki sirf padh sakte hain (4).`]]
},
{
h:`Git aur zero-downtime deploy`,
words:[
[`Commit`,`Code ka ek saved snapshot.`],
[`Branch`,`Code ki alag line jahan kaam hota hai.`],
[`HEAD`,`Abhi tum kaunse commit pe ho.`],
[`Deploy`,`Naya code server pe live karna.`]
],
steps:[
{t:`Merge vs rebase`, b:`<ul><li><strong>Merge:</strong> do sadkon ko ek chauraahe se jodo. History me dono sadkein dikhti hain.</li><li><strong>Rebase:</strong> apni sadak utha ke main sadak ke end me dobara bichha do. Seedhi saaf history, lekin ye <strong>nayi sadak</strong> hai (naye commit hashes).</li></ul>`},
{t:`Shared branch pe rebase kabhi nahi`, b:`<p>Kisi ne purani sadak pe gaadi chala li (commits pull kar liye). Tumne rebase karke sadak badal di. Ab uska code aur tumhara alag, duplicate commits aur conflicts.</p><p><strong>Rule:</strong> sirf apne <strong>unpushed</strong> commits rebase karo. Jo doosron ke paas hai, use merge karo.</p>`},
{t:`git reset ke 3 tareeke`, b:`<div class="tbl-wrap"><table>
<tr><th>Command</th><th>HEAD</th><th>Staging</th><th>Files</th><th>Kab</th></tr>
<tr><td><code>--soft</code></td><td>peeche</td><td>same</td><td>same</td><td>commits squash karne</td></tr>
<tr><td><code>--mixed</code> (default)</td><td>peeche</td><td>reset</td><td>same</td><td>unstage karne</td></tr>
<tr><td><code>--hard</code></td><td>peeche</td><td>reset</td><td><strong>reset (kaam gaya!)</strong></td><td>sab phenk dena</td></tr>
</table></div><p><strong>Detached HEAD:</strong> tum kisi branch pe nahi, seedha ek commit pe ho. Yahan commit kiya to branch bana lo, warna wo kho jaayega.</p>`},
{t:`Zero-downtime deploy kaise hota hai`, b:`<ol><li><strong>Health check:</strong> naya server "main ready hoon" bataye, tabhi load balancer usko traffic bheje.</li><li><strong>Rolling:</strong> ek ek karke purane servers naye se badlo. Kabhi sab band nahi.</li><li><strong>Blue-green:</strong> naya version poora alag chalu karo, phir ek jhatke me traffic switch. Gadbad hui to turant wapas.</li><li>Database changes <strong>backward compatible</strong> hon, kyunki thodi der purana aur naya dono chalte hain.</li></ol><p>"Vercel khud kar deta hai" answer nahi hai. <strong>Kaise</strong> hota hai wo batao.</p>`}
],
say:`Merge joins histories with a merge commit and preserves them, while rebase replays my commits onto a new base, creating new commit hashes and a linear history. I never rebase a shared branch, because rewriting commits others already have causes duplicates and conflicts. git reset soft moves HEAD but keeps changes staged, mixed also unstages them, and hard discards them. Zero-downtime deployment relies on health checks so traffic only goes to ready instances, plus rolling or blue-green replacement, and backward-compatible database migrations.`,
hook:`Shared branch pe rebase nahi. reset --hard = kaam gaya.`,
check:[[`Commits squash karne ke liye kaunsa reset?`,`<code>git reset --soft</code>`]]
}
],
cards:[
{q:`Container vs virtual machine?`, s:`Container host ka kernel share karta hai (namespaces + cgroups), halka aur fast. VM apna kernel chalata hai, bhaari lekin zyada isolated.`, a:`Containers share the host kernel and use namespaces and cgroups, so they are lightweight but less isolated. VMs run their own kernel on a hypervisor.`},
{q:`Why does Dockerfile instruction order matter?`, s:`Ek layer badli to upar ki sab dobara banti hain. Pehle package.json + install, phir code copy.`, a:`A changed layer invalidates all later layers, so copy the dependency manifest and install before copying source code to keep dependencies cached.`},
{q:`What is a multi-stage build?`, s:`Pehle stage me build, final image me sirf output copy. Chhoti image, compiler production me nahi.`, a:`Building in one stage and copying only the build output into a slim final stage, so build tools never reach the production image.`},
{q:`What happens when a container exceeds its memory limit?`, s:`OOM killer process maar deta hai. Exit code 137, docker inspect me OOMKilled: true.`, a:`The kernel's OOM killer terminates the process, and the container exits with code 137.`},
{q:`What does chmod 755 mean?`, s:`Owner: rwx (7). Group aur others: r-x (5). r=4, w=2, x=1.`, a:`The owner can read, write and execute; group and others can read and execute.`},
{q:`How do you find which process is using a port?`, s:`lsof -i :3000 ya ss -ltnp`, a:`With lsof -i followed by the port, or ss -ltnp.`},
{q:`Merge vs rebase — and why not rebase a shared branch?`, s:`Merge history rakhta hai. Rebase naye commits banata hai. Shared branch rebase = doosron ka code toot jaata hai, duplicates aur conflicts.`, a:`Merge preserves history with a merge commit; rebase rewrites commits onto a new base. Rebasing a shared branch rewrites commits others have, causing duplicates and conflicts.`},
{q:`git reset soft vs mixed vs hard?`, s:`soft: changes staged rehte hain. mixed: unstaged. hard: changes delete.`, a:`Soft moves HEAD and keeps changes staged, mixed also unstages them, and hard discards them entirely.`},
{q:`How does a zero-downtime deploy work?`, s:`Health checks + rolling ya blue-green replacement + backward compatible DB changes.`, a:`Health checks ensure traffic only reaches ready instances, rolling or blue-green replacement keeps capacity up, and database migrations stay backward compatible.`}
]
});

id:'liability', name:'Java, Spring Boot & Go', tier:'liab',
intro:`Ye teeno resume pe likhe hain, lekin inke peeche koi project, coursework ya experience nahi hai. Smart interviewer yahi gap test karega. Yahan phas gaye to wo baaki claims pe bhi shak karega. Ye lessons padho. Agar 12 me se 8 sawaal bina dekhe nahi bol pa rahe, to ye teeno resume se hata do.`,
lessons:[

words:[

steps:[

{t:`Chhota resume, lekin pakka`, b:`<p>Aaj tak kisi ko is baat pe reject nahi kiya gaya ki usne 8 ki jagah 4 languages likhi. Lekin ek line defend nahi kar paaye, to <strong>round jaata hai</strong>, aur baaki resume pe bhi bharosa kam hota hai.</p>`},

},

words:[

[`Garbage collector`,`Jo memory kisi kaam ki nahi, usko khud free karta hai.`],
[`hashCode`,`Object ka ek number jo HashMap me bucket chunne ke liye use hota hai.`]
],
steps:[
{t:`OOP ke 4 pillars`, b:`<ul><li><strong>Encapsulation:</strong> data ko private rakho, methods se access do.</li><li><strong>Inheritance:</strong> ek class doosri se features le.</li><li><strong>Polymorphism:</strong> ek naam, alag behaviour (overriding).</li><li><strong>Abstraction:</strong> andar ki complexity chhupao, sirf zaroori dikhao.</li></ul><p>Har ek ka example <strong>apne code</strong> se tayyar rakho.</p>`},
{t:`HashMap andar se (bahut poocha jaata hai)`, b:`<ol><li>Andar ek <strong>array of buckets</strong> hai.</li><li><code>key.hashCode()</code> se number, usse bucket index.</li><li>Do keys same bucket me (collision): <strong>linked list</strong> me.</li><li>Java 8+: ek bucket me <strong>8 se zyada</strong> ho gaye to list <strong>red-black tree</strong> ban jaati hai. Worst case O(n) se O(log n).</li><li>Size &gt; capacity × <strong>0.75</strong> (load factor): array <strong>double</strong>, sab dobara baante jaate hain.</li></ol>`},
{t:`== vs .equals()`, code:`
String a = new String("hi");
String b = new String("hi");
a == b;        // false: alag objects (address compare)
a.equals(b);   // true:  content compare

Integer x = 127, y = 127;   x == y;   // true  (cache -128..127)
Integer p = 128, q = 128;   p == q;   // false (cache ke bahar!)`},
{t:`equals aur hashCode ka rule`, b:`<p>Do objects <code>equals</code> hain to unka <code>hashCode</code> <strong>same hona chahiye</strong>.</p><p>Sirf <code>equals</code> override kiya, <code>hashCode</code> nahi: HashMap me key daali, same key se <code>get</code> kiya, <strong>null mila</strong>. Kyunki galat bucket me dhoondha.</p>`},
{t:`Checked vs unchecked exception, interface vs abstract class`, b:`<ul><li><strong>Checked</strong> (<code>IOException</code>): compiler zabardasti catch ya declare karwata hai.</li><li><strong>Unchecked</strong> (<code>NullPointerException</code>): compiler kuch nahi bolta. Programming galti.</li></ul><ul><li><strong>Interface:</strong> "kya kar sakta hai" ka contract. Ek class kai interfaces.</li><li><strong>Abstract class:</strong> aadha bana hua base, fields ke saath. Sirf ek extend.</li></ul>`},
{t:`JDK vs JRE vs JVM aur GC`, b:`<ul><li><strong>JVM:</strong> bytecode chalata hai.</li><li><strong>JRE:</strong> JVM + libraries (chalane ke liye).</li><li><strong>JDK:</strong> JRE + compiler (banane ke liye).</li></ul><p><strong>GC</strong> un objects ko free karta hai jin tak <strong>koi raasta nahi</strong> (unreachable). Naye objects jaldi marte hain, isliye young aur old generation alag.</p>`}
],
say:`A HashMap is an array of buckets. The key's hashCode chooses a bucket, collisions are chained in a linked list, and since Java 8 a bucket with more than eight entries becomes a red-black tree. When the size exceeds capacity times the load factor of 0.75, the table doubles and entries are rehashed. If two objects are equal they must have the same hashCode, otherwise lookups fail. The double-equals operator compares references, while equals compares content.`,
hook:`HashMap: buckets → list → 8+ pe tree → 0.75 pe double.`,
check:[[`Sirf equals override kiya, hashCode nahi. Kya hoga?`,`HashMap me key daalne ke baad same key se get karne pe null mil sakta hai.`]]
},
{
h:`Spring Boot aur Go ke must-know sawaal`,
words:[
[`Dependency injection`,`Class apni zaroorat ki cheezein khud nahi banati, bahar se di jaati hain.`],
[`Bean`,`Spring dwara banaya aur sambhala gaya object.`],
[`Goroutine`,`Go ka bahut halka thread.`],
[`Channel`,`Goroutines ke beech data bhejne ki pipe.`]
],
steps:[
{t:`Dependency Injection aur IoC`, b:`<p>Restaurant me chef khud sabzi ugaane nahi jaata. Supplier <strong>de jaata hai</strong>.</p><p>Class ke andar <code>new PaymentService()</code> likha to wo hamesha usi se bandh gayi. Test me nakli service nahi daal sakte. DI me class bas batati hai "mujhe PaymentService chahiye", aur <strong>Spring de deta hai</strong>.</p><p>Framework objects banata aur sambhalta hai: isko <strong>Inversion of Control</strong> kehte hain. Constructor injection sabse achha.</p>`},
{t:`Spring annotations`, b:`<ul><li><code>@Component</code>, <code>@Service</code>, <code>@Repository</code>: kaam me lagbhag <strong>same</strong>, sab bean bante hain. Naam sirf role batata hai.</li><li><strong>Ek asli farak:</strong> <code>@Repository</code> database errors ko Spring ke <code>DataAccessException</code> me badal deta hai.</li><li><code>@SpringBootApplication</code> = <code>@Configuration</code> + <code>@EnableAutoConfiguration</code> + <code>@ComponentScan</code>.</li></ul>`},
{t:`Go: goroutine vs thread`, b:`<ul><li>Goroutine ka stack sirf <strong>~2 KB</strong> se shuru. OS thread ka ~1-8 MB.</li><li>Isliye lakhon goroutines chal sakti hain.</li><li>Go ka apna <strong>scheduler</strong> kai goroutines ko kuch OS threads pe chalata hai (M:N). Switch karne ke liye kernel nahi chahiye, isliye sasta.</li></ul>`},
{t:`Channels aur select`, code:`
ch := make(chan int)      // unbuffered: bhejne wala tab tak rukega jab tak koi le na le
bc := make(chan int, 5)   // buffered: 5 tak bina ruke bhej sakte ho

select {
case v := <-ch:
    fmt.Println(v)
case <-time.After(2 * time.Second):
    fmt.Println("timeout")
}`, after:`<p><code>select</code> kai channels pe ek saath intezaar karta hai. Timeout aur cancel isi se banate hain.</p>`},
{t:`defer`, code:`
f, _ := os.Open("data.txt")
defer f.Close()          // function khatam hone pe chalega (RAII jaisa)

for i := 0; i < 3; i++ {
    defer fmt.Println(i) // output: 2, 1, 0  (ulta order, LIFO)
}`, after:`<ul><li><code>defer</code> function <strong>return</strong> hone pe chalta hai, panic me bhi.</li><li>Kai defers <strong>ulte order</strong> me chalte hain.</li><li>Arguments <strong>turant</strong> evaluate hote hain, jab defer likha.</li></ul>`}
],
say:`Dependency injection means a class declares what it needs and the framework supplies it, instead of the class constructing its dependencies, which improves testability and loose coupling; that is inversion of control. In Spring, Component, Service and Repository all register beans, but Repository also translates persistence exceptions. In Go, goroutines start with a tiny growable stack and are multiplexed onto OS threads by Go's scheduler, so they are much cheaper than threads. Unbuffered channels synchronize sender and receiver, buffered channels decouple them up to their capacity, and select waits on multiple channel operations. Deferred calls run when the function returns, in last-in-first-out order.`,
hook:`DI = zaroorat bahar se milti hai. Goroutine = 2 KB. defer = ulta order.`,
check:[[`<code>defer</code> loop me 0,1,2 ke saath kya print karega?`,`2, 1, 0`]]
}
],
cards:[
{q:`How does Java's HashMap work internally?`, s:`Buckets ka array. hashCode se bucket. Collision = linked list. 8+ pe red-black tree. Size > capacity × 0.75 pe double.`, a:`It is an array of buckets indexed by the key's hash. Collisions chain in a linked list that becomes a red-black tree beyond eight entries, and the table doubles when size exceeds capacity times the 0.75 load factor.`},
{q:`What is the equals and hashCode contract?`, s:`equals true hai to hashCode same hona chahiye. Warna HashMap me key milegi nahi.`, a:`Objects that are equal must return the same hashCode; otherwise hash-based collections cannot find them.`},
{q:`== vs .equals() in Java?`, s:`== address compare (same object?). equals content compare. Integer cache -128..127 ki wajah se 128 pe == false.`, a:`The double-equals operator compares references for objects, while equals compares logical content. Integer caching makes it appear to work only between -128 and 127.`},
{q:`Checked vs unchecked exceptions?`, s:`Checked: compiler catch/declare karwata hai (IOException). Unchecked: RuntimeException, programming galti (NullPointerException).`, a:`Checked exceptions must be caught or declared, like IOException. Unchecked exceptions extend RuntimeException and represent programming errors.`},
{q:`Interface vs abstract class?`, s:`Interface: contract, kai implement kar sakte. Abstract class: fields ke saath aadha bana base, sirf ek extend.`, a:`An interface is a contract a class can implement many of. An abstract class can hold state and shared implementation but only one can be extended.`},
{q:`JDK vs JRE vs JVM?`, s:`JVM chalata hai. JRE = JVM + libraries. JDK = JRE + compiler.`, a:`The JVM executes bytecode, the JRE adds the standard libraries, and the JDK adds the compiler and development tools.`},
{q:`What is dependency injection?`, s:`Class apni dependencies khud nahi banati, framework deta hai. Testing aasaan, coupling kam.`, a:`Supplying a class's dependencies from outside instead of constructing them inside, which enables testing and loose coupling.`},
{q:`@Component vs @Service vs @Repository?`, s:`Lagbhag same, sab bean. @Repository extra: database exceptions ko DataAccessException me badalta hai.`, a:`All register Spring beans; the names mainly describe roles, but Repository also enables persistence exception translation.`},
{q:`Goroutine vs OS thread?`, s:`Goroutine ~2 KB stack se shuru, Go ka scheduler kai goroutines ko kuch threads pe chalata hai. Bahut sasta.`, a:`Goroutines start with a small growable stack and are multiplexed onto OS threads by Go's user-space scheduler, so they are far cheaper to create and switch.`},
{q:`Buffered vs unbuffered channel?`, s:`Unbuffered: bhejne wala ruk jaata hai jab tak koi le na le. Buffered: capacity tak bina ruke.`, a:`An unbuffered channel blocks the sender until a receiver is ready; a buffered channel only blocks when its buffer is full.`},
{q:`How does defer work in Go?`, s:`Function return hone pe chalta hai (panic me bhi). Kai defers ulte order me. Arguments turant evaluate.`, a:`Deferred calls run when the surrounding function returns, including on panic, in last-in-first-out order, with arguments evaluated when the defer statement runs.`}
]
});
