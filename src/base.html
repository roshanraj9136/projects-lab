id:'js', name:'JavaScript & TypeScript', tier:'crit',
intro:`Tumhare dono projects JavaScript/TypeScript me hain. JavaScript ke kuch rules ajeeb hain, aur interviewer inhi se check karta hai ki tumne language samjhi hai ya sirf copy paste kiya hai. "Event loop" wala sawaal bahut zyada poocha jaata hai.`,
lessons:[
{
h:`Event loop: JavaScript ek time pe ek hi kaam karta hai`,
words:[
[`Thread`,`Kaam karne wala ek worker. JavaScript me sirf <strong>ek</strong> hai.`],
[`Call stack`,`Abhi kaunsa function chal raha hai, uski list.`],
[`Asynchronous (async)`,`Aisa kaam jo baad me poora hoga, jaise timer ya internet se data.`],
[`Callback`,`Function jo baad me chalane ke liye diya jaata hai.`]
],
steps:[
{t:`JavaScript me sirf ek worker hai`, b:`<p>JavaScript <strong>single-threaded</strong> hai. Ek time pe ek hi kaam.</p><p>Real life: restaurant me <strong>ek hi chef</strong> hai.</p>`},
{t:`Slow kaam helpers ko de diye jaate hain`, b:`<p>Timer, internet request, file padhna jaise slow kaam browser/Node ke helpers ko de diye jaate hain. Chef tab tak doosra kaam karta hai.</p><p>Helper ka kaam poora hua, to wo ek <strong>note</strong> chhodta hai ki "ab ye callback chalao".</p>`},
{t:`Notes 2 trays me jaate hain`, b:`<div class="tbl-wrap"><table>
<tr><th>Tray</th><th>Kya jaata hai</th></tr>
<tr><td><strong>Microtask queue</strong> (VIP tray)</td><td><code>Promise.then</code>, <code>await</code> ke baad ka code</td></tr>
<tr><td><strong>Macrotask queue</strong> (normal tray)</td><td><code>setTimeout</code>, <code>setInterval</code>, click events</td></tr>
</table></div>`, d:`eventloop`},
{t:`Golden rule`, b:`<ol><li>Chef abhi wala kaam poora karta hai (saara normal code).</li><li>Phir <strong>VIP tray poori khaali</strong> karta hai (saare microtasks).</li><li>Phir normal tray se <strong>sirf ek</strong> note leta hai (ek macrotask).</li><li>Wapas step 2.</li></ol>`},
{t:`Famous sawaal: output kya hoga?`, code:`
console.log('1');
setTimeout(() => console.log('2'), 0);
Promise.resolve().then(() => console.log('3'));
console.log('4');`, after:`<p><strong>Answer: 1, 4, 3, 2</strong></p><ol><li><code>1</code>: normal code, turant.</li><li><code>setTimeout</code>: normal tray me gaya.</li><li><code>then</code>: VIP tray me gaya.</li><li><code>4</code>: normal code, turant.</li><li>Normal code khatam. VIP tray: <code>3</code>.</li><li>Normal tray: <code>2</code>.</li></ol><p>Dhyan do: <code>setTimeout(..., 0)</code> ka matlab "abhi" nahi, "sab khatam hone ke baad" hai.</p>`},
{t:`async/await wala sawaal`, code:`
async function f() {
  console.log('A');
  await null;
  console.log('B');
}
console.log('start');
f();
console.log('end');`, after:`<p><strong>Answer: start, A, end, B</strong></p><ul><li><code>await</code> se <strong>pehle</strong> ka code turant chalta hai. Isliye A turant.</li><li><code>await</code> ke <strong>baad</strong> ka code VIP tray me jaata hai.</li><li>Isliye pehle <code>end</code>, phir <code>B</code>.</li></ul>`}
],
say:`JavaScript has a single thread and one call stack. Slow work like timers and network requests is handed to the runtime, and completed callbacks come back through two queues. After the current code finishes, the engine empties the entire microtask queue, which holds promise callbacks, before taking one macrotask such as a timer. So a Promise.then always runs before a setTimeout with zero delay. In an async function, code before the first await runs synchronously, and the rest runs as a microtask.`,
hook:`Normal code → saare microtasks (Promise) → ek macrotask (setTimeout) → repeat.`,
check:[
[`<code>setTimeout(fn, 0)</code> turant chalta hai?`,`Nahi. Saara normal code aur saare promises ke baad chalta hai.`],
[`<code>await</code> se pehle wala code kab chalta hai?`,`Turant, synchronously.`]
]
},
{
h:`Closures: function apne saath variables ka bag rakhta hai`,
words:[
[`Scope`,`Wo area jahan ek variable dikh sakta hai aur use ho sakta hai.`],
[`Closure`,`Function + wo variables jo usne apne bante waqt ke area se "yaad" rakhe.`]
],
steps:[
{t:`Function ke andar function`, code:`
function counter() {
  let count = 0;
  return function () {
    count = count + 1;
    return count;
  };
}

const c = counter();
c();   // 1
c();   // 2`, after:`<p><code>counter()</code> khatam ho gaya, phir bhi andar wala function <code>count</code> ko yaad rakhta hai aur badhata hai.</p>`},
{t:`Kaise yaad rakha?`, b:`<p>Andar wala function apne saath ek <strong>backpack</strong> leke chalta hai. Usme wo variables hain jo uske bante waqt aas-paas the. Isi backpack ko <strong>closure</strong> kehte hain.</p>`},
{t:`Famous bug: var wala loop`, code:`
for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}
// Output: 3, 3, 3`, after:`<ul><li><code>var</code> poore function ka <strong>ek hi</strong> variable banata hai.</li><li>Teeno callbacks <strong>same i</strong> ko yaad rakhte hain.</li><li>Jab tak timer chale, loop khatam ho chuka hai aur i = 3 hai.</li></ul>`},
{t:`Fix: let use karo`, code:`
for (let i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}
// Output: 0, 1, 2`, after:`<p><code>let</code> har loop round me <strong>naya</strong> i banata hai. Har callback ka apna i.</p>`},
{t:`Closures kahan use hote hain?`, b:`<ul><li>Private data (bahar se <code>count</code> ko koi seedha badal nahi sakta)</li><li>Debounce / throttle functions</li><li><strong>React hooks</strong>: har hook closure pe hi chalta hai</li></ul>`}
],
say:`A closure is a function together with the variables from the scope where it was created. The inner function keeps those variables alive even after the outer function has returned. A classic example is a var loop with setTimeout printing 3, 3, 3, because var creates one shared variable; using let fixes it because let creates a new binding for each iteration.`,
hook:`Closure = function + uska backpack (bante waqt ke variables).`,
check:[[`<code>var</code> loop 3,3,3 kyun print karta hai?`,`var ka ek hi variable hai, sab callbacks usi ko dekhte hain, aur tab tak wo 3 ho chuka hai.`]]
},
{
h:`var, let, const aur "this"`,
words:[
[`Hoisting`,`JavaScript code chalane se pehle declarations ko upar le jaata hai.`],
[`TDZ (Temporal Dead Zone)`,`let/const declare hone se pehle ka area, jahan unhe use karna error deta hai.`],
[`this`,`Ek special word jo batata hai "abhi kaun sa object is function ko call kar raha hai".`]
],
steps:[
{t:`Teeno me farak`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>Scope</th><th>Dobara declare?</th><th>Nayi value de sakte?</th></tr>
<tr><td><code>var</code></td><td>poora function</td><td>haan</td><td>haan</td></tr>
<tr><td><code>let</code></td><td>sirf { } block</td><td>nahi</td><td>haan</td></tr>
<tr><td><code>const</code></td><td>sirf { } block</td><td>nahi</td><td>nahi</td></tr>
</table></div>`},
{t:`Hoisting aur TDZ`, code:`
console.log(a);   // undefined  (var upar chala gaya, value undefined)
var a = 5;

console.log(b);   // ERROR  (let TDZ me hai)
let b = 5;`},
{t:`Trap: const ka matlab "badal nahi sakta" nahi`, code:`
const arr = [1, 2];
arr.push(3);      // OK! array ke andar badal sakte ho
arr = [9];        // ERROR: variable ko naya array nahi de sakte`, after:`<p><code>const</code> sirf <strong>dabba</strong> fix karta hai, dabbe ke andar ka saamaan nahi.</p>`},
{t:`"this" kaun decide karta hai?`, b:`<p><code>this</code> is baat se decide hota hai ki function <strong>kaise call hua</strong>, is baat se nahi ki kahan likha gaya.</p><ol><li><code>new Person()</code>: this = naya object</li><li><code>fn.call(obj)</code> / <code>bind</code>: this = jo diya</li><li><code>obj.method()</code>: this = obj (dot ke pehle wala)</li><li>Akele <code>fn()</code>: this = undefined (strict mode)</li></ol><p>Real life: "main" shabd. Jo bol raha hai, wahi "main" hai.</p>`},
{t:`Arrow function ka apna "this" nahi hota`, code:`
const user = {
  name: 'Roshan',
  bad() {
    setTimeout(function () { console.log(this.name); }, 0);  // undefined
  },
  good() {
    setTimeout(() => console.log(this.name), 0);             // 'Roshan'
  }
};`, after:`<p>Arrow function <code>this</code> ko <strong>bahar se</strong> le leta hai. Isliye callback ke liye perfect hai.</p>`}
],
say:`var is function-scoped and hoisted with the value undefined. let and const are block-scoped and sit in the temporal dead zone until declared, so using them early throws. const prevents reassigning the variable, not changing the object. The value of this depends on how a function is called — new, call or bind, a method call, or a plain call. Arrow functions have no this of their own and take it from the surrounding scope.`,
hook:`this = kisne call kiya. Arrow function this bahar se leta hai.`,
check:[[`<code>const arr = []; arr.push(1)</code> chalega?`,`Haan. const sirf variable ko reassign hone se rokta hai, andar ka data nahi.`]]
},
{
h:`Promise aur async/await`,
words:[
[`Promise`,`Ek aisi value ka vaada jo baad me aayegi.`],
[`Resolve`,`Kaam safal hua, value mil gayi.`],
[`Reject`,`Kaam fail hua, error aaya.`]
],
steps:[
{t:`Promise kya hai?`, b:`<p>Restaurant me order diya to tumhe <strong>ek receipt</strong> milti hai. Khana abhi ready nahi, lekin receipt vaada hai ki milega. Promise wahi receipt hai.</p><p>Uske 3 haal: <strong>pending</strong> (ban raha hai), <strong>fulfilled</strong> (mil gaya), <strong>rejected</strong> (jal gaya).</p>`},
{t:`async/await: promise ko aasaan likhna`, code:`
async function loadUser() {
  try {
    const res = await fetch('/api/user');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    console.log('Error:', err);
  }
}`, after:`<p><code>await</code> ka matlab: "promise poora hone tak ruko, phir value do". Error ho to <code>try/catch</code> pakadta hai.</p>`},
{t:`Trap: fetch 404 pe fail nahi hota!`, b:`<p><code>fetch</code> sirf tab reject hota hai jab <strong>network</strong> hi fail ho (internet band, server nahi mila).</p><p>404 ya 500 aaya, to bhi fetch "safal" maanta hai. Isliye <code>res.ok</code> khud check karna padta hai.</p>`},
{t:`Galti: ek ke baad ek await (slow)`, code:`
// 2 second lagenge, jabki dono alag alag hain
const a = await getA();   // 1 sec
const b = await getB();   // 1 sec

// 1 second: dono saath me
const [a2, b2] = await Promise.all([getA(), getB()]);`},
{t:`4 combinators yaad karo`, b:`<div class="tbl-wrap"><table>
<tr><th>Function</th><th>Kya karta hai</th><th>Real life</th></tr>
<tr><td><code>Promise.all</code></td><td>sab chahiye; ek fail to sab fail</td><td>saari dishes, ek jali to order cancel</td></tr>
<tr><td><code>Promise.allSettled</code></td><td>sabka result do, fail ho ya pass</td><td>jo bana sab lao, jala hua bhi</td></tr>
<tr><td><code>Promise.race</code></td><td>jo pehle khatam ho (fail bhi)</td><td>jo pehle nikle</td></tr>
<tr><td><code>Promise.any</code></td><td>jo pehle <strong>safal</strong> ho</td><td>pehli achhi dish</td></tr>
</table></div>`}
],
say:`A promise represents a value that will be available later, and it is pending, fulfilled or rejected. async and await are syntax over promises: await pauses the function until the promise settles, and errors are caught with try and catch. fetch only rejects on network failure, not on a 404 or 500, so you must check response.ok. Independent requests should run together with Promise.all instead of awaiting them one by one.`,
hook:`fetch 404 pe reject nahi karta. Alag kaam = Promise.all.`,
check:[[`Promise.all me ek fail ho jaaye to?`,`Poora Promise.all turant reject ho jaata hai.`]]
},
{
h:`TypeScript basics`,
words:[
[`Type`,`Batata hai variable me kis tarah ka data hai: number, string, object.`],
[`Interface`,`Object ka shape (kaunsi properties honi chahiye).`],
[`Generic`,`Aisa type jo baad me decide hota hai, jaise <code>Array&lt;T&gt;</code>.`]
],
steps:[
{t:`TypeScript kya hai?`, b:`<p>TypeScript = JavaScript + <strong>types</strong>. Code chalane se pehle hi galtiyan pakad leta hai.</p><p>Real life: <strong>spell checker</strong>. Chitthi bhejne se pehle galtiyan dikhata hai.</p>`},
{t:`Bahut important: runtime pe types nahi hote`, b:`<p>TypeScript compile hoke <strong>plain JavaScript</strong> ban jaata hai. Saare types <strong>mit jaate hain</strong>.</p><p>Isliye API se aane wale data ko runtime pe khud check karna padta hai (jaise zod library se). TypeScript wahan madad nahi karega.</p>`},
{t:`Structural typing: shape dekhta hai, naam nahi`, code:`
interface Point { x: number; y: number }

const p = { x: 1, y: 2, z: 3 };
const q: Point = p;   // OK: x aur y dono hain`, after:`<p>Java me class ko <code>implements Point</code> likhna padta. TypeScript bas <strong>shape</strong> check karta hai.</p>`},
{t:`interface vs type`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>interface</th><th>type</th></tr>
<tr><td>Object ka shape</td><td>haan</td><td>haan</td></tr>
<tr><td>Dobara khol ke add karna (merging)</td><td><strong>haan</strong></td><td>nahi</td></tr>
<tr><td>Union <code>A | B</code></td><td>nahi</td><td><strong>haan</strong></td></tr>
</table></div><p>Simple rule: object ke liye <code>interface</code>, union ke liye <code>type</code>.</p>`},
{t:`any vs unknown vs never`, b:`<ul><li><strong>any</strong>: checking band. Galat use karo, TS kuch nahi bolega. Avoid karo.</li><li><strong>unknown</strong>: kuch bhi aa sakta hai, lekin <strong>use karne se pehle check</strong> karna padega. Safe.</li><li><strong>never</strong>: aisi value jo kabhi ho hi nahi sakti. Jaise function jo hamesha error throw kare.</li></ul>`, code:`
function f(x: unknown) {
  x.toUpperCase();              // ERROR: pehle check karo
  if (typeof x === 'string') {
    x.toUpperCase();            // OK
  }
}`},
{t:`Generics simple example`, code:`
function first<T>(arr: T[]): T {
  return arr[0];
}

first([1, 2, 3]);       // T = number
first(['a', 'b']);      // T = string`, after:`<p><code>T</code> ek jagah rakhne wala naam hai. Jo type do, function wahi type wapas deta hai.</p>`}
],
say:`TypeScript adds static types to JavaScript, but the types are erased when it compiles, so data from outside still needs runtime validation. It uses structural typing: an object fits a type if it has the right shape, without explicitly implementing it. interface is best for object shapes and supports declaration merging, while type can express unions. any turns off checking, unknown forces you to narrow before use, and never represents a value that cannot exist.`,
hook:`Runtime pe TypeScript nahi hota. any = danger, unknown = safe.`,
check:[[`TypeScript types runtime pe milte hain?`,`Nahi, compile hote hi hat jaate hain.`]]
}
],
cards:[
{q:`What is the output order: console.log(1), setTimeout logging 2, Promise.then logging 3, console.log(4)?`, s:`1, 4, 3, 2. Pehle normal code (1, 4), phir saare promises (3), phir timer (2).`, a:`1, 4, 3, 2. Synchronous code runs first, then the whole microtask queue (the promise), then one macrotask (the timer).`},
{q:`Explain the JavaScript event loop.`, s:`Ek thread. Slow kaam helpers ko. Wapas 2 queues me aate hain. Normal code khatam → saare microtasks → ek macrotask → repeat.`, a:`JavaScript runs on one thread. Async callbacks return through a microtask queue for promises and a macrotask queue for timers and events. After each task, all microtasks run before the next macrotask.`},
{q:`What is a closure?`, s:`Function + uske bante waqt ke variables ka backpack. Bahar wala function khatam hone ke baad bhi variables yaad rehte hain.`, a:`A function bundled with the variables of the scope it was created in, which stay alive after the outer function returns.`},
{q:`Why does a var loop with setTimeout print 3, 3, 3?`, s:`var ka ek hi variable, sab callbacks same i dekhte hain, tab tak wo 3 ho chuka. let har round naya variable banata hai.`, a:`var is function-scoped, so every callback shares one i, which is 3 when they run. let creates a new binding per iteration and prints 0, 1, 2.`},
{q:`How is "this" decided, and how are arrow functions different?`, s:`this = kaise call hua (new, call/bind, obj.method(), ya plain). Arrow ka apna this nahi, bahar se leta hai.`, a:`this depends on how the function is called: new, explicit call or bind, a method call, or a plain call. Arrow functions have no own this and use the surrounding scope's this.`},
{q:`Does fetch reject on a 404?`, s:`Nahi. Sirf network fail hone pe reject. res.ok khud check karo.`, a:`No. fetch only rejects on network failure; for HTTP errors you must check response.ok.`},
{q:`Promise.all vs allSettled vs race vs any?`, s:`all: sab chahiye, ek fail to sab fail. allSettled: sabka result. race: jo pehle khatam. any: jo pehle safal.`, a:`all rejects if any rejects; allSettled waits for all and never rejects; race settles with the first to settle; any resolves with the first to fulfil.`},
{q:`any vs unknown vs never in TypeScript?`, s:`any: checking band (bura). unknown: check karke hi use kar sakte (safe). never: aisi value jo kabhi nahi hoti.`, a:`any disables type checking. unknown accepts anything but must be narrowed before use. never is a type with no values, used for impossible cases and exhaustiveness checks.`},
{q:`Do TypeScript types exist at runtime?`, s:`Nahi. Compile hote hi mit jaate hain. Bahar se aane wala data runtime pe check karo.`, a:`No, types are erased during compilation, so runtime validation is still needed for external data.`},
{q:`interface vs type in TypeScript?`, s:`interface: object shape, dobara khol ke add kar sakte (merging). type: union jaise A | B bana sakta hai.`, a:`interface describes object shapes and supports declaration merging. type can also express unions, intersections and computed types.`}
]
});
</script>

<script>
TOPICS.push({
id:'react', name:'React', tier:'crit',
intro:`Dono projects React me hain. React ke almost saare sawaal ek hi baat pe aate hain: component kab dobara render hota hai, aur kyun? AlgoRace ka live leaderboard har second update hota hai, to performance ke sawaal bhi aayenge.`,
lessons:[
{
h:`React render kaise karta hai`,
words:[
[`Component`,`Ek function jo UI (screen ka hissa) return karta hai.`],
[`State`,`Component ka apna data jo badal sakta hai.`],
[`Props`,`Parent component jo data child ko deta hai.`],
[`DOM`,`Browser me asli page ka structure.`],
[`Re-render`,`Component function ka dobara chalna.`]
],
steps:[
{t:`Component = function jo UI deta hai`, code:`
function Hello({ name }) {
  return <h1>Hello {name}</h1>;
}`},
{t:`Component kab dobara render hota hai?`, b:`<ol><li>Uski <strong>state</strong> badli</li><li>Uska <strong>context</strong> badla</li><li>Uska <strong>parent</strong> re-render hua, chahe props same hon</li></ol><p>Teesra point log bhool jaate hain.</p>`},
{t:`Render ke 3 phases`, d:`react`, b:`<ul><li><strong>Render:</strong> React tumhara function chalata hai aur naya UI description banata hai.</li><li><strong>Reconcile:</strong> naye aur purane description ko compare karta hai.</li><li><strong>Commit:</strong> sirf badle hue hisse asli DOM me change karta hai.</li></ul><p>Real life: architect naya naksha banata hai, purane se milata hai, aur mistri sirf wahi deewar todta hai jo badli hai.</p>`},
{t:`Virtual DOM kya hai?`, b:`<p>Asli DOM ki ek <strong>halki JavaScript copy</strong>. Isko compare karna sasta hai. Asli DOM ko baar baar chhedna mehenga hai.</p>`},
{t:`Keys kyun zaroori hain?`, b:`<p>List me React ko pata hona chahiye kaunsa item kaunsa hai. <code>key</code> item ka <strong>name tag</strong> hai.</p><p><strong>Index ko key banaya</strong> aur list ke shuru me naya item joda, to sabki key ek aage khisak jaati hai. React sochta hai <strong>har item badal gaya</strong>. Wo sabko update karta hai, aur input box ka text ya checkbox <strong>galat item</strong> ke saath chipak jaata hai.</p>`, code:`
// GALAT: index key
items.map((item, i) => <Row key={i} item={item} />)

// SAHI: stable id
items.map(item => <Row key={item.id} item={item} />)`}
],
say:`A component re-renders when its state changes, its context changes, or its parent re-renders. Rendering means calling the component to produce a new description of the UI. React then reconciles it against the previous one and commits only the differences to the real DOM. Keys let React match list items between renders; using the array index as a key breaks when items are inserted or reordered, because state stays attached to the wrong item.`,
hook:`Render ≠ DOM update. List me key = stable id, index nahi.`,
check:[[`Parent re-render hua, props same hain. Child re-render hoga?`,`Haan, by default hoga. React.memo lagao to rukega.`]]
},
{
h:`useState: state ka snapshot`,
words:[
[`Hook`,`React ka special function jo <code>use</code> se shuru hota hai.`],
[`Batching`,`Kai state updates ko ek saath milaake ek hi re-render karna.`]
],
steps:[
{t:`useState kya hai?`, code:`
const [count, setCount] = useState(0);`, after:`<p>React tumhare component ke liye ek <strong>sticky note</strong> sambhal ke rakhta hai. <code>count</code> uski value hai, <code>setCount</code> badalne ka tareeka.</p>`},
{t:`Har render ek photo hai`, b:`<p>Har render me <code>count</code> ek <strong>photo</strong> hai us waqt ki value ki. <code>setCount</code> photo nahi badalta, bas React ko kehta hai "agli baar nayi value ke saath render karo".</p>`, code:`
setCount(count + 1);
console.log(count);   // purani value! kyunki ye is render ki photo hai`},
{t:`Famous sawaal: 3 baar +1`, code:`
// count = 0
setCount(count + 1);
setCount(count + 1);
setCount(count + 1);
// Result: 1   (teeno ne same photo dekhi: 0 + 1)

setCount(c => c + 1);
setCount(c => c + 1);
setCount(c => c + 1);
// Result: 3   (har ek ko latest value mili)`, after:`<p><strong>Rule:</strong> nayi value purani pe depend kare to <code>c =&gt; c + 1</code> wala form use karo.</p>`}
],
say:`useState gives a component a value that persists between renders. Updates are scheduled and batched, and the state variable in the current render is a snapshot, so reading it right after calling the setter still gives the old value. If the new value depends on the old one, use the functional form, setCount of c to c plus 1, because calling setCount of count plus 1 three times only increments once.`,
hook:`State = us render ki photo. Purani value pe depend? c => c + 1.`,
check:[[`<code>setCount(count+1)</code> 3 baar = ?`,`Sirf +1. Teeno ne same purani value dekhi.`]]
},
{
h:`useEffect, useRef aur Rules of Hooks`,
words:[
[`Side effect`,`Render ke alawa koi kaam: API call, timer, socket listener.`],
[`Dependency array`,`useEffect ki list jo batati hai effect kab dobara chalega.`],
[`Cleanup`,`Pichhla effect undo karne wala function.`]
],
steps:[
{t:`useEffect = render ke baad ka kaam`, code:`
useEffect(() => {
  const id = setInterval(tick, 1000);   // kaam shuru
  return () => clearInterval(id);       // cleanup
}, []);`},
{t:`Dependency array ke 3 case`, b:`<div class="tbl-wrap"><table>
<tr><th>Likha</th><th>Effect kab chalega</th></tr>
<tr><td><code>[]</code></td><td>sirf pehli baar (mount)</td></tr>
<tr><td>kuch nahi likha</td><td>har render ke baad</td></tr>
<tr><td><code>[a, b]</code></td><td>jab a ya b badle</td></tr>
</table></div>`},
{t:`Cleanup kab chalta hai? (trap)`, b:`<p>Log sochte hain sirf component hatne pe. <strong>Galat.</strong></p><ul><li>Effect <strong>dobara chalne se pehle</strong> bhi cleanup chalta hai</li><li>Aur component hatne pe bhi</li></ul>`},
{t:`Infinite loop kaise banta hai`, code:`
const [data, setData] = useState({});
useEffect(() => {
  setData({ ...data, x: 1 });   // naya object
}, [data]);                      // data badla -> effect chala -> naya object -> ...`, after:`<p>Object ko React <strong>reference</strong> se compare karta hai (value se nahi). Har baar naya object = "badal gaya" = effect phir chala = hamesha ke liye loop.</p>`},
{t:`Socket listener ka leak (AlgoRace me important)`, code:`
useEffect(() => {
  socket.on('update', onUpdate);
  return () => socket.off('update', onUpdate);   // ye nahi likha to
}, [onUpdate]);                                  // har render pe naya listener judega`},
{t:`useRef`, b:`<p>Ek dabba jo render ke beech value <strong>yaad rakhta hai</strong>, lekin badalne pe <strong>re-render nahi karta</strong>.</p><p>Use: DOM element pakadna, timer id, socket object rakhna.</p>`},
{t:`Rules of Hooks`, b:`<p>Hooks sirf component ke <strong>top level</strong> pe likho. <code>if</code>, loop ya andar ke function me nahi.</p><p><strong>Kyun?</strong> React hooks ko unke <strong>order</strong> se pehchaanta hai, naam se nahi. Cinema ki numbered seats socho: ek seat skip hui to sab galat seat pe baith jaate hain.</p>`}
],
say:`useEffect runs side effects after the render is committed. The dependency array controls when it runs again: an empty array means once on mount, no array means after every render, and listed values mean whenever they change. The cleanup runs before the effect runs again and when the component unmounts. Setting state that is also a dependency causes an infinite loop, especially with objects, which are compared by reference. Hooks must be called at the top level because React tracks them by call order.`,
hook:`Cleanup har re-run se pehle. Hooks sirf top level pe.`,
check:[
[`<code>useRef</code> badalne se re-render hota hai?`,`Nahi.`],
[`Hook ko <code>if</code> ke andar kyun nahi likh sakte?`,`React hooks ko order se pehchaanta hai. Order badla to state galat hook ko milegi.`]
]
},
{
h:`Performance: leaderboard ko fast rakhna`,
words:[
[`React.memo`,`Component ko tab re-render hone se rokta hai jab uske props same hon.`],
[`useMemo / useCallback`,`Value / function ko yaad rakhte hain taaki har render pe naya na bane.`],
[`Context`,`Data ko bina props ke neeche ke components tak bhejne ka tareeka.`]
],
steps:[
{t:`Problem`, b:`<p>Leaderboard har second update hota hai. Agar poora page re-render hua to page atakne lagega.</p><p>Real life: stadium ka scoreboard badalna hai to <strong>poora stadium dobara nahi banate</strong>, sirf scoreboard.</p>`},
{t:`Fix 1 (sabse achha): state neeche le jaao`, b:`<p>Jo state tezi se badalti hai, usko <strong>sabse chhote component</strong> me rakho jo use dikhata hai. Tab sirf wahi re-render hoga.</p>`},
{t:`Fix 2: updates ko batch karo`, b:`<p>Har socket message pe state set mat karo. Messages jama karo aur thodi thodi der me (jaise har frame) ek saath update karo.</p>`},
{t:`Fix 3 aur 4`, b:`<ul><li><strong>React.memo</strong> row component pe, taaki badle bina row re-render na ho.</li><li><strong>Virtualization</strong>: lambi list me sirf screen pe dikhne wali rows banao.</li></ul><p>Interview me Fix 1 aur 2 <strong>pehle</strong> bolo. Wo design wale answers hain, zyada strong lagte hain.</p>`},
{t:`useMemo har jagah mat lagao`, b:`<p>useMemo <strong>free nahi hai</strong>. Har render pe dependencies compare karta hai aur purani value memory me rakhta hai.</p><ul><li><strong>Lagao:</strong> calculation sach me heavy ho, ya value <code>React.memo</code> child ko jaa rahi ho.</li><li><strong>Mat lagao:</strong> chhoti si calculation pe.</li></ul>`},
{t:`Context ka trap`, code:`
<UserContext.Provider value={{ user, setUser }}>`, after:`<p>Har render pe <code>{ }</code> ek <strong>naya object</strong> hai. To saare consumers har baar re-render honge. Fix: <code>useMemo</code> se value banao, ya context ko alag alag todo.</p>`},
{t:`Controlled vs uncontrolled (Monaco editor)`, b:`<ul><li><strong>Controlled:</strong> value React state me (<code>value</code> + <code>onChange</code>).</li><li><strong>Uncontrolled:</strong> value component khud rakhta hai, zaroorat pe ref se padho.</li></ul><p>Monaco editor ke liye <strong>uncontrolled</strong> sahi hai. Wo apna text, cursor aur undo khud sambhalta hai. Har keystroke React state me daaloge to re-render hoga aur cursor bhi kood sakta hai.</p>`}
],
say:`For a leaderboard that updates many times a second, I would first push the fast-changing state down into the smallest component that displays it, and batch incoming socket events instead of setting state for each one. Then I would use React.memo on rows with stable keys, and virtualize long lists. useMemo is not free, so I only use it for expensive calculations or to keep identities stable. Context re-renders all consumers when its value changes, so the value should be memoized.`,
hook:`Pehle state neeche + batching. Phir memo. useMemo free nahi hai.`,
check:[[`Monaco editor controlled rakhoge ya uncontrolled?`,`Uncontrolled. Wo apna buffer khud sambhalta hai.`]]
}
],
cards:[
{q:`When does a React component re-render?`, s:`3 case: uski state badle, uska context badle, ya parent re-render ho (props same hon tab bhi).`, a:`When its state changes, when a context it uses changes, or when its parent re-renders, even if its props are unchanged.`},
{q:`What are the render, reconcile and commit phases?`, s:`Render: function chala ke naya UI description. Reconcile: purane se compare. Commit: sirf badla hua asli DOM me.`, a:`Render calls the component to produce a new UI description, reconciliation diffs it against the previous one, and commit applies only the changes to the real DOM.`},
{q:`Why shouldn't you use the array index as a key?`, s:`Shuru me item jodne pe sabki key khisak jaati hai. React sochta hai sab badal gaya, aur input/checkbox galat item se chipak jaata hai.`, a:`Inserting or reordering shifts every index, so React thinks every item changed and component state stays attached to the wrong item. Use a stable id.`},
{q:`Why does calling setCount(count + 1) three times only add 1?`, s:`count us render ki photo hai. Teeno same purani value dekhte hain. c => c + 1 use karo.`, a:`count is a snapshot for that render, so all three calls compute the same value. The functional updater, c to c plus 1, uses the latest value and adds 3.`},
{q:`When does the useEffect cleanup run?`, s:`Effect dobara chalne se pehle, aur component hatne pe. Sirf hatne pe nahi.`, a:`Before the effect runs again and when the component unmounts.`},
{q:`What causes an infinite useEffect loop?`, s:`Effect wo state set kare jo uski dependency me hai. Objects reference se compare hote hain, to har naya object "badla hua" lagta hai.`, a:`An effect that sets state which is also in its dependency array; objects and arrays are compared by reference, so a new object each time re-triggers the effect.`},
{q:`Why can't hooks be called inside conditions?`, s:`React hooks ko order se pehchaanta hai. Condition se order badla to state galat hook ko milegi.`, a:`React identifies hooks by their call order, so a conditional hook shifts the order and gives state to the wrong hook.`},
{q:`How would you stop a fast-updating leaderboard from re-rendering the whole page?`, s:`1) State ko chhote component me neeche le jaao. 2) Socket updates batch karo. 3) Rows pe React.memo. 4) Lambi list virtualize.`, a:`Push the fast-changing state down to the smallest component, batch socket updates, memoize row components with stable keys, and virtualize long lists.`},
{q:`When is useMemo worth it?`, s:`Jab calculation heavy ho, ya value React.memo child ya effect dependency me jaa rahi ho. Chhoti cheez pe nahi, kyunki useMemo khud bhi cost karta hai.`, a:`When the computation is expensive, or when a stable identity is needed for a memoized child or an effect dependency. Otherwise its comparison cost outweighs the benefit.`}
]
});

TOPICS.push({
id:'backend', name:'Node, Express & Auth', tier:'crit',
intro:`AlgoRace me tumne likha hai: JWT auth, 15+ API endpoints, 50+ users ek saath, sub-100ms sync, aur code execution sandbox. Har number pe interviewer poochega "kaise?". Sandbox wala sawaal tumhare resume ka sabse mushkil sawaal hai.`,
lessons:[
{
h:`Node.js: ek bahut fast waiter`,
words:[
[`Node.js`,`JavaScript ko browser ke bahar (server pe) chalane wala software.`],
[`I/O`,`Input/Output: database se padhna, file padhna, network request.`],
[`CPU-bound`,`Aisa kaam jisme processor ko khud mehnat karni pade, jaise bada calculation.`],
[`Blocking`,`Aisa kaam jo baaki sabko rok de.`]
],
steps:[
{t:`Node me bhi ek hi thread hai`, b:`<p>Browser jaisa hi: tumhara JavaScript code <strong>ek thread</strong> pe chalta hai, event loop ke saath.</p><p>Real life: ek <strong>bahut fast waiter</strong> jo kai tables sambhalta hai.</p>`},
{t:`Waiting wale kaam me dikkat nahi`, b:`<p>Database ya network ka jawab aane me time lagta hai, lekin waiter <strong>wahan khada nahi rehta</strong>. Doosre order leta rehta hai. Isliye Node I/O me bahut achha hai.</p>`},
{t:`Heavy calculation = sab ruk jaata hai`, code:`
app.get('/heavy', (req, res) => {
  let sum = 0;
  for (let i = 0; i < 5e9; i++) sum += i;   // 5 second ka loop
  res.send(String(sum));
});`, after:`<p>Jab tak ye loop chalega, <strong>baaki saari requests ruki rahengi</strong>. Kyunki event loop wahi ek thread hai jo loop chala raha hai.</p><p>Real life: waiter khud kitchen me khana banane lag gaya, to baaki tables intezaar karengi.</p>`},
{t:`Fix: worker_threads`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>libuv thread pool</th><th>worker_threads</th></tr>
<tr><td>Kaun banata hai</td><td>Node khud (default 4)</td><td>tum khud</td></tr>
<tr><td>Kis kaam ke liye</td><td>file, crypto, zip</td><td>tumhara heavy calculation</td></tr>
<tr><td>Tum control karte ho?</td><td>nahi</td><td>haan</td></tr>
</table></div><p>Dhyan do: <strong>network I/O</strong> in dono me se kisi pe nahi chalta. Wo OS ki async system (epoll) se chalta hai.</p>`}
],
say:`Node runs JavaScript on a single thread with an event loop, so it handles many I/O-bound requests efficiently because it never waits idle. But CPU-heavy work blocks the event loop and stops every other request. For that I would use worker_threads or move the work to a separate service. The libuv thread pool is internal and used for file system and crypto, while network I/O uses the operating system's non-blocking mechanisms.`,
hook:`I/O = Node ke liye aasaan. Heavy CPU = sab ruk jaata hai → worker_threads.`,
check:[[`Ek request 5 second ka loop chalaye to baaki requests ka kya?`,`Sab 5 second ruki rahengi.`]]
},
{
h:`REST API, HTTP methods aur status codes`,
words:[
[`API`,`Do programs ke baat karne ka tareeka.`],
[`Endpoint`,`API ka ek URL, jaise <code>/api/users</code>.`],
[`Middleware`,`Function jo request aur final handler ke beech chalta hai (jaise login check).`],
[`Idempotent`,`Kitni baar bhi karo, result ek hi baar karne jaisa.`]
],
steps:[
{t:`HTTP methods`, b:`<div class="tbl-wrap"><table>
<tr><th>Method</th><th>Kaam</th><th>Idempotent?</th></tr>
<tr><td>GET</td><td>data padhna</td><td>haan</td></tr>
<tr><td>POST</td><td>naya banana / action</td><td>nahi</td></tr>
<tr><td>PUT</td><td>poora replace karna</td><td>haan</td></tr>
<tr><td>PATCH</td><td>thoda sa badalna</td><td>nahi (generally)</td></tr>
<tr><td>DELETE</td><td>hatana</td><td>haan</td></tr>
</table></div>`},
{t:`Idempotent real life me`, b:`<ul><li><strong>Lift ka button:</strong> 5 baar dabao ya 1 baar, lift ek hi baar aayegi. Idempotent.</li><li><strong>Pizza order:</strong> 5 baar dabaya to 5 pizza. Idempotent nahi.</li></ul><p><strong>Kyun zaroori:</strong> network fail ho to idempotent request ko safely dobara bhej sakte ho.</p>`},
{t:`Status codes jo yaad hone chahiye`, b:`<div class="tbl-wrap"><table>
<tr><th>Code</th><th>Matlab</th></tr>
<tr><td>200</td><td>OK</td></tr>
<tr><td>201</td><td>Naya ban gaya</td></tr>
<tr><td>400</td><td>Request galat hai</td></tr>
<tr><td><strong>401</strong></td><td>Tum kaun ho? (login nahi kiya)</td></tr>
<tr><td><strong>403</strong></td><td>Pehchaan liya, lekin permission nahi</td></tr>
<tr><td>404</td><td>Nahi mila</td></tr>
<tr><td>409</td><td>Conflict (jaise duplicate submission)</td></tr>
<tr><td>429</td><td>Bahut zyada requests (rate limit)</td></tr>
<tr><td>500</td><td>Server me error</td></tr>
</table></div>`},
{t:`Express middleware`, code:`
app.use(express.json());            // 1. body padho
app.use(checkLogin);                // 2. login check

app.get('/api/me', (req, res) => {  // 3. asli kaam
  res.json(req.user);
});

app.use((err, req, res, next) => {  // 4. error handler: 4 arguments!
  res.status(500).json({ error: err.message });
});`, after:`<ul><li>Middleware <strong>likhe hue order</strong> me chalte hain. <code>next()</code> agle ko bhejta hai.</li><li><strong>Error handler</strong> ki pehchaan: <strong>4 arguments</strong> <code>(err, req, res, next)</code>. 3 likhe to Express usko normal middleware samjhega.</li></ul>`}
],
say:`GET, PUT and DELETE are idempotent, meaning repeating the request has the same effect as doing it once, which makes them safe to retry. POST is not idempotent. 401 means the client is not authenticated, while 403 means it is authenticated but not allowed. Express middleware runs in the order it is registered and passes control with next. An error-handling middleware is identified by having four parameters.`,
hook:`401 = tum kaun? 403 = pata hai, allowed nahi. Error middleware = 4 arguments.`,
check:[[`POST idempotent hai?`,`Nahi. 5 baar bhejo to 5 cheezein banengi.`]]
},
{
h:`Login, password hashing aur JWT`,
words:[
[`Authentication`,`Tum kaun ho, ye check karna (login).`],
[`Authorization`,`Tumhe kya karne ki permission hai.`],
[`Hashing`,`Password ko ek aise code me badalna jo wapas password nahi ban sakta.`],
[`Salt`,`Har password me joda gaya random data, taaki same password ka hash alag ho.`],
[`Token`,`Login ke baad milne wala pass jo har request ke saath bhejte ho.`]
],
steps:[
{t:`Password kabhi seedha save mat karo`, b:`<p>Database leak hua to saare password chori ho jaayenge. Isliye <strong>hash</strong> save karte hain.</p><ul><li><strong>bcrypt</strong> jaisa slow hash use karo (jaan bujh ke slow, taaki guess karna mehenga ho).</li><li>Har password ke saath <strong>salt</strong>, taaki do logon ka same password alag dikhe.</li><li>Login pe: user ka password hash karo aur saved hash se milao.</li></ul>`},
{t:`JWT kya hai?`, d:`jwt`, b:`<p>JWT ke 3 hisse hain, dot se jude: <strong>header.payload.signature</strong></p><ul><li><strong>Header:</strong> kaunsa algorithm</li><li><strong>Payload:</strong> user id, role, expiry</li><li><strong>Signature:</strong> server ki secret key se bana stamp</li></ul>`},
{t:`Sabse badi galatfehmi: JWT encrypted nahi hai`, b:`<p>JWT sirf <strong>signed</strong> hai, <strong>encrypted nahi</strong>.</p><ul><li>Koi bhi token ko decode karke payload <strong>padh sakta hai</strong>.</li><li>Signature bas ye rokta hai ki koi usko <strong>badal</strong> na sake.</li></ul><p>Real life: festival ka <strong>wristband</strong> jisme hologram hai. Sab padh sakte hain, lekin nakli nahi bana sakte. Isliye payload me password ya secret kabhi mat daalo.</p>`},
{t:`Token kahan rakhein?`, b:`<div class="tbl-wrap"><table>
<tr><th></th><th>localStorage</th><th>httpOnly cookie</th></tr>
<tr><td>JavaScript padh sakta hai?</td><td>haan (XSS attack chura sakta hai)</td><td>nahi (XSS se safe)</td></tr>
<tr><td>Apne aap har request me jaata hai?</td><td>nahi (CSRF se safe)</td><td>haan (CSRF protection chahiye)</td></tr>
</table></div><p><strong>XSS</strong> = hacker ne tumhare page pe apna JavaScript chala diya. <strong>CSRF</strong> = doosri website ne tumhare browser se tumhari cookie ke saath request bhej di.</p><p>Common choice: <strong>httpOnly cookie + SameSite</strong>.</p>`},
{t:`Killer sawaal: JWT ko cancel (revoke) kaise karein?`, b:`<p><strong>Seedha nahi kar sakte.</strong> JWT "stateless" hai. Server kuch yaad nahi rakhta, to cancel karne ko kuch hai hi nahi.</p><p>Tareeke:</p><ol><li><strong>Short expiry + refresh token</strong> (sabse common): access token 15 minute me expire. Refresh token server pe save hota hai, aur usko cancel kar sakte ho.</li><li><strong>Denylist:</strong> cancel kiye tokens ki list. Lekin isse server pe state wapas aa gayi.</li><li><strong>Secret key badal do:</strong> saare tokens ek saath cancel.</li></ol>`}
],
say:`Passwords should be stored as slow, salted hashes using something like bcrypt, never in plain text. A JWT has a header, a payload and a signature. It is signed, not encrypted, so anyone can read the payload but nobody can change it without breaking the signature. You cannot directly revoke a stateless JWT. The common solution is short-lived access tokens with refresh tokens stored on the server, which can be revoked. Other options are a denylist or rotating the signing key.`,
hook:`JWT = padh sakte ho, badal nahi sakte. Revoke = short expiry + refresh token.`,
check:[
[`JWT payload me password rakh sakte hain?`,`Kabhi nahi. Koi bhi decode karke padh sakta hai.`],
[`JWT revoke kaise karoge?`,`Short expiry wala access token + server pe saved refresh token jo cancel ho sake.`]
]
},
{
h:`Code execution sandbox: sabse mushkil sawaal`,
words:[
[`Sandbox`,`Band kamra jahan anjaan code chalta hai, taaki bahar kuch na bigaade.`],
[`Container`,`Docker ka isolated environment.`],
[`Fork bomb`,`Aisa code jo khud ki copies banata rehta hai jab tak system hang na ho.`],
[`cgroup`,`Linux feature jo process ki CPU, memory aur process ki limit lagata hai.`]
],
steps:[
{t:`Sawaal kya hoga`, b:`<p>"Tumhara sandbox users ka code chalata hai. Agar main ye bhejun to kya hoga?"</p><ul><li><code>rm -rf /</code> (sab delete)</li><li>Infinite loop</li><li>Fork bomb</li><li>Crypto mining ya data chori (network se)</li></ul>`},
{t:`Real life samjho`, b:`<p>Kisi anjaan insaan ko apne ghar ka ek kamra use karne dena:</p><ul><li>Kamra <strong>band</strong>, koi khidki nahi (isolation, no network)</li><li>Ek <strong>timer</strong> jo usko bahar nikaal de (timeout)</li><li>Bijli aur saamaan ki <strong>limit</strong> (CPU, memory, process limit)</li></ul>`},
{t:`4 defenses, table me`, b:`<div class="tbl-wrap"><table>
<tr><th>Khatra</th><th>Bachaav</th><th>Kaise</th></tr>
<tr><td>Host system bigaadna</td><td>Isolation</td><td>har run ka alag container, read-only filesystem, non-root user</td></tr>
<tr><td>Infinite loop</td><td>Timeout</td><td>bahar se container kill (andar se nahi)</td></tr>
<tr><td>Fork bomb</td><td>Process limit</td><td><code>--pids-limit</code></td></tr>
<tr><td>Memory bhar dena</td><td>Memory cap</td><td><code>--memory</code></td></tr>
<tr><td>CPU hog karna</td><td>CPU cap</td><td><code>--cpus</code></td></tr>
<tr><td>Mining / data chori</td><td>No network</td><td><code>--network=none</code></td></tr>
</table></div>`},
{t:`Command example`, code:`
docker run --rm
  --network=none
  --memory=256m --cpus=0.5 --pids-limit=64
  --read-only --user 1000:1000
  judge-image ./run_submission`},
{t:`Memory limit cross hui to kya hota hai?`, b:`<p>Linux ka <strong>OOM killer</strong> process ko turant maar deta hai. Container <strong>exit code 137</strong> ke saath band hota hai. Ye koi error nahi jo code pakad sake, seedha kill hai.</p>`},
{t:`Tumhara sabse strong answer: apni kahani`, b:`<p>Tumne Lab 6 me <strong>khud</strong> container memory limit ki wajah se OOM kill debug kiya hai. Interview me wo kahani sunao: kya dikha, kaise pakda, kya badla. Asli debugging ki kahani flags ratne se <strong>kahin zyada</strong> impress karti hai.</p>`}
],
say:`Untrusted code needs several independent defences. Each run goes in its own container with a read-only filesystem and a non-root user. I cap memory, CPU and the number of processes, where the process limit is what stops a fork bomb. I enforce a hard timeout from outside the container, and disable networking so the code cannot exfiltrate data or mine crypto. If the memory limit is exceeded, the kernel's OOM killer terminates the process with exit code 137.`,
hook:`Isolation + memory/CPU/process limit + bahar se timeout + no network.`,
check:[[`Fork bomb ko kaunsa flag rokta hai?`,`<code>--pids-limit</code>`]]
},
{
h:`Socket.IO aur 3 servers pe scale karna`,
words:[
[`WebSocket`,`Browser aur server ke beech hamesha khula rehne wala connection.`],
[`Load balancer`,`Requests ko kai servers me baantne wala.`],
[`Redis`,`Bahut fast in-memory database, messages bhejne (pub/sub) ke liye bhi use hota hai.`],
[`Sticky session`,`Ek user ki saari requests hamesha same server pe bhejna.`]
],
steps:[
{t:`HTTP vs WebSocket`, b:`<ul><li><strong>HTTP:</strong> chitthi. Har baar client poochta hai, server jawab deta hai.</li><li><strong>WebSocket:</strong> phone call. Line khuli hai, dono kabhi bhi bol sakte hain.</li></ul><p>Live leaderboard ke liye WebSocket sahi hai: server khud update bhej sakta hai.</p>`},
{t:`Socket.IO extra kya deta hai?`, b:`<ul><li>Connection toota to <strong>apne aap reconnect</strong></li><li>WebSocket na chale to <strong>polling</strong> pe fallback</li><li><strong>Rooms</strong> (jaise ek race ke saare players)</li><li>Acknowledgement ("message mila?")</li></ul><p>Dhyan do: Socket.IO client, plain WebSocket server se baat <strong>nahi</strong> kar sakta. Iska apna protocol hai.</p>`},
{t:`3 servers pe problem 1: message sabko nahi pahunchta`, b:`<p>User A server 1 pe hai, user B server 2 pe. Server 1 ne "leaderboard badla" bheja, to sirf <strong>server 1 ke users</strong> ko mila.</p><p><strong>Fix: Redis adapter.</strong> Har server message Redis ko deta hai, Redis saare servers ko pahunchata hai.</p><p>Real life: 3 phone pe baata hua group chat, aur Redis wo relay hai jo har message teeno phone pe bhejta hai.</p>`},
{t:`Problem 2: connection shuru hone me gadbad`, b:`<p>Socket.IO connection shuru hone me kai HTTP requests hoti hain. Load balancer ne pehli server 1 ko aur doosri server 2 ko bhej di, to connection fail.</p><p><strong>Fix: sticky sessions</strong>, taaki ek user ki saari requests same server pe jaayein.</p>`},
{t:`"sub-100ms" kaise measure kiya?`, b:`<p>Ye poocha jaayega. Achha answer: server event bhejte waqt timestamp daalo, client pe receive time se minus karo, aur <strong>average ke saath p95</strong> bhi dekho (95% messages kitni der me pahunche).</p>`}
],
say:`WebSockets keep a persistent two-way connection, so the server can push leaderboard updates. Socket.IO adds automatic reconnection, a polling fallback, rooms and acknowledgements on top. To scale across three servers there are two problems. First, an event emitted on one server must reach clients on the others, which the Redis adapter solves using pub/sub. Second, the connection handshake must reach the same server, which needs sticky sessions at the load balancer.`,
hook:`Scale Socket.IO = Redis adapter (messages) + sticky sessions (handshake).`,
check:[[`Redis adapter kaunsi problem solve karta hai?`,`Ek server se bheja message baaki servers ke users tak pahunchana.`]]
}
],
cards:[
{q:`What happens in Node when a request does heavy CPU work?`, s:`Sab ruk jaata hai, kyunki event loop wahi ek thread hai. worker_threads use karo.`, a:`It blocks the single event-loop thread, so every other request waits. Offload the work to worker_threads or a separate service.`},
{q:`What does idempotent mean? Which HTTP methods are idempotent?`, s:`Kitni baar bhi karo, result ek jaisa (lift button). GET, PUT, DELETE haan. POST nahi.`, a:`Repeating the request has the same effect as doing it once. GET, PUT and DELETE are idempotent; POST is not.`},
{q:`401 vs 403?`, s:`401 = login nahi kiya (tum kaun ho?). 403 = login kiya, lekin permission nahi.`, a:`401 means not authenticated; 403 means authenticated but not authorized.`},
{q:`How does Express recognize an error-handling middleware?`, s:`4 arguments se: (err, req, res, next). Sabse last me register karo.`, a:`By having four parameters — err, req, res, next. It should be registered after all routes.`},
{q:`Is a JWT encrypted?`, s:`Nahi, sirf signed. Koi bhi payload padh sakta hai. Signature sirf badalne se rokta hai.`, a:`No, it is signed, not encrypted. Anyone can read the payload; the signature only prevents tampering.`},
{q:`How do you revoke a JWT?`, s:`Seedha nahi kar sakte (stateless). Short expiry access token + server pe refresh token jo cancel ho sake. Ya denylist, ya secret key badlo.`, a:`You cannot revoke a stateless token directly. Use short-lived access tokens with revocable refresh tokens stored server-side, a denylist, or key rotation.`},
{q:`localStorage or httpOnly cookie for tokens?`, s:`localStorage: XSS chura sakta hai. httpOnly cookie: XSS se safe, lekin CSRF protection chahiye (SameSite). Common: httpOnly cookie.`, a:`localStorage is exposed to XSS; httpOnly cookies are hidden from JavaScript but need CSRF protection such as SameSite. Most production apps use httpOnly cookies.`},
{q:`How do you secure a code execution sandbox?`, s:`Har run alag container, memory/CPU/process limit, bahar se timeout, network band. Fork bomb = pids-limit.`, a:`Isolate each run in its own container with a read-only filesystem and non-root user, cap memory, CPU and processes, enforce an external timeout, and disable networking.`},
{q:`How do you store passwords?`, s:`Kabhi plain text nahi. bcrypt jaisa slow hash + salt.`, a:`As slow, salted hashes using an algorithm like bcrypt or argon2, never in plain text.`},
{q:`How do you scale Socket.IO across multiple servers?`, s:`Redis adapter (message sab servers tak) + sticky sessions (handshake same server pe).`, a:`Use the Redis adapter so events reach clients on every server, and sticky sessions so the handshake requests reach the same server.`}
]
});
</script>

<script>
TOPICS.push({
id:'sql', name:'SQL, PostgreSQL & DBMS', tier:'crit',
intro:`AlgoRace ka leaderboard PostgreSQL pe hai, aur DBMS tumhara coursework hai. Leaderboard interviewer ke liye perfect sawaal hai: ranking, same score (ties), ek saath updates, aur index sab ek hi feature me aa jaate hain.`,
lessons:[
{
h:`Tables, keys aur JOIN`,
words:[
[`Table`,`Rows aur columns me data, jaise Excel sheet.`],
[`Primary key`,`Har row ki unique pehchaan, jaise <code>id</code>.`],
[`Foreign key`,`Doosri table ki primary key ka reference. Tables ko jodta hai.`],
[`JOIN`,`Do tables ki rows ko kisi matching column se milaana.`]
],
steps:[
{t:`Example tables`, b:`<div class="tbl-wrap"><table>
<tr><th colspan="3">players</th></tr>
<tr><th>id</th><th>name</th><th>rating</th></tr>
<tr><td>1</td><td>Aman</td><td>1200</td></tr>
<tr><td>2</td><td>Riya</td><td>1350</td></tr>
<tr><td>3</td><td>Kabir</td><td>1100</td></tr>
</table></div>
<div class="tbl-wrap"><table>
<tr><th colspan="3">matches</th></tr>
<tr><th>id</th><th>player_id</th><th>score</th></tr>
<tr><td>10</td><td>1</td><td>80</td></tr>
<tr><td>11</td><td>1</td><td>95</td></tr>
<tr><td>12</td><td>2</td><td>70</td></tr>
</table></div><p><code>matches.player_id</code> ek <strong>foreign key</strong> hai jo <code>players.id</code> ko point karta hai. Kabir (id 3) ne koi match nahi khela.</p>`},
{t:`INNER JOIN: sirf dono taraf match wale`, code:`
SELECT p.name, m.score
FROM players p
INNER JOIN matches m ON m.player_id = p.id;`, after:`<p><strong>Result: 3 rows</strong> (Aman 80, Aman 95, Riya 70). Kabir nahi aaya, kyunki uska koi match nahi.</p>`},
{t:`LEFT JOIN: left table ki saari rows`, code:`
SELECT p.name, m.score
FROM players p
LEFT JOIN matches m ON m.player_id = p.id;`, after:`<p><strong>Result: 4 rows</strong>. Kabir bhi aaya, uska score <code>NULL</code>.</p><p>Yaad rakho: LEFT JOIN = left wale sab, right se jo mile.</p>`},
{t:`WHERE vs HAVING`, code:`
SELECT player_id, COUNT(*) AS games
FROM matches
WHERE score > 50          -- group banne se PEHLE rows filter
GROUP BY player_id
HAVING COUNT(*) >= 2;     -- group banne ke BAAD groups filter`, after:`<ul><li><strong>WHERE</strong> = har row pe, grouping se pehle.</li><li><strong>HAVING</strong> = har group pe, grouping ke baad. Isliye COUNT/SUM wahi likh sakte ho.</li></ul>`}
],
say:`A primary key uniquely identifies each row, and a foreign key references another table's primary key. An inner join returns only rows that match on both sides, while a left join returns every row from the left table, with NULLs where there is no match. WHERE filters rows before grouping, and HAVING filters groups after aggregation.`,
hook:`INNER = dono me match. LEFT = left ke sab. WHERE pehle, HAVING group ke baad.`,
check:[[`Upar ke data pe LEFT JOIN me kitni rows aayengi?`,`4. Aman ki 2, Riya ki 1, aur Kabir ki 1 (NULL score ke saath).`]]
},
{
h:`Index: database ki kitaab ka index`,
words:[
[`Index`,`Ek alag sorted structure jo data jaldi dhoondhne me madad karta hai.`],
[`Sequential scan`,`Poori table ki har row padhna.`],
[`B-tree`,`Balanced tree jisme data sorted rehta hai. Postgres ka default index.`],
[`Selectivity`,`Condition kitni kam rows chunti hai. Kam rows = high selectivity.`]
],
steps:[
{t:`Real life samjho`, b:`<p>Kitaab me "photosynthesis" dhoondhna hai. Har page padhoge? Nahi. <strong>Peeche wala index</strong> dekhoge (alphabetical), page number milega, seedha wahan jaoge.</p><p>Database index bilkul yahi hai. Index nahi hai to database <strong>har row padhta hai</strong> (sequential scan).</p>`},
{t:`B-tree kaise dikhta hai`, d:`btree`, b:`<ul><li>Upar se neeche aao, har level pe sahi branch chuno.</li><li>3-4 levels me hi lakhon rows cover ho jaati hain. Isliye lookup <strong>O(log n)</strong>.</li><li>Neeche ke leaf nodes aapas me <strong>jude hote hain</strong>, to range (jaise rating 1200 se 1300) dhoondhna bhi fast.</li></ul>`},
{t:`Kab index use NAHI hota (important)`, b:`<ol><li><code>LIKE '%abc'</code>: shuru me <code>%</code>. Kitaab ka index shuru ke letters se sorted hai. "synthesis pe khatam hone wale words" alphabetical index se nahi milte.</li><li><code>WHERE lower(email) = ...</code>: column pe function lagaya. Index <code>email</code> pe hai, <code>lower(email)</code> pe nahi.</li><li><strong>Bahut saari rows</strong> match hon (jaise 40%): poori table padhna hi sasta hai, Postgres sahi decision leta hai.</li><li><strong>Chhoti table</strong>: index ki zaroorat hi nahi.</li></ol>`},
{t:`Composite index: column ka order matter karta hai`, b:`<p>Index <code>(last_name, first_name)</code> ek <strong>phone book</strong> hai: pehle surname se sorted, phir naam se.</p><div class="tbl-wrap"><table>
<tr><th>Query</th><th>Index use hoga?</th></tr>
<tr><td><code>WHERE last_name = 'Raj'</code></td><td>haan</td></tr>
<tr><td><code>WHERE last_name = 'Raj' AND first_name = 'Roshan'</code></td><td>haan</td></tr>
<tr><td><code>WHERE first_name = 'Roshan'</code></td><td><strong>nahi</strong></td></tr>
</table></div><p>Phone book me sirf first name se dhoondhna = poori book padhna.</p>`},
{t:`Guess mat karo, EXPLAIN ANALYZE chalao`, code:`
EXPLAIN ANALYZE
SELECT * FROM players WHERE rating > 1300;`, after:`<ul><li><strong>EXPLAIN</strong>: plan batata hai, query chalata nahi.</li><li><strong>EXPLAIN ANALYZE</strong>: query <strong>chalata hai</strong> aur asli time + asli rows batata hai.</li><li>Estimated rows aur actual rows me bahut farak = statistics purani hain, <code>ANALYZE</code> chalao.</li></ul>`}
],
say:`An index is a separate sorted structure, usually a B-tree, that lets the database find rows in O(log n) instead of scanning the whole table, and its linked leaves make range scans cheap. PostgreSQL will skip an index for a leading wildcard LIKE, for a function applied to the column, or when the condition matches a large fraction of rows. A composite index on columns a and b works for queries on a, or a and b, but not on b alone. I check with EXPLAIN ANALYZE instead of guessing.`,
hook:`Index (a, b) = phone book. Sirf b se dhoondhna kaam nahi karega.`,
check:[
[`<code>LIKE 'abc%'</code> me index chalega?`,`Haan, kyunki shuru ke letters pata hain. <code>'%abc'</code> me nahi.`],
[`EXPLAIN aur EXPLAIN ANALYZE me farak?`,`EXPLAIN sirf plan batata hai. EXPLAIN ANALYZE query chala ke asli time batata hai.`]
]
},
{
h:`Transactions, ACID aur isolation levels`,
words:[
[`Transaction`,`Kai SQL kaamon ka group jo ya to poora hoga ya bilkul nahi.`],
[`Commit`,`Transaction pakka karna.`],
[`Rollback`,`Transaction cancel karke sab pehle jaisa karna.`],
[`Isolation`,`Ek saath chal rahe transactions ek doosre ka adhoora kaam na dekhein.`]
],
steps:[
{t:`Bank transfer example`, code:`
BEGIN;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;`, after:`<p>Agar pehli line ke baad server band ho gaya? Paise ek account se gaye, doosre me aaye nahi. Transaction isse bachata hai.</p>`},
{t:`ACID ke 4 letters`, b:`<div class="tbl-wrap"><table>
<tr><th>Letter</th><th>Matlab</th><th>Bank example</th></tr>
<tr><td><strong>A</strong>tomicity</td><td>sab ya kuch nahi</td><td>paise gaye aur aaye, ya dono nahi</td></tr>
<tr><td><strong>C</strong>onsistency</td><td>rules hamesha sahi</td><td>balance negative nahi ho sakta</td></tr>
<tr><td><strong>I</strong>solation</td><td>adhoora kaam koi nahi dekhta</td><td>beech me koi aadha transfer nahi dekhega</td></tr>
<tr><td><strong>D</strong>urability</td><td>commit hua to pakka</td><td>commit ke baad bijli gayi to bhi safe</td></tr>
</table></div>`},
{t:`Ek saath kaam karne se 3 problems`, b:`<ul><li><strong>Dirty read:</strong> doosre ka <strong>uncommitted</strong> (abhi pakka nahi hua) data padh liya. Wo rollback hua to tumne jhooth padha.</li><li><strong>Non-repeatable read:</strong> ek hi <strong>row</strong> do baar padhi, beech me kisi ne badal di, alag value mili.</li><li><strong>Phantom read:</strong> ek hi <strong>query</strong> do baar chalayi, beech me kisi ne nayi row daal di, <strong>zyada rows</strong> aayi.</li></ul>`},
{t:`Isolation levels: deewar kitni moti`, b:`<div class="tbl-wrap"><table>
<tr><th>Level</th><th>Dirty</th><th>Non-repeatable</th><th>Phantom</th></tr>
<tr><td>Read Uncommitted</td><td>ho sakta</td><td>ho sakta</td><td>ho sakta</td></tr>
<tr><td>Read Committed (Postgres default)</td><td>ruka</td><td>ho sakta</td><td>ho sakta</td></tr>
<tr><td>Repeatable Read</td><td>ruka</td><td>ruka</td><td>ho sakta*</td></tr>
<tr><td>Serializable</td><td>ruka</td><td>ruka</td><td>ruka</td></tr>
</table></div><p>* Postgres me Repeatable Read phantom bhi rok deta hai (snapshot use karta hai). Ye bonus point hai.</p><p>Level jitna upar, utni safety, lekin utna slow.</p>`}
],
say:`A transaction groups statements so they either all commit or all roll back. ACID means atomicity — all or nothing; consistency — constraints always hold; isolation — concurrent transactions do not see each other's partial work; and durability — committed data survives a crash. A dirty read sees uncommitted data, a non-repeatable read gets different values for the same row, and a phantom read gets new rows for the same query. Read Committed prevents dirty reads, Repeatable Read also prevents non-repeatable reads, and Serializable prevents all three. PostgreSQL defaults to Read Committed.`,
hook:`Dirty → Read Committed. Non-repeatable → Repeatable Read. Phantom → Serializable.`,
check:[[`Postgres ka default isolation level?`,`Read Committed.`]]
},
{
h:`Race condition: lost update aur N+1 problem`,
words:[
[`Race condition`,`Do kaam ek saath chale aur result is baat pe depend kare ki kaun pehle khatam hua.`],
[`Lock`,`Row pe taala, taaki doosra usko tab tak na badle.`],
[`ORM`,`Library jo SQL ki jagah code se database use karne deti hai (jaise Drizzle).`]
],
steps:[
{t:`Problem: ek update gayab ho gaya`, d:`lostupdate`, b:`<p>Aman ne do matches ek hi second me khatam kiye:</p><ol><li>Request A: rating padhi = 1200</li><li>Request B: rating padhi = 1200</li><li>A: 1200 + 15 = <strong>1215</strong> likha</li><li>B: 1200 − 15 = <strong>1185</strong> likha</li><li>Final: 1185. A ka +15 <strong>gayab</strong>.</li></ol><p>Real life: do log ek hi Google Sheet cell offline edit karein. Jo baad me save karega, uska jeetega. Pehle wale ka kaam chupchap gaya.</p>`},
{t:`Fix 1 (best): database ko khud jodne do`, code:`
UPDATE players SET rating = rating + 15 WHERE id = 1;`, after:`<p>"Jo bhi abhi value hai usme 15 jodo". Database padhna aur likhna ek saath, taale ke saath karta hai. Koi update gayab nahi hoga.</p>`},
{t:`Fix 2: row pe taala (SELECT FOR UPDATE)`, code:`
BEGIN;
SELECT rating FROM players WHERE id = 1 FOR UPDATE;  -- taala laga
-- app me naya ELO calculate karo
UPDATE players SET rating = 1215 WHERE id = 1;
COMMIT;                                              -- taala khula`, after:`<p>Doosri request ko pehli ke commit hone tak <strong>rukna padega</strong>. Jab calculation app code me hi karni ho, tab ye use karo.</p>`},
{t:`Fix 3: version column (optimistic)`, code:`
UPDATE players SET rating = 1215, version = version + 1
WHERE id = 1 AND version = 7;`, after:`<p>0 rows update hui = kisi aur ne pehle badal diya. Dobara padho aur try karo. Jab takraav kam ho, tab achha hai.</p>`},
{t:`N+1 query problem`, code:`
const matches = await db.select().from(matchesTable);   // 1 query
for (const m of matches) {
  m.player = await db.select().from(players)
    .where(eq(players.id, m.playerId));                 // har match ke liye 1 query
}
// 50 matches = 51 queries!`, after:`<p><strong>Fix:</strong> ek JOIN likho, ya saari ids ek saath maango (<code>WHERE id = ANY(...)</code>). 51 queries ki jagah 1 ya 2.</p>`}
],
say:`A lost update happens when two requests read the same value, compute new values in application code, and write back, so one write overwrites the other. The best fix is an atomic update like SET rating = rating + 15, which the database performs under a row lock. If the calculation must happen in the application, I use SELECT FOR UPDATE inside a transaction, or optimistic concurrency with a version column and retry. The N+1 problem is running one query per item in a loop; I fix it with a join or a single batched query.`,
hook:`App me padh ke likhna = gadbad. SET rating = rating + x likho.`,
check:[[`50 matches ke liye loop me player fetch kiya. Kitni queries?`,`51. Ye N+1 problem hai. JOIN se 1 query.`]]
},
{
h:`Ranking, normalization aur connection pooling`,
words:[
[`Window function`,`Aisa function jo har row ke saath poori list ko dekh ke calculate karta hai, jaise rank.`],
[`Normalization`,`Data ko aise todna ki repeat na ho.`],
[`Connection pool`,`Kuch database connections ka set jo kai requests share karti hain.`]
],
steps:[
{t:`Top 10 players rank ke saath`, code:`
SELECT name, rating,
       RANK() OVER (ORDER BY rating DESC) AS rank
FROM players
ORDER BY rating DESC
LIMIT 10;`},
{t:`RANK vs DENSE_RANK vs ROW_NUMBER`, b:`<p>Ratings: 100, 90, 90, 80</p><div class="tbl-wrap"><table>
<tr><th>Function</th><th>Result</th><th>Real life</th></tr>
<tr><td>RANK()</td><td>1, 2, 2, <strong>4</strong></td><td>Olympics: 2 gold ho gaye to agla bronze</td></tr>
<tr><td>DENSE_RANK()</td><td>1, 2, 2, <strong>3</strong></td><td>agle ko silver mil jaata hai</td></tr>
<tr><td>ROW_NUMBER()</td><td>1, 2, 3, 4</td><td>har kisi ka alag number</td></tr>
</table></div>`},
{t:`Normalization simple me`, b:`<ul><li><strong>1NF:</strong> ek cell me ek hi value. "95, 80, 70" ek cell me nahi.</li><li><strong>2NF:</strong> composite key ho to har column <strong>poori key</strong> pe depend kare, aadhi pe nahi.</li><li><strong>3NF:</strong> column sirf key pe depend kare, kisi doosre column pe nahi. Jaise <code>city_pincode</code> ko city se alag table me rakho.</li></ul>`},
{t:`Kab jaan bujh ke normalization todein (denormalize)?`, b:`<p>Leaderboard <strong>bahut zyada padha</strong> jaata hai, kam likha jaata hai. Har baar rank calculate karna mehenga hai.</p><p>To player row me hi <code>rank</code> ya <code>total_matches</code> save kar do. Padhna fast, likhna thoda complex. Ye <strong>soch samajh ke liya tradeoff</strong> hai. Interview me yahi shabd bolo.</p>`},
{t:`Vercel + Neon pe connection pooling kyun zaroori?`, b:`<ul><li>Vercel pe har request ek naya chhota function chalata hai.</li><li>Har function apna naya Postgres connection kholega.</li><li>Postgres ki <strong>connection limit</strong> hoti hai (har connection ek alag process, memory khaata hai).</li><li>Traffic badha to limit cross, "too many clients" error.</li></ul><p><strong>Fix:</strong> pooler (PgBouncer ya Neon ka pooled URL). Real life: har passenger apni car nahi khareedta, <strong>taxi stand</strong> ki kuch taxis sab share karte hain.</p>`}
],
say:`For a leaderboard I use a window function like RANK over rating descending. RANK leaves gaps after ties, DENSE_RANK does not, and ROW_NUMBER always gives unique numbers. I normalize to third normal form by default, but a read-heavy leaderboard can be deliberately denormalized by storing precomputed values, trading write complexity for fast reads. On serverless platforms like Vercel with Neon, each invocation may open its own connection and exhaust Postgres's connection limit, so a connection pooler is required.`,
hook:`RANK me gap, DENSE_RANK me nahi. Serverless + Postgres = pooler chahiye.`,
check:[[`100, 90, 90, 80 pe DENSE_RANK?`,`1, 2, 2, 3`]]
}
],
cards:[
{q:`INNER JOIN vs LEFT JOIN?`, s:`INNER: sirf jahan dono tables me match ho. LEFT: left table ki saari rows, match na ho to NULL.`, a:`An inner join returns only matching rows from both tables. A left join returns every row from the left table, with NULLs where the right side has no match.`},
{q:`WHERE vs HAVING?`, s:`WHERE: grouping se pehle rows filter. HAVING: grouping ke baad groups filter (COUNT/SUM ke saath).`, a:`WHERE filters rows before grouping; HAVING filters groups after aggregation.`},
{q:`When will PostgreSQL not use an index?`, s:`LIKE '%abc' (shuru me %), column pe function (lower(email)), bahut saari rows match hon, ya table chhoti ho.`, a:`With a leading wildcard LIKE, a function on the column, a low-selectivity condition matching many rows, or a very small table.`},
{q:`Index on (a, b) — which queries can use it?`, s:`a pe, aur a + b pe. Sirf b pe nahi. Phone book jaisa.`, a:`Queries filtering on a, or on a and b. Not queries filtering on b alone, because the index is sorted by a first.`},
{q:`Explain ACID.`, s:`Atomicity: sab ya kuch nahi. Consistency: rules sahi. Isolation: adhoora kaam koi nahi dekhta. Durability: commit hua to pakka.`, a:`Atomicity — all or nothing. Consistency — constraints always hold. Isolation — concurrent transactions do not see partial work. Durability — committed data survives crashes.`},
{q:`Dirty read vs non-repeatable read vs phantom read?`, s:`Dirty: uncommitted data padha. Non-repeatable: same row do baar, alag value. Phantom: same query do baar, nayi rows.`, a:`A dirty read sees uncommitted data; a non-repeatable read gets different values for the same row; a phantom read gets different rows for the same query.`},
{q:`How do you prevent a lost update when two ELO updates race?`, s:`Best: UPDATE ... SET rating = rating + x. Ya SELECT FOR UPDATE transaction me. Ya version column + retry.`, a:`Use an atomic update such as SET rating = rating + x. Alternatively, lock the row with SELECT FOR UPDATE inside a transaction, or use a version column and retry on conflict.`},
{q:`What is the N+1 query problem?`, s:`Pehle list ke liye 1 query, phir har item ke liye 1 query loop me. 50 items = 51 queries. Fix: JOIN ya batch query.`, a:`Fetching a list with one query and then running one more query per item in a loop. Fix it with a join or one batched query.`},
{q:`RANK vs DENSE_RANK?`, s:`100,90,90,80 → RANK: 1,2,2,4 (gap). DENSE_RANK: 1,2,2,3 (no gap).`, a:`Both give ties the same rank, but RANK leaves a gap afterwards and DENSE_RANK does not.`},
{q:`Why do you need connection pooling with serverless and Postgres?`, s:`Har function apna connection kholta hai, Postgres ki limit cross ho jaati hai. Pooler kuch connections sabme share karta hai.`, a:`Each serverless invocation may open its own connection, and Postgres has a hard connection limit because every connection is a process. A pooler shares a few connections among many clients.`}
]
});

h:`Process vs Thread`,
words:[
[`Process`,`Chalta hua program. Iski apni alag memory hoti hai.`],

steps:[
{t:`Real life samjho`, b:`<ul><li><strong>Process</strong> = ek alag <strong>flat</strong>, apni rasoi ke saath.</li><li><strong>Threads</strong> = ek hi flat ke <strong>roommates</strong>. Rasoi aur fridge share karte hain, lekin har ek ka apna bedroom hai.</li></ul>`},
{t:`Kya share hota hai, kya nahi`, d:`procthread`, b:`<div class="tbl-wrap"><table>
<tr><th>Threads me SHARE</th><th>Har thread ka APNA</th></tr>
<tr><td>code, heap, global variables, open files</td><td>stack, registers, program counter</td></tr>
</table></div><p>Heap share hai, isliye threads aapas me <strong>aasani se</strong> data bhej sakte hain. Lekin isi wajah se <strong>race condition</strong> bhi hoti hai (fridge ka aakhri doodh dono ne utha liya).</p>`},

{t:`Context switch kyun mehenga hai?`, b:`<ol><li>Purane process ke registers aur program counter save karo.</li><li>Naye ke load karo.</li><li><strong>Process switch</strong> me memory map bhi badalta hai, to <strong>TLB</strong> (address ka cache) saaf ho jaata hai.</li><li>CPU cache me purane process ka data hai, naye ke liye <strong>cache thanda</strong> hai.</li></ol><p>Thread switch sasta hai, kyunki memory map same rehta hai.</p>`},

<tr><th>Algorithm</th><th>Kaise</th><th>Dikkat</th></tr>

<tr><td>SJF</td><td>sabse chhota kaam pehle</td><td>future pata hona chahiye, bade kaam starve</td></tr>
<tr><td>Round Robin</td><td>sabko barabar time slice</td><td>slice size sahi chunna padta hai</td></tr>
<tr><td>Priority</td><td>important pehle</td><td>starvation (aging se fix)</td></tr>

],
say:`A process is a running program with its own address space. A thread is a unit of execution inside a process. Threads share the code, heap, global data and open files, but each has its own stack, registers and program counter. Sharing memory makes communication cheap but causes race conditions. A context switch saves and restores CPU state, and switching processes is more expensive because the address space changes, which flushes the TLB and leaves caches cold.`,
hook:`Threads = roommates: heap share, stack alag.`,
check:[[`Do threads ka stack share hota hai?`,`Nahi. Stack har thread ka apna. Heap share hota hai.`]]
},
{
h:`Race condition, mutex aur semaphore`,
words:[
[`Race condition`,`Do threads ek saath same data badlein aur result galat aaye.`],
[`Critical section`,`Code ka wo hissa jahan shared data badalta hai.`],
[`Mutex`,`Taala. Ek time pe sirf ek thread andar.`],
[`Semaphore`,`Counter wala taala. Ek saath N threads andar.`]
],
steps:[
{t:`count++ bhi safe nahi hai`, b:`<p><code>count++</code> asal me 3 kaam hai: (1) padho, (2) +1 karo, (3) likho.</p><ol><li>Thread A padhta hai: 5</li><li>Thread B padhta hai: 5</li><li>A likhta hai: 6</li><li>B likhta hai: 6</li></ol><p>Do baar +1 hua, lekin result <strong>6</strong> hai, 7 nahi. Ye race condition hai.</p>`},
{t:`Mutex: bathroom ki chaabi`, code:`
std::mutex m;
void add() {
    std::lock_guard<std::mutex> lock(m);   // taala laga (RAII)
    count++;
}                                          // scope khatam -> taala khula`, after:`<p>Ek time pe ek hi thread andar. Aur jisne taala lagaya, <strong>wahi kholta hai</strong> (mutex ka owner hota hai).</p>`},
{t:`Semaphore: parking ka board`, b:`<p>Parking me 5 jagah hain. Board pe likha hai "5 khaali".</p><ul><li>Car aayi: <code>wait()</code>, count −1</li><li>Car gayi: <code>signal()</code>, count +1</li><li>0 hai: nayi car <strong>intezaar</strong> karegi</li></ul><p>Semaphore ka koi owner nahi. Koi bhi thread signal kar sakta hai.</p>`},
{t:`Spinlock`, b:`<p>Taala khulne ka intezaar <strong>so ke nahi</strong>, baar baar check karke (ghoom ke) karta hai. Sirf tab sahi hai jab critical section <strong>bahut chhota</strong> ho, context switch se bhi chhota.</p>`},
{t:`Producer-Consumer (bahut poocha jaata hai)`, code:`
semaphore empty = N;   // khaali jagah
semaphore full  = 0;   // bhari jagah
mutex m;

producer:  wait(empty); lock(m); add_item();    unlock(m); signal(full);
consumer:  wait(full);  lock(m); remove_item(); unlock(m); signal(empty);`, after:`<p><strong>Trap:</strong> agar pehle <code>lock(m)</code> aur phir <code>wait(empty)</code> likha, to buffer full hone pe producer taala pakde pakde so jaayega. Consumer andar aa hi nahi payega. <strong>Deadlock.</strong></p>`}
],
say:`A race condition happens when multiple threads access shared data and the result depends on timing — even count plus plus is a read, an add and a write. A mutex allows one thread into the critical section and is owned by the thread that locks it. A semaphore is a counter that allows up to N threads and has no owner. A spinlock busy-waits and is only suitable for very short critical sections. In producer-consumer, the semaphore must be acquired before the mutex, otherwise a full buffer deadlocks.`,
hook:`Mutex = ek chaabi, owner hai. Semaphore = parking counter, owner nahi.`,
check:[[`count++ atomic hai?`,`Nahi. Padhna, jodna, likhna: 3 steps.`]]
},
{
h:`Deadlock`,
words:[
[`Deadlock`,`Do ya zyada threads hamesha ke liye ek doosre ka intezaar karte rahein.`],
[`Preemption`,`Resource ko zabardasti chheen lena.`]
],
steps:[
{t:`Real life samjho`, b:`<p>Ek-lane pul pe do cars aamne saamne. Dono keh rahi hain "pehle tum peeche jao". Koi nahi hilega. Ye deadlock hai.</p>`},
{t:`Code me kaise hota hai`, d:`deadlock`, code:`
Thread 1:  lock(A);  lock(B);   // A pakda, B ka intezaar
Thread 2:  lock(B);  lock(A);   // B pakda, A ka intezaar`},
{t:`4 conditions: CHAARON honi chahiye`, b:`<div class="tbl-wrap"><table>
<tr><th>Condition</th><th>Matlab</th><th>Kaise todein</th></tr>
<tr><td>Mutual exclusion</td><td>resource share nahi ho sakta</td><td>shareable resource use karo</td></tr>
<tr><td>Hold and wait</td><td>ek pakda, doosra maang raha</td><td>saare ek saath maango</td></tr>
<tr><td>No preemption</td><td>chheena nahi ja sakta</td><td>timeout lagao, chhod do</td></tr>
<tr><td>Circular wait</td><td>gol ghera ban gaya</td><td><strong>sab ek hi order me lock karein</strong></td></tr>
</table></div><p>Ek bhi condition todo, deadlock <strong>ho hi nahi sakta</strong>.</p>`},
{t:`Practical fix: lock ordering`, code:`
// Rule: hamesha pehle A, phir B
Thread 1:  lock(A);  lock(B);
Thread 2:  lock(A);  lock(B);   // ab gol ghera ban hi nahi sakta`}
],
say:`Deadlock requires four conditions at the same time: mutual exclusion, hold and wait, no preemption, and circular wait. Breaking any one of them prevents deadlock. The most practical fix is a global lock ordering, where every thread acquires locks in the same order, which makes a circular wait impossible. Other approaches are acquiring all resources at once or using lock timeouts.`,
hook:`4 conditions chahiye. Sab ek order me lock karo = circular wait khatam.`,
check:[[`Deadlock rokne ka sabse practical tareeka?`,`Saare locks hamesha ek hi order me lena.`]]
},
{
h:`Virtual memory, paging aur page fault`,

[`Physical address`,`RAM ka asli address.`],
[`Page / Frame`,`Memory ke chhote fixed tukde (aam taur pe 4 KB). Virtual me page, RAM me frame.`],
