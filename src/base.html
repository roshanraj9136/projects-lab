<script>
const DAY = 86400000;
const IV = [0, 1, 3, 7, 16, 35, 80];
const NEW_PER_SESSION = 12;

let progress = { cards:{}, read:{} };
let mode = 'learn';
let current = TOPICS[0].id;
let scope = 'topic';
let store = null;
let saveTimer = null;
let session = null;

try{
  const last = localStorage.getItem('labhi.topic');
  if(last && TOPICS.some(t => t.id === last)) current = last;
}catch(e){}

const ALL = [];
TOPICS.forEach(t => t.cards.forEach((c, i) => ALL.push({ id:t.id + '.' + i, topic:t, card:c })));
const topicById = id => TOPICS.find(t => t.id === id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

document.querySelector('.mode[data-m="learn"]').textContent = 'Padho';
document.querySelector('.mode[data-m="drill"]').textContent = 'Practice';

function counts(filterTopic){
  const now = Date.now();
  let due = 0, fresh = 0, learned = 0;
  ALL.forEach(x => {
    if(filterTopic && x.topic.id !== filterTopic) return;
    const st = progress.cards[x.id];
    if(!st) fresh++;
    else { if(st.due <= now) due++; if(st.b >= 2) learned++; }
  });
  return { due, fresh, learned };
}

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = { cards:progress.cards, read:progress.read, updatedAt:Date.now() };
    if(store){ try{ await store.set(body); return; }catch(e){} }
    try{ localStorage.setItem('labhi.progress', JSON.stringify(body)); }catch(e){}
  }, 600);
}

function adopt(body){
  if(!body || typeof body !== 'object') return;
  const cards = body.cards && typeof body.cards === 'object' ? body.cards : {};
  const read = body.read && typeof body.read === 'object' ? body.read : {};
  const clean = {};
  for(const k in cards){
    const v = cards[k];
    if(v && typeof v.b === 'number' && typeof v.due === 'number') clean[k] = { b:v.b, due:v.due, n:v.n || 0 };
  }
  progress = { cards:clean, read:read };
}

const sideEl = document.getElementById('side');
const mainEl = document.getElementById('main');

function renderSide(){
  const groups = [
    ['Critical — pakka aana chahiye', TOPICS.filter(t => t.tier === 'crit')],
    ['Moderate aur risky', TOPICS.filter(t => t.tier !== 'crit')]
  ];
  sideEl.innerHTML = '';
  groups.forEach(([label, list]) => {
    if(!list.length) return;
    const block = document.createElement('div');
    block.className = 'side-block';
    const h = document.createElement('p');
    h.className = 'side-h';
    h.textContent = label;
    block.appendChild(h);
    const ul = document.createElement('ul');
    ul.className = 'nav';
    list.forEach(t => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-current', t.id === current ? 'true' : 'false');
      b.dataset.done = progress.read[t.id] ? '1' : '0';
      const c = counts(t.id);
      b.innerHTML = '<span class="tick"></span><span class="nm"></span><span class="ct"></span>';
      b.querySelector('.nm').textContent = t.name;
      b.querySelector('.ct').textContent = c.learned + '/' + t.cards.length;
      b.title = t.cards.length + ' me se ' + c.learned + ' cards yaad';
      b.addEventListener('click', () => {
        current = t.id;
        try{ localStorage.setItem('labhi.topic', current); }catch(e){}
        if(mode === 'drill'){ scope = 'topic'; session = null; }
        render();
        window.scrollTo({ top:0 });
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    block.appendChild(ul);
    sideEl.appendChild(block);
  });
}

function renderDuePill(){
  const c = counts(null);
  const pill = document.getElementById('duePill');
  pill.textContent = c.due + ' revise · ' + c.fresh + ' naye';
  pill.classList.toggle('zero', c.due === 0);
}

function renderLesson(t, L, i){
  let h = '<article class="lesson" id="L-' + t.id + '-' + i + '">';
  h += '<div class="lesson-h"><span class="ln">Lesson ' + (i + 1) + '</span><h2>' + L.h + '</h2></div>';
  h += '<div class="lesson-b">';
  if(L.words && L.words.length){
    h += '<div class="words"><p class="words-h">Naye words</p><dl>' +
      L.words.map(w => '<dt>' + w[0] + '</dt><dd>' + w[1] + '</dd>').join('') + '</dl></div>';
  }
  h += '<ol class="steps">';
  L.steps.forEach((s, j) => {
    h += '<li class="step"><div class="step-n-wrap"><span class="step-n">' + (j + 1) + '</span></div><div class="step-body">';
    h += '<p class="step-t">' + s.t + '</p><div class="step-c">';
    if(s.b) h += s.b;
    if(s.code) h += '<pre>' + esc(s.code.replace(/^\s*\n/, '').replace(/\s+$/, '')) + '</pre>';
    if(s.d && typeof DIAGRAMS !== 'undefined' && DIAGRAMS[s.d]) h += '<figure><div class="dg">' + DIAGRAMS[s.d]() + '</div></figure>';
    if(s.after) h += s.after;
    h += '</div></div></li>';
  });
  h += '</ol>';
  if(L.say) h += '<div class="bolo"><b>Interview me bolo (English me)</b>' + L.say + '</div>';
  if(L.hook) h += '<div class="yaad"><span>Yaad rakho</span>' + L.hook + '</div>';
  if(L.check && L.check.length){
    h += '<div class="check"><p class="check-h">Khud check karo</p>' +
      L.check.map(c => '<details class="q"><summary>' + c[0] + '</summary><div class="qa">' + c[1] + '</div></details>').join('') +
      '</div>';
  }
  h += '</div></article>';
  return h;
}

function renderLearn(){
  const t = topicById(current);
  const tierLabel = { crit:'Critical', mod:'Moderate', liab:'Risky' }[t.tier];
  let h = '<div class="lede-wrap">';
  h += '<p class="crumb"><span class="tier ' + t.tier + '">' + tierLabel + '</span><span>' +
       t.lessons.length + ' lessons · ' + t.cards.length + ' flashcards</span></p>';
  h += '<h1 class="topic"></h1><p class="why"></p></div>';

  if(t.id === TOPICS[0].id && !progress.read[t.id]){
    h += '<div class="intro-card">' +
      '<div><strong>1. Lesson dhyan se padho</strong>Pehle "Naye words" dekho, phir steps ek ek karke.</div>' +
      '<div><strong>2. English answer bolke practice karo</strong>Green box wala answer zor se bolo.</div>' +
      '<div><strong>3. Practice tab me flashcards</strong>Card bhoolne se pehle wapas aayega.</div>' +
    '</div>';
  }

  h += '<nav class="jump" aria-label="Lessons">' +
    t.lessons.map((L, i) => '<button type="button" data-i="' + i + '"><b>' + (i + 1) + '</b>' + L.h + '</button>').join('') +
    '</nav>';

  t.lessons.forEach((L, i) => { h += renderLesson(t, L, i); });

  const c = counts(t.id);
  h += '<div class="topic-foot"><p><strong>' + t.cards.length + ' flashcards</strong> is topic ke: ' +
    c.learned + ' yaad, ' + c.due + ' aaj revise, ' + c.fresh + ' abhi shuru nahi.</p>' +
    '<button class="primary" id="goDrill" type="button">Practice karo</button>' +
    '<button class="mini" id="markRead" type="button">' + (progress.read[t.id] ? 'Padh liya ✓' : 'Padh liya mark karo') + '</button></div>';

  mainEl.innerHTML = h;
  mainEl.querySelector('h1.topic').textContent = t.name;
  mainEl.querySelector('p.why').textContent = t.intro;

  mainEl.querySelectorAll('.jump button').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById('L-' + t.id + '-' + b.dataset.i);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }));
  document.getElementById('goDrill').addEventListener('click', () => { scope = 'topic'; session = null; setMode('drill'); });
  document.getElementById('markRead').addEventListener('click', () => {
    if(progress.read[t.id]) delete progress.read[t.id]; else progress.read[t.id] = 1;
    save(); render();
  });
}

function buildSession(){
  const now = Date.now();
  const pool = ALL.filter(x => scope === 'all' || x.topic.id === current);
  const due = pool.filter(x => progress.cards[x.id] && progress.cards[x.id].due <= now)
                  .sort((a, b) => progress.cards[a.id].due - progress.cards[b.id].due);
  const fresh = pool.filter(x => !progress.cards[x.id]).slice(0, NEW_PER_SESSION);
  const queue = due.concat(fresh);
  return { queue, total:queue.length, done:0, revealed:false };
}

function schedule(id, grade){
  const now = Date.now();
  const st = progress.cards[id] || { b:0, due:now, n:0 };
  let b = st.b, due;
  if(grade === 'again'){ b = 0; due = now + 60 * 1000; }
  else if(grade === 'hard'){ b = Math.max(1, b); due = now + Math.max(0.5, IV[b] * 0.5) * DAY; }
  else if(grade === 'good'){ b = Math.min(IV.length - 1, b + 1); due = now + IV[b] * DAY; }
  else { b = Math.min(IV.length - 1, b + 2); due = now + IV[b] * DAY; }
  return { b, due, n:(st.n || 0) + 1 };
}

function fmtWait(ms){
  if(ms < 3600000) return Math.max(1, Math.round(ms / 60000)) + ' min';
  if(ms < DAY) return Math.round(ms / 3600000) + ' ghante';
  return Math.round(ms / DAY) + ' din';
}

function renderDrill(){
  if(!session) session = buildSession();
  const t = topicById(current);
  let h = '<div class="drill">';
  h += '<div class="drill-bar"><div class="scope">' +
    '<button type="button" data-s="topic" aria-pressed="' + (scope === 'topic') + '"></button>' +
    '<button type="button" data-s="all" aria-pressed="' + (scope === 'all') + '">Saare topics</button>' +
    '</div><div class="pbar"><i style="width:' + (session.total ? session.done / session.total * 100 : 0) + '%"></i></div>' +
    '<span class="qct">' + session.done + ' / ' + session.total + '</span></div>';

  if(!session.queue.length){
    const c = counts(scope === 'all' ? null : current);
    const more = c.fresh > 0;
    h += '<div class="done-state"><h3>' + (session.total ? 'Session poora ho gaya' : 'Abhi kuch revise nahi karna') + '</h3><p>' +
      (more ? c.fresh + ' naye cards baaki hain. Chhote chhote session zyada yaad rehte hain.'
            : 'Saare cards baad ke liye schedule hain. Kal wapas aana.') + '</p>' +
      (more ? '<button class="primary" id="moreCards" type="button">' + Math.min(NEW_PER_SESSION, c.fresh) + ' aur seekho</button> ' : '') +
      '<button class="mini" id="backLearn" type="button">Lessons pe wapas</button></div>';
  } else {
    const item = session.queue[0];
    const st = progress.cards[item.id];
    const boxLabel = !st ? 'Naya card' : st.b === 0 ? 'Dobara seekh rahe' : 'Level ' + st.b + ' / ' + (IV.length - 1);
    const now = Date.now();
    const pv = g => fmtWait(schedule(item.id, g).due - now);
    h += '<div class="card"><div class="card-top"><span class="box-chip">' + boxLabel + '</span><span></span></div>' +
      '<p class="cq">' + item.card.q + '</p>' +
      (session.revealed
        ? '<div class="ca"><div class="blk"><span class="lab">Samjho</span>' + item.card.s + '</div>' +
          '<div class="blk en"><span class="lab">Interview me bolo</span>' + item.card.a + '</div></div>'
        : '<button class="reveal" id="reveal" type="button">Answer dekho</button>') +
      '</div>';
    if(session.revealed){
      h += '<div class="grades">' +
        '<button class="gr" type="button" data-g="again"><span class="gl">Bhool gaya</span><span class="gi">' + pv('again') + '</span></button>' +
        '<button class="gr" type="button" data-g="hard"><span class="gl">Mushkil</span><span class="gi">' + pv('hard') + '</span></button>' +
        '<button class="gr" type="button" data-g="good"><span class="gl">Aa gaya</span><span class="gi">' + pv('good') + '</span></button>' +
        '<button class="gr" type="button" data-g="easy"><span class="gl">Bahut easy</span><span class="gi">' + pv('easy') + '</span></button>' +
        '</div><p class="hint"><strong>Aa gaya</strong> tabhi dabao jab bina dekhe bol sako. Keys <span class="kbd">1</span>–<span class="kbd">4</span></p>';
    } else {
      h += '<p class="hint">Pehle zor se bolke answer do, phir dekho. <span class="kbd">Space</span> dabao</p>';
    }
  }
  h += '<p class="save-note">' + (store ? 'Progress apne aap save hota hai' : 'Progress is browser me save hota hai') + '</p></div>';
  mainEl.innerHTML = h;

  mainEl.querySelector('.scope [data-s="topic"]').textContent = t.name;
  const tag = mainEl.querySelector('.card-top span:last-child');
  if(tag && session.queue[0]) tag.textContent = session.queue[0].topic.name;

  mainEl.querySelectorAll('.scope button').forEach(b => b.addEventListener('click', () => { scope = b.dataset.s; session = null; renderDrill(); }));
  const rv = document.getElementById('reveal');
  if(rv){ rv.addEventListener('click', reveal); rv.focus({ preventScroll:true }); }
  mainEl.querySelectorAll('.gr').forEach(b => b.addEventListener('click', () => grade(b.dataset.g)));
  const more = document.getElementById('moreCards');
  if(more) more.addEventListener('click', () => { session = null; renderDrill(); });
  const back = document.getElementById('backLearn');
  if(back) back.addEventListener('click', () => setMode('learn'));
}

function reveal(){
  if(!session || !session.queue.length || session.revealed) return;
  session.revealed = true;
  renderDrill();
}

function grade(g){
  if(!session || !session.queue.length || !session.revealed) return;
  const item = session.queue.shift();
  progress.cards[item.id] = schedule(item.id, g);
  if(g === 'again') session.queue.splice(Math.min(3, session.queue.length), 0, item);
  else session.done++;
  session.revealed = false;
  save();
  renderDrill();
  renderSide();
  renderDuePill();
}

document.addEventListener('keydown', e => {
  if(mode !== 'drill' || e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if((e.key === ' ' || e.key === 'Enter') && !onButton){ e.preventDefault(); reveal(); }
  else if(['1','2','3','4'].includes(e.key)){ grade(['again','hard','good','easy'][+e.key - 1]); }
});

function setMode(m){
  mode = m;
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m ? 'true' : 'false'));
  render();
  window.scrollTo({ top:0 });
}
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.m === 'drill') session = null;
  setMode(b.dataset.m);
}));

function render(){
  renderSide();
  renderDuePill();
  if(mode === 'learn') renderLearn(); else renderDrill();
}

try{ const raw = localStorage.getItem('labhi.progress'); if(raw) adopt(JSON.parse(raw)); }catch(e){}
render();

(async () => {
  try{
    const db = await null;
    if(!db) return;
    const ref = db.doc('progress/hinglish');
    const snap = await ref.get();
    store = ref;
    if(snap && snap.exists){
      adopt(snap.data());
      if(mode === 'drill') session = null;
    }
    render();
  }catch(e){}
})();
</script>
