<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hinglish interview prep: step-by-step lessons with diagrams and spaced-repetition flashcards.">
<style>
:root{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Interview Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F5F5F8; --surface:#FFFFFF; --sunk:#EEEEF3; --raise:#FFFFFF;
  --text:#16161D; --dim:#5A5A6B; --faint:#8A8A9C;
  --line:#DEDEE6; --line-soft:#EAEAF0;
  --accent:#5B3FE8; --accent-2:#7C63F0; --accent-soft:#EFEBFE; --on-accent:#FFFFFF;
  --crit:#C22A46; --crit-soft:#FCEBEE;
  --mod:#9C5A06; --mod-soft:#FBF1E0;
  --liab:#9E1D67; --liab-soft:#FBE9F3;
  --good:#15803D; --good-soft:#E6F5EB;
  --g-again:#C22A46; --g-hard:#9C5A06; --g-good:#15803D; --g-easy:#1D6FA8;
  --shadow:0 1px 2px rgba(22,22,29,.05), 0 8px 24px -14px rgba(22,22,29,.22);
  --dgrid:#D9D9E4; --dfill:#F0EEFC; --dfill2:#EDEDF3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131319; --surface:#1B1B24; --sunk:#15151C; --raise:#20202B;
    --text:#E9E9F2; --dim:#9E9EB2; --faint:#75758A;
    --line:#2C2C39; --line-soft:#24242F;
    --accent:#9B87FF; --accent-2:#B4A3FF; --accent-soft:#241F3D; --on-accent:#14101F;
    --crit:#F2718A; --crit-soft:#2E151C;
    --mod:#E9A94E; --mod-soft:#2A1F12;
    --liab:#EE7FBB; --liab-soft:#2C1523;
    --good:#57D98A; --good-soft:#11251A;
    --g-again:#F2718A; --g-hard:#E9A94E; --g-good:#57D98A; --g-easy:#6BB8EA;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.8);
    --dgrid:#33333F; --dfill:#241F3D; --dfill2:#22222D;
  }
}
:root[data-theme="dark"]{
  --bg:#131319; --surface:#1B1B24; --sunk:#15151C; --raise:#20202B;
  --text:#E9E9F2; --dim:#9E9EB2; --faint:#75758A;
  --line:#2C2C39; --line-soft:#24242F;
  --accent:#9B87FF; --accent-2:#B4A3FF; --accent-soft:#241F3D; --on-accent:#14101F;
  --crit:#F2718A; --crit-soft:#2E151C;
  --mod:#E9A94E; --mod-soft:#2A1F12;
  --liab:#EE7FBB; --liab-soft:#2C1523;
  --good:#57D98A; --good-soft:#11251A;
  --g-again:#F2718A; --g-hard:#E9A94E; --g-good:#57D98A; --g-easy:#6BB8EA;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.8);
  --dgrid:#33333F; --dfill:#241F3D; --dfill2:#22222D;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ================= shell ================= */
.top{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:0 18px;
}
.top-in{
  max-width:1240px; margin:0 auto;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  min-height:58px; padding-block:9px;
}
.brand{
  font-weight:800; font-size:17px; letter-spacing:-.02em;
  display:flex; align-items:center; gap:9px; margin-right:auto;
}
.brand .mk{
  width:24px; height:24px; border-radius:6px; flex:none;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;
}
.modes{display:flex; gap:3px; background:var(--sunk); padding:3px; border-radius:9px}
.mode{
  border:0; background:transparent; color:var(--dim); cursor:pointer;
  font-size:13px; font-weight:600; padding:6px 14px; border-radius:7px; transition:.15s;
}
.mode:hover{color:var(--text)}
.mode[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.due-pill{
  font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600;
  padding:4px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent);
  white-space:nowrap;
}
.due-pill.zero{background:var(--sunk); color:var(--faint)}

.layout{max-width:1240px; margin:0 auto; display:flex; gap:0; align-items:flex-start}

/* ================= sidebar ================= */
.side{
  width:246px; flex:none; position:sticky; top:58px;
  max-height:calc(100vh - 58px); overflow-y:auto;
  padding:22px 12px 40px 18px;
}
.side-h{
  font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); padding:0 10px; margin:0 0 9px;
}
.side-h + .side-h{margin-top:22px}
.nav{display:flex; flex-direction:column; gap:1px; list-style:none; margin:0; padding:0}
.nav button{
  width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
  color:var(--dim); font-size:13.5px; font-weight:500; padding:8px 10px; border-radius:7px;
  display:flex; align-items:center; gap:8px; transition:.13s; line-height:1.35;
}
.nav button:hover{background:var(--sunk); color:var(--text)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav .tick{
  width:5px; height:5px; border-radius:99px; flex:none; background:var(--line);
}
.nav button[data-done="1"] .tick{background:var(--good)}
.nav .nm{flex:1; min-width:0}
.nav .ct{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}

/* ================= main ================= */
.main{flex:1; min-width:0; padding:26px 18px 90px}

.lede-wrap{margin-bottom:26px}
.crumb{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin:0 0 10px;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
}
.tier{padding:3px 8px; border-radius:4px; font-weight:600; letter-spacing:.08em}
.tier.crit{background:var(--crit-soft); color:var(--crit)}
.tier.mod{background:var(--mod-soft); color:var(--mod)}
.tier.liab{background:var(--liab-soft); color:var(--liab)}
h1.topic{
  font-size:clamp(27px,5vw,38px); font-weight:800; letter-spacing:-.028em;
  line-height:1.08; margin:0 0 12px; text-wrap:balance;
}
.why{
  font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; line-height:1.6;
  color:var(--dim); margin:0; max-width:66ch;
  padding-left:14px; border-left:2px solid var(--accent);
}

/* -------- reading content -------- */
.sec{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);
}
.sec > h2{
  font-size:19px; font-weight:700; letter-spacing:-.018em; margin:0 0 14px;
  display:flex; align-items:baseline; gap:10px;
}
.sec > h2 .ix{
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;
  color:var(--accent); flex:none;
}
.prose{font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.68; max-width:68ch}
.prose p{margin:0 0 13px}
.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 13px; padding-left:22px}
.prose li{margin-bottom:6px}
.prose strong{font-weight:600; color:var(--text)}
.prose em{font-style:italic}
.prose code{
  font-family:"JetBrains Mono",monospace; font-size:13.5px;
  background:var(--sunk); padding:1.5px 5px; border-radius:4px;
}
.prose a{color:var(--accent)}

pre{
  font-family:"JetBrains Mono",monospace; font-size:13px; line-height:1.6;
  background:var(--sunk); border:1px solid var(--line-soft); border-radius:9px;
  padding:14px 16px; overflow-x:auto; margin:0 0 14px;
}
pre .cm{color:var(--faint); font-style:italic}
pre .kw{color:var(--accent)}
pre .st{color:var(--good)}

.key{
  font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.6;
  background:var(--accent-soft); border-left:3px solid var(--accent);
  padding:13px 16px; border-radius:0 8px 8px 0; margin:0 0 14px; color:var(--text);
}
.key b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent); margin-bottom:4px; font-weight:700;
}
.trap{
  font-family:"Source Serif 4",Georgia,serif; font-size:15.5px; line-height:1.6;
  background:var(--mod-soft); border-left:3px solid var(--mod);
  padding:13px 16px; border-radius:0 8px 8px 0; margin:0 0 14px;
}
.trap b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--mod); margin-bottom:4px; font-weight:700;
}
.say{
  border:1px solid var(--good); background:var(--good-soft);
  border-radius:9px; padding:14px 16px; margin:0 0 14px;
  font-family:"Source Serif 4",Georgia,serif; font-size:15.5px; line-height:1.62;
}
.say b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--good); margin-bottom:5px; font-weight:700;
}

.tbl-wrap{overflow-x:auto; margin:0 0 14px; border:1px solid var(--line); border-radius:9px}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:440px}
th,td{padding:9px 13px; text-align:left; border-bottom:1px solid var(--line-soft)}
th{
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);
  font-weight:600; background:var(--sunk);
}
tr:last-child td{border-bottom:0}
td code{font-family:"JetBrains Mono",monospace; font-size:12.5px}

/* -------- diagram -------- */
figure{margin:0 0 16px}
.dg{
  background:var(--sunk); border:1px solid var(--line); border-radius:11px;
  padding:18px 14px; overflow-x:auto;
}
.dg svg{display:block; margin:0 auto; max-width:100%; height:auto}
figcaption{
  font-size:12.5px; color:var(--faint); margin-top:9px; text-align:center;
  font-family:"Bricolage Grotesque",sans-serif;
}
.d-lbl{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:500}
.d-ttl{font-family:"Bricolage Grotesque",sans-serif; font-size:12px; font-weight:700; letter-spacing:.03em}
.d-sm{font-family:"JetBrains Mono",monospace; font-size:9.5px}

/* ================= drill ================= */
.drill{max-width:720px; margin:0 auto}
.drill-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin-bottom:20px; font-size:13px; color:var(--dim);
}
.drill-bar .qct{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
.pbar{flex:1 1 120px; height:5px; border-radius:3px; background:var(--sunk); overflow:hidden; min-width:90px}
.pbar i{display:block; height:100%; background:var(--accent); transition:width .3s}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:30px 28px; min-height:290px;
  display:flex; flex-direction:column;
}
.card-top{
  display:flex; align-items:center; gap:9px; margin-bottom:18px;
  font-family:"JetBrains Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
}
.box-chip{padding:3px 8px; border-radius:4px; background:var(--sunk); color:var(--dim); font-weight:600}
.cq{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:21px; line-height:1.42; font-weight:400; margin:0 0 20px;
}
.cq code{font-family:"JetBrains Mono",monospace; font-size:17px; background:var(--sunk); padding:2px 6px; border-radius:4px}
.ca{
  font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.65;
  border-top:1px solid var(--line); padding-top:18px; margin-top:auto; color:var(--dim);
}
.ca.hide{display:none}
.ca strong{color:var(--text); font-weight:600}
.ca code{font-family:"JetBrains Mono",monospace; font-size:13.5px; background:var(--sunk); padding:1.5px 5px; border-radius:4px}
.ca ul{margin:9px 0 0; padding-left:20px}
.ca li{margin-bottom:5px}

.reveal{
  margin-top:auto; align-self:flex-start;
  background:var(--accent); color:var(--on-accent); border:0; cursor:pointer;
  font-size:14px; font-weight:600; padding:11px 24px; border-radius:9px; transition:.15s;
}
.reveal:hover{background:var(--accent-2)}
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px}
.grades.hide{display:none}
.gr{
  border:1px solid var(--line); background:var(--surface); cursor:pointer;
  padding:11px 6px; border-radius:9px; transition:.14s;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.gr:hover{border-color:currentColor; background:var(--sunk)}
.gr .gl{font-size:13.5px; font-weight:700}
.gr .gi{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--faint)}
.gr[data-g="again"] .gl{color:var(--g-again)}
.gr[data-g="hard"] .gl{color:var(--g-hard)}
.gr[data-g="good"] .gl{color:var(--g-good)}
.gr[data-g="easy"] .gl{color:var(--g-easy)}

.done-state{
  text-align:center; padding:56px 24px; background:var(--surface);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
}
.done-state h3{font-size:22px; font-weight:700; margin:0 0 9px; letter-spacing:-.02em}
.done-state p{color:var(--dim); margin:0 auto 18px; max-width:44ch; font-size:14.5px}
.done-state .big{font-size:40px; margin-bottom:14px}

.mini{
  border:1px solid var(--line); background:var(--surface); color:var(--dim);
  cursor:pointer; font-size:13px; font-weight:600; padding:9px 18px; border-radius:8px;
}
.mini:hover{color:var(--text); border-color:var(--dim)}

.kbd{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
  padding:1px 5px; background:var(--surface);
}
.hint{margin-top:16px; text-align:center; font-size:12px; color:var(--faint)}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:880px){
  .layout{flex-direction:column}
  .side{
    position:static; width:100%; max-height:none; padding:14px 18px 0;
    display:flex; gap:18px; overflow-x:auto;
  }
  .side-block{flex:none; min-width:200px}
  .side-h+.side-h{margin-top:0}
  .main{padding-top:18px}
}
@media (max-width:520px){
  .grades{grid-template-columns:repeat(2,1fr)}
  .sec{padding:18px 16px}
  .card{padding:22px 18px}
  .cq{font-size:18.5px}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mk">&gt;_</span> Interview Lab</div>
    <span class="due-pill" id="duePill">—</span>
    <div class="modes">
      <button class="mode" data-m="learn" aria-pressed="true">Learn</button>
      <button class="mode" data-m="drill" aria-pressed="false">Drill</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================
   DIAGRAMS — all inline SVG, theme-aware via CSS variables
   ========================================================= */
const C = {
  ink:'var(--text)', dim:'var(--dim)', faint:'var(--faint)',
  line:'var(--dgrid)', fill:'var(--dfill)', fill2:'var(--dfill2)',
  acc:'var(--accent)', good:'var(--good)', crit:'var(--crit)', mod:'var(--mod)',
  surf:'var(--surface)'
};

function svg(w, h, inner){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img">' +
    '<defs>' +
      '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.dim + '"/></marker>' +
      '<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.acc + '"/></marker>' +
      '<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.crit + '"/></marker>' +
    '</defs>' + inner + '</svg>';
}
function box(x,y,w,h,label,opt){
  opt = opt || {};
  const f = opt.fill || C.surf, s = opt.stroke || C.line, r = opt.r === undefined ? 6 : opt.r;
  const tc = opt.tc || C.ink, dash = opt.dash ? ' stroke-dasharray="4 3"' : '';
  let o = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r +
    '" fill="' + f + '" stroke="' + s + '" stroke-width="1.2"' + dash + '/>';
  if(label){
    const lines = Array.isArray(label) ? label : [label];
    const cls = opt.cls || 'd-lbl';
    const lh = opt.lh || 13;
    const start = y + h/2 - (lines.length-1)*lh/2 + 4;
    lines.forEach((ln,i) => {
      o += '<text x="' + (x+w/2) + '" y="' + (start + i*lh) + '" text-anchor="middle" fill="' +
        tc + '" class="' + cls + '">' + ln + '</text>';
    });
  }
  return o;
}
function txt(x,y,s,opt){
  opt = opt || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (opt.anchor||'start') +
    '" fill="' + (opt.c||C.dim) + '" class="' + (opt.cls||'d-lbl') + '">' + s + '</text>';
}
function line(x1,y1,x2,y2,opt){
  opt = opt || {};
  return '<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" stroke="' + (opt.c||C.line) +
    '" stroke-width="' + (opt.w||1.3) + '"' + (opt.dash?' stroke-dasharray="4 3"':'') +
    (opt.m?' marker-end="url(#' + opt.m + ')"':'') + ' fill="none"/>';
}
function path(d,opt){
  opt = opt || {};
  return '<path d="' + d + '" stroke="' + (opt.c||C.line) + '" stroke-width="' + (opt.w||1.3) +
    '" fill="' + (opt.f||'none') + '"' + (opt.dash?' stroke-dasharray="4 3"':'') +
    (opt.m?' marker-end="url(#' + opt.m + ')"':'') + '/>';
}

const DIAGRAMS = {};

/* ---- JS event loop ---- */
DIAGRAMS.eventloop = () => {
  let s = '';
  s += txt(70,18,'CALL STACK',{cls:'d-ttl',c:C.ink,anchor:'middle'});
  s += box(10,28,120,150,null,{fill:C.fill2});
  s += box(18,140,104,30,'console.log',{fill:C.surf});
  s += box(18,106,104,30,'main()',{fill:C.surf});
  s += txt(70,70,'runs one',{anchor:'middle',c:C.faint,cls:'d-sm'});
  s += txt(70,84,'frame at a time',{anchor:'middle',c:C.faint,cls:'d-sm'});

  s += txt(300,18,'WEB / NODE APIs',{cls:'d-ttl',c:C.ink,anchor:'middle'});
  s += box(200,28,200,60,['timers · fetch · fs · events'],{fill:C.fill2,tc:C.dim});
  s += txt(300,76,'run OFF the JS thread',{anchor:'middle',c:C.faint,cls:'d-sm'});
  s += line(132,70,198,58,{m:'ar',c:C.dim});
  s += txt(165,50,'offload',{anchor:'middle',c:C.faint,cls:'d-sm'});

  s += box(200,108,200,34,'MICROTASK QUEUE',{fill:C.fill,stroke:C.acc,tc:C.acc,cls:'d-ttl'});
  s += txt(300,158,'.then · await · queueMicrotask',{anchor:'middle',c:C.dim,cls:'d-sm'});
  s += box(200,172,200,34,'MACROTASK QUEUE',{fill:C.fill2,tc:C.dim,cls:'d-ttl'});
  s += txt(300,222,'setTimeout · I/O · UI events',{anchor:'middle',c:C.dim,cls:'d-sm'});

<script>const TOPICS = [];</script>

<script>
TOPICS.push({
id:'cpp', name:'C++', tier:'crit',
intro:`MiniLang (3000+ lines) aur 500 CP problems ki wajah se interviewer maan ke chalega ki tumhe C++ achhe se aati hai. Lekin dhyan do: LeetCode wali C++ aur interview wali C++ alag hai. CP me tum sirf vector, map, sort use karte ho. Interview me poochte hain: memory kaun sambhalta hai, aur wo kab free hoti hai? Hum bilkul basic se shuru karenge.`,
lessons:[
{
h:`Memory ke 2 hisse: Stack aur Heap`,
words:[
[`RAM`,`Computer ki temporary memory. Program chalte waqt apna data yahin rakhta hai.`],
[`Variable`,`Data rakhne ka ek dabba. Jaise <code>int x = 5;</code>`],
[`Function`,`Code ka ek tukda jisko naam se call karte ho. Jaise <code>main()</code>.`],
[`Pointer`,`Ek variable jo kisi doosre data ka <strong>address</strong> (pata) rakhta hai, data nahi.`]
],
steps:[
{t:`Memory kya hai?`, b:`<p>Program chalte waqt apna data RAM me rakhta hai. RAM ko ek <strong>bada almirah</strong> samjho.</p><p>C++ is almirah ko do hisson me baantti hai: <strong>Stack</strong> aur <strong>Heap</strong>.</p>`},
{t:`Stack: chhota, fast, apne aap saaf`, b:`<ul><li>Normal variables stack pe bante hain.</li><li>Function khatam hote hi C++ unhe <strong>khud</strong> hata deta hai.</li><li>Tumhe kuch nahi karna padta.</li></ul>`, code:`
void f() {
    int x = 5;      // x stack pe bana
}                   // f() khatam -> x apne aap hat gaya`},
{t:`Heap: bada, lekin saaf tumhe karna hai`, b:`<ul><li>Heap se memory <code>new</code> likh ke maangte ho.</li><li>C++ isko khud saaf <strong>nahi</strong> karta.</li><li>Tumhe <code>delete</code> likh ke wapas karna padta hai.</li></ul>`, code:`
void g() {
    int* p = new int(5);   // heap pe memory li
    // ... kaam ...
    delete p;              // khud wapas karni padegi
}`, after:`<p>Dhyan do: <code>p</code> khud stack pe hai (wo sirf address rakhta hai). Lekin jis <code>5</code> ki taraf wo point karta hai, wo heap pe hai.</p>`},
{t:`Galti 1: Memory leak`, b:`<p><code>delete</code> likhna bhool gaye, to wo memory <strong>kabhi wapas nahi milti</strong>. Isko <strong>memory leak</strong> kehte hain.</p><p>Chhota program ho to farak nahi padta. Lekin server din-raat chalta hai, to RAM dheere dheere bharti jaati hai aur ek din program crash ho jaata hai.</p>`},
{t:`Galti 2: Dangling pointer aur double free`, b:`<ul><li><strong>Dangling pointer:</strong> memory delete kar di, phir bhi usko use kar rahe ho.</li><li><strong>Double free:</strong> ek hi memory ko 2 baar delete kiya.</li></ul><p>Dono se crash ya ajeeb behaviour hota hai.</p>`, code:`
int* p = new int(5);
delete p;
cout << *p;   // GALTI: memory wapas de di, phir bhi padh rahe ho (dangling)
delete p;     // GALTI: dobara delete (double free)`}
],
say:`Stack memory is automatic — it is freed when the function returns. Heap memory is allocated with new and must be freed with delete. Forgetting delete causes a memory leak. Deleting twice, or using memory after delete, causes a crash or undefined behaviour.`,
hook:`Stack = apne aap saaf. Heap = new kiya to delete khud karo.`,
check:[
[`Function ke andar <code>int x = 5;</code> stack pe hai ya heap pe?`,`Stack pe. Function khatam hote hi apne aap hat jaayega.`],
[`Memory leak kab hota hai?`,`Jab <code>new</code> se memory li aur <code>delete</code> karna bhool gaye.`]
]
},
{
h:`Problem: delete likhna bhool jaana bahut aasaan hai`,
words:[
[`Exception`,`Code me error aaya aur program normal raasta chhod ke seedha bahar bhaag gaya (<code>throw</code>). Beech ki lines skip ho jaati hain.`],
[`Early return`,`Function ke beech me hi <code>return</code> karke nikal jaana.`]
],
steps:[
{t:`Ye normal dikhne wala function dekho`, code:`
void process() {
    Node* n = new Node();

    if (!validate(n)) return;   // yahan se nikle -> delete kabhi nahi chala
    doWork(n);                  // yahan exception aaya -> delete nahi chala

    delete n;
}`, after:`<p>Sirf 7 lines me <strong>2 memory leak</strong> hain!</p>`},
{t:`Dono leak ki wajah ek hi hai`, b:`<p>Function beech se nikal gaya aur last wali <code>delete</code> line tak <strong>pahuncha hi nahi</strong>.</p><p>Ab socho function 60 lines ka hai aur 5 jagah se return hota hai. Har jagah delete yaad rakhna practically impossible hai.</p>`},
{t:`Java aur Python me "finally" hota hai`, b:`<p>Java me <code>finally { }</code> block likhte hain jo <strong>har haal me</strong> chalta hai, error aaye ya na aaye.</p><p><strong>C++ me finally hai hi nahi.</strong></p><p>To C++ me cleanup ki guarantee kaise milegi? Iska jawab agla lesson hai: <strong>RAII</strong>.</p>`}
],
say:`Manual delete is unreliable because a function can exit early through a return or an exception, and the delete line is skipped. C++ has no finally block, so it needs a different way to guarantee cleanup — that is RAII.`,
hook:`Early return ya exception = delete skip = leak.`,
check:[[`C++ me finally block hota hai?`,`Nahi. Isliye C++ RAII use karta hai.`]]
},
{
h:`RAII: C++ ka sabse important idea`,
words:[
[`RAII`,`Resource Acquisition Is Initialization. Naam mushkil hai, idea simple hai.`],
[`Resource`,`Koi bhi cheez jo leni aur wapas deni padti hai: memory, file, lock, network connection.`],
[`Constructor`,`Function jo object <strong>bante hi</strong> apne aap chalta hai.`],
[`Destructor`,`Function jo object <strong>khatam hote hi</strong> apne aap chalta hai. Naam ke aage <code>~</code> lagta hai.`],
[`Scope`,`<code>{ }</code> brackets ka area. Variable isi ke andar zinda rehta hai.`]
],
steps:[
{t:`Ek golden rule yaad karo`, b:`<p>Stack pe bane object ka <strong>destructor hamesha chalta hai</strong> jab uska scope khatam ho. Chahe:</p><ul><li>normal end ho,</li><li><code>return</code> ho,</li><li>ya exception aaye.</li></ul><p>C++ iski <strong>guarantee</strong> deta hai. Isko <strong>stack unwinding</strong> kehte hain.</p>`},
{t:`Is rule ka fayda uthao`, b:`<p>Resource ko ek stack object ke andar band kar do:</p><ul><li><strong>Constructor me lo</strong> (file kholo / memory lo)</li><li><strong>Destructor me wapas do</strong> (file band karo / memory free karo)</li></ul><p>Ab cleanup bhoolna possible hi nahi, kyunki destructor khud chalega.</p>`},
{t:`Example: file handle`, code:`
class FileHandle {
    FILE* f;
public:
    FileHandle(const char* path) {    // constructor: file kholo
        f = fopen(path, "r");
    }
    ~FileHandle() {                   // destructor: file band karo
        if (f) fclose(f);
    }
};`},
{t:`Ab isko use karke dekho`, code:`
void process(const char* path) {
    FileHandle fh(path);       // file khuli

    if (!ok(fh)) return;       // return    -> destructor chala -> file band
    doWork(fh);                // exception -> destructor chala -> file band
}                              // normal end -> destructor chala -> file band`, d:`raii`, after:`<p>Teeno raston me file band ho gayi. Humne ek bhi baar <code>fclose</code> yaad nahi rakha.</p>`},
{t:`Real life example`, b:`<p>Ek <strong>magic bag</strong> socho. Library ki kitaab bag me daalo. Kamre se <strong>kisi bhi darwaaze</strong> se niklo, bag khud kitaab library ko wapas kar deta hai.</p><ul><li>Bag = stack object</li><li>Kamre se nikalna = scope khatam</li><li>Kitaab wapas karna = destructor</li></ul>`},
{t:`Tum RAII pehle se use kar rahe ho`, b:`<p><code>vector</code>, <code>string</code>, <code>unique_ptr</code>, <code>lock_guard</code>, <code>fstream</code>: ye sab RAII hain.</p><p>Isliye tumhe vector ko kabhi <code>delete</code> nahi karna padta. Uska destructor apni heap memory khud free karta hai.</p>`}
],
say:`RAII ties a resource's lifetime to an object's lifetime: acquire it in the constructor and release it in the destructor. C++ guarantees destructors run when a scope exits, including during an exception, so cleanup always happens. That is why C++ does not need a finally block. vector, string, unique_ptr and lock_guard are all RAII types.`,
hook:`Constructor me lo, destructor me do. Destructor hamesha chalega.`,
check:[
[`Exception aane par stack objects ke destructor chalte hain?`,`Haan. Isko stack unwinding kehte hain, aur isi wajah se RAII kaam karta hai.`],
[`vector ko delete kyun nahi karna padta?`,`Kyunki vector RAII hai. Uska destructor apni memory khud free karta hai.`]
]
},
{
h:`Rule of 3, 5 aur 0: copy karne ki problem`,
words:[
[`Copy constructor`,`Function jo ek object se uski copy banata hai. Jaise <code>A b = a;</code>`],
[`Shallow copy`,`Sirf pointer (address) copy hua, data nahi. Dono objects same data ko point karte hain.`],
[`Deep copy`,`Data ki bhi nayi copy bani. Dono ke paas apna alag data hai.`]
],
steps:[
{t:`Problem dekho`, code:`
FileHandle a("data.txt");
FileHandle b = a;     // copy`, after:`<p>Humne copy constructor nahi likha, to C++ <strong>khud ek bana deta hai</strong>. Wo har member ko copy karta hai. <code>f</code> ek pointer hai, to sirf <strong>address copy</strong> hua. Ye shallow copy hai.</p>`},
{t:`Kya galat hua?`, b:`<ol><li><code>a.f</code> aur <code>b.f</code> dono <strong>same file</strong> ko point karte hain.</li><li>Scope khatam: <code>b</code> ka destructor file band karta hai.</li><li>Phir <code>a</code> ka destructor <strong>wahi file dobara</strong> band karta hai.</li><li>Double free: crash.</li></ol>`},
{t:`Rule of 3`, b:`<p>Agar tumne in teeno me se <strong>ek bhi</strong> likha:</p><ul><li>destructor</li><li>copy constructor</li><li>copy assignment (<code>b = a;</code>)</li></ul><p>to baaki do bhi likhne padenge.</p><p><strong>Kyun?</strong> Destructor likha matlab class kuch manage kar rahi hai. Aisi class me C++ ki default (shallow) copy galat hi hogi.</p>`},
{t:`Rule of 5`, b:`<p>C++11 me 2 functions aur aaye: <strong>move constructor</strong> aur <strong>move assignment</strong>. (Agle lesson me samjhenge.) To 3 + 2 = <strong>5</strong>.</p>`},
{t:`Rule of 0: sabse best`, b:`<p>Khud resource manage hi mat karo. Class ke members aise rakho jo <strong>khud apna dhyan rakhte hain</strong>: <code>string</code>, <code>vector</code>, <code>unique_ptr</code>.</p><p>Tab tumhe <strong>ek bhi</strong> special function nahi likhna padega, aur copy, move, delete sab sahi chalega.</p>`, code:`
class User {
    std::string name;          // khud copy/free hota hai
    std::vector<int> scores;   // khud copy/free hota hai
};                             // koi destructor nahi = Rule of 0`}
],
say:`If a class needs a custom destructor, the default shallow copy is almost certainly wrong, so it also needs a copy constructor and copy assignment — the Rule of 3. C++11 adds the move constructor and move assignment, making it the Rule of 5. The best approach is the Rule of 0: use members like string, vector and unique_ptr that manage themselves, and write none of these functions.`,
hook:`Destructor likha? Copy bhi sambhalo. Best: kuch mat likho (Rule of 0).`,
check:[[`Shallow copy me kya problem hai?`,`Dono objects same memory ko point karte hain, to dono destructor use free karenge: double free.`]]
},
{
h:`Move semantics aur std::move ka trap`,
words:[
[`Copy`,`Poora data duplicate karna. Data bada ho to slow.`],
[`Move`,`Data copy nahi karna, bas uski <strong>ownership</strong> de dena. Bahut fast.`],
[`lvalue`,`Jiska naam hai aur jo baad me bhi rahega. Jaise <code>x</code>.`],
[`rvalue`,`Temporary value jo turant khatam ho jaayegi. Jaise <code>5</code> ya <code>x + 1</code>.`]
],
steps:[
{t:`Problem: copy slow hai`, b:`<p>Ek vector me <strong>10 lakh</strong> elements hain. Copy karoge to 10 lakh elements copy honge.</p><p>Lekin agar purana vector <strong>waise bhi khatam hone wala hai</strong>, to itni mehnat bekaar hai.</p>`},
{t:`Idea: move`, b:`<p>Ghar shift karna socho:</p><ul><li><strong>Copy</strong> = bilkul same doosra ghar banana. Slow.</li><li><strong>Move</strong> = bas <strong>chaabi</strong> de dena. Instant.</li></ul><p>Vector ke andar ek pointer hota hai jo data ki taraf ishara karta hai. Move me bas wo pointer de diya jaata hai, aur purana vector khaali ho jaata hai.</p>`},
{t:`Code me dekho`, code:`
std::vector<int> a(1000000);
std::vector<int> b = a;              // COPY: 10 lakh elements copy hue
std::vector<int> c = std::move(a);   // MOVE: sirf pointer diya, a ab khaali`},
{t:`Trap: std::move kuch move nahi karta!`, b:`<p>Ye C++ ka <strong>sabse famous interview trap</strong> hai.</p><ul><li><code>std::move</code> khud <strong>kuch nahi karta</strong>. Iski <strong>zero machine instructions</strong> banti hain.</li><li>Ye bas ek label lagata hai (technical naam: <strong>cast</strong>): "is object ko rvalue samjho".</li><li>Us label ki wajah se C++ copy constructor ki jagah <strong>move constructor</strong> chunta hai.</li><li>Asli kaam (pointer lena) <strong>move constructor</strong> karta hai.</li></ul>`},
{t:`Real life example`, b:`<p><code>std::move</code> ek <strong>permission slip</strong> hai: "tum mera saamaan le ja sakte ho". Slip khud saamaan nahi uthati. Move constructor aake saamaan uthata hai.</p>`},
{t:`Move ke baad purana object`, b:`<p>Wo <strong>"valid but unspecified"</strong> state me hota hai. Matlab:</p><ul><li>Usko destroy kar sakte ho. OK.</li><li>Usko nayi value de sakte ho. OK.</li><li>Uski value <strong>padhna mat</strong>. Wo kya hai, pakka nahi.</li></ul>`}
],
say:`std::move does not move anything. It is only a cast to an rvalue reference and generates no code. It changes which overload is chosen, so the move constructor is called instead of the copy constructor, and the move constructor does the real work of taking the resources. After a move, the source is valid but unspecified: you can destroy it or assign to it, but you should not read it.`,
hook:`std::move = permission slip. Asli kaam move constructor karta hai.`,
check:[
[`std::move kitni machine instructions banata hai?`,`Zero. Ye sirf ek cast hai.`],
[`Move ke baad purane object ko padh sakte ho?`,`Nahi. Wo valid but unspecified hai. Sirf destroy ya reassign karo.`]
]
},
{
h:`Smart pointers: unique_ptr, shared_ptr, weak_ptr`,
words:[
[`Smart pointer`,`Aisa pointer jo RAII use karta hai aur memory khud free karta hai.`],
[`Ownership`,`Is memory ka zimmedar kaun hai? Kaun free karega?`],
[`Reference count`,`Ginti ki kitne log is object ko use kar rahe hain.`],
[`Atomic`,`Aisa operation jo multiple threads ke beech safe hai, lekin thoda slow.`]
],
steps:[
{t:`unique_ptr: sirf ek maalik`, code:`
{
    auto p = std::make_unique<Node>();
    // p use karo
}   // scope khatam -> Node apne aap delete`, after:`<ul><li>Sirf <strong>ek owner</strong>.</li><li>Raw pointer jitna hi fast. <strong>Zero extra cost.</strong></li><li><strong>Copy nahi</strong> kar sakte, sirf <strong>move</strong> kar sakte ho.</li></ul>`},
{t:`unique_ptr copy kyun nahi hota?`, b:`<p>Copy hota to <strong>2 maalik</strong> ho jaate. Dono delete karte: double free. Isliye C++ copy band kar deta hai. Kisi ko dena hai to <code>std::move</code> se do.</p>`, code:`
auto a = std::make_unique<Node>();
auto b = a;              // ERROR: copy allowed nahi
auto c = std::move(a);   // OK: ownership c ko mili, a ab null`},
{t:`shared_ptr: kai maalik`, b:`<p><strong>Roommates</strong> ka flat socho. Darwaaze pe ek <strong>counter</strong> hai: kitne log rehte hain.</p><ul><li>Naya roommate aaya: counter +1</li><li>Koi chala gaya: counter −1</li><li>Counter <strong>0</strong>: flat saaf (object delete)</li></ul>`, d:`smartptr`},
{t:`shared_ptr ki keemat (interview me poochte hain)`, b:`<ol><li>Counter <strong>atomic</strong> tareeke se badhta/ghatta hai, taaki threads me safe rahe. Ye slow hai.</li><li>Counter rakhne ke liye ek extra <strong>control block</strong> banta hai (extra memory allocation). <code>make_shared</code> object aur control block ek hi allocation me bana deta hai.</li><li>Size raw pointer se <strong>double</strong> hota hai.</li></ol>`},
{t:`weak_ptr: cycle todne ke liye`, b:`<p>Agar A ke paas B ka shared_ptr hai aur B ke paas A ka, to dono ka counter <strong>kabhi 0 nahi hoga</strong>. Memory leak.</p><p><code>weak_ptr</code> object ko dekh sakta hai lekin <strong>counter nahi badhata</strong>. Jaise ek dost jo ghar ka pata jaanta hai, lekin wahan rehta nahi.</p>`},
{t:`Kab kya use karein?`, b:`<ul><li>Default: <strong>unique_ptr</strong></li><li>Sach me kai owners hon: <strong>shared_ptr</strong></li><li>Cycle ban raha ho: ek taraf <strong>weak_ptr</strong></li></ul>`}
],
say:`unique_ptr means single ownership. It has zero overhead compared to a raw pointer and is move-only, because copying would create two owners and a double free. shared_ptr allows shared ownership through a reference count. It costs an atomic increment and decrement on every copy, an extra control block, and twice the pointer size. I default to unique_ptr, use shared_ptr only when ownership is truly shared, and use weak_ptr to break cycles.`,
hook:`Default unique_ptr. shared_ptr ki keemat: atomic counter + control block + double size.`,
check:[[`Do shared_ptr ek doosre ko point karein to kya hoga?`,`Counter kabhi 0 nahi hoga, memory leak hogi. Ek taraf weak_ptr lagao.`]]
},
{
h:`Virtual functions, vtable aur virtual destructor`,
words:[
[`Inheritance`,`Ek class doosri class ke features le leti hai. <code>Dog : Animal</code>`],
[`Virtual function`,`Aisa function jiska kaunsa version chalega, ye <strong>runtime</strong> pe decide hota hai.`],
[`Polymorphism`,`Base class ke pointer se Derived class ka function chalana.`],
[`vtable`,`Har class ki ek table jisme uske virtual functions ke address hote hain.`]
],
steps:[
{t:`Example dekho`, code:`
struct Animal {
    virtual void speak() { cout << "..."; }
    virtual ~Animal() = default;
};
struct Dog : Animal {
    void speak() override { cout << "Bhau"; }
};

Animal* a = new Dog();
a->speak();    // "Bhau" -> Dog wala chala
delete a;`, after:`<p>Pointer ka type <code>Animal*</code> hai, lekin object asal me <code>Dog</code> hai. <code>virtual</code> ki wajah se <strong>Dog wala</strong> function chala.</p>`},
{t:`Andar kaise kaam karta hai?`, b:`<ul><li>Jis class me virtual function hai, uske <strong>har object me ek chhupa pointer</strong> hota hai: <strong>vptr</strong>.</li><li>vptr class ki <strong>vtable</strong> ko point karta hai.</li><li>vtable = functions ke address ki list.</li><li>Virtual call = vptr padho, table me dekho, us address pe jump karo.</li></ul>`, d:`vtable`, after:`<p>Real life: har object ke paas ek visiting card (vptr) hai jo uski class ki phone directory (vtable) ki taraf ishara karta hai.</p>`},
{t:`Virtual destructor kyun zaroori hai?`, b:`<p>Agar <code>~Animal()</code> virtual <strong>nahi</strong> hota, to <code>delete a</code> sirf <strong>Animal ka</strong> destructor chalata. Dog ka hissa kabhi saaf nahi hota.</p><p>Ye <strong>undefined behaviour</strong> hai, aur memory leak bhi.</p><p><strong>Rule:</strong> jis class ko inherit karke Base pointer se delete karoge, uska destructor <code>virtual</code> hona chahiye.</p>`},
{t:`Object slicing`, b:`<p><code>Animal x = Dog();</code> likha, to Dog ka sirf <strong>Animal wala hissa</strong> copy hua. Baaki hissa kat gaya (slice ho gaya).</p><p>Isliye polymorphism ke liye hamesha <strong>pointer ya reference</strong> use karo, value nahi.</p>`},
{t:`override hamesha likho`, b:`<p><code>override</code> likhne se, agar tumhara function Base ke function se match nahi karta (galat spelling ya galat type), to <strong>compiler error</strong> dega. Warna chupchap ek naya alag function ban jaata aur bug pakadna mushkil hota.</p>`}
],
say:`A class with virtual functions stores a hidden vptr in each object, pointing to the class's vtable, which is a table of function addresses. A virtual call loads the vptr, looks up the table and calls through it. If you delete a derived object through a base pointer, the base destructor must be virtual; otherwise only the base destructor runs, which is undefined behaviour and leaks the derived part.`,
hook:`Base pointer se delete karoge? Base ka destructor virtual karo.`,
check:[[`vptr kahan hota hai?`,`Har object ke andar, chhupa hua. Wo class ki vtable ko point karta hai.`]]
},
{
h:`Containers ki speed aur Undefined Behaviour`,
words:[
[`Big-O`,`Input badhne par time kitna badhta hai. O(1) = constant, O(log n) = bahut dheere badhta, O(n) = input jitna.`],
[`Amortized`,`Kabhi kabhi ek operation slow hota hai, lekin <strong>average fast</strong> rehta hai, aur ye guarantee hai.`],
[`Iterator`,`Container ke kisi element ki taraf pointer jaisi cheez.`]
],
steps:[
{t:`Kaunsa container kitna fast?`, b:`<div class="tbl-wrap"><table>
<tr><th>Container</th><th>Dhoondhna</th><th>Add karna</th><th>Sorted?</th><th>Andar kya hai</th></tr>
<tr><td><code>vector</code></td><td>index se O(1)</td><td>peeche O(1) amortized</td><td>nahi</td><td>lagataar array</td></tr>
<tr><td><code>map</code></td><td>O(log n)</td><td>O(log n)</td><td>haan</td><td>red-black tree</td></tr>
<tr><td><code>unordered_map</code></td><td>O(1) average, O(n) worst</td><td>O(1) average</td><td>nahi</td><td>hash table</td></tr>
<tr><td><code>list</code></td><td>O(n)</td><td>O(1) agar jagah pata ho</td><td>nahi</td><td>linked list</td></tr>
</table></div>`},
{t:`vector ka push_back O(1) kaise?`, b:`<ul><li>vector ke paas ek fixed size ki jagah (capacity) hoti hai.</li><li>Jagah bhar gayi: <strong>double size</strong> ki nayi jagah lo, sab elements wahan shift karo, purani jagah free karo.</li><li>Wo ek push slow (O(n)) hai, lekin ye <strong>kabhi kabhi</strong> hota hai.</li></ul><p><strong>Example:</strong> capacity 1, 2, 4, 8 hoti hai. 8 elements daalne me total shifting = 1 + 2 + 4 = 7, jo n se kam hai. Isliye average O(1).</p><p><code>reserve(n)</code> pehle se jagah le leta hai, to shifting hoti hi nahi.</p>`},
{t:`Bada trap: purana pointer bekaar ho jaata hai`, code:`
std::vector<int> v = {1, 2, 3};
int* p = &v[0];
v.push_back(4);   // jagah bhar gayi -> sab nayi jagah shift
cout << *p;       // GALTI: p purani (free) jagah ko point karta hai`, after:`<p>Reallocation ke baad <strong>saare pointers, references aur iterators</strong> invalid ho jaate hain.</p>`},
{t:`map ya unordered_map?`, b:`<ul><li>Sorted order chahiye: <code>map</code></li><li>Sirf naam se jaldi dhoondhna hai: <code>unordered_map</code></li></ul><p><strong>MiniLang ka symbol table</strong> (variable naam se uski info): <code>unordered_map</code> sahi hai, kyunki yahan sorted order ki zaroorat nahi.</p>`},
{t:`Undefined Behaviour (UB)`, b:`<p>UB matlab C++ standard kehta hai: <strong>"iska result kuch bhi ho sakta hai"</strong>. Common examples:</p><ul><li>Array ke bahar access (<code>v[v.size()]</code>)</li><li>Null ya delete ho chuke pointer ko padhna</li><li><strong>Signed</strong> int overflow (unsigned wrap hota hai, wo theek hai)</li><li>Bina value diye variable padhna</li><li>Virtual destructor ke bina Base pointer se delete</li></ul><p><strong>Khatarnak kyun:</strong> compiler maan leta hai ki UB kabhi nahi hoga, aur is assumption pe tumhara check bhi hata sakta hai.</p>`}
],
say:`vector gives O(1) indexing and amortized O(1) push_back. When it is full, it allocates a bigger buffer, usually double the size, and moves the elements, which invalidates every pointer, reference and iterator into it. map is a sorted red-black tree with O(log n) operations. unordered_map is a hash table with O(1) average and O(n) worst case. For a symbol table I would use unordered_map because I only need lookup by name.`,
hook:`push_back ke baad purane pointers pe bharosa mat karo.`,
check:[
[`<code>reserve()</code> kya karta hai?`,`Pehle se jagah le leta hai, taaki push_back ke time reallocation na ho.`],
[`Signed int overflow kya hai: normal ya UB?`,`UB. Unsigned overflow wrap hota hai aur allowed hai.`]
]
}
],
cards:[
{q:`What is the difference between stack and heap memory?`, s:`Stack: chhota, fast, function khatam hote hi apne aap saaf. Heap: bada, <code>new</code> se lete ho, <code>delete</code> khud karna padta hai. delete bhoole to leak.`, a:`Stack memory is automatic and freed when the function returns. Heap memory is allocated with new, lives until you delete it, and leaks if you forget.`},
{q:`What is RAII?`, s:`Resource ko object ke andar band karo: constructor me lo, destructor me wapas do. Destructor hamesha chalta hai, exception me bhi, isliye cleanup kabhi miss nahi hota.`, a:`RAII ties a resource's lifetime to an object: acquire in the constructor, release in the destructor. Destructors always run when a scope exits, even during an exception, so cleanup is guaranteed. That is why C++ needs no finally block.`},
{q:`What does std::move actually do?`, s:`Kuch move nahi karta. Sirf cast (label) hai, zero instructions. Us label ki wajah se move constructor chalta hai, jo asli kaam karta hai. Baad me purana object valid but unspecified hai.`, a:`std::move is only a cast to an rvalue reference and generates no code. It makes overload resolution pick the move constructor, which does the real work. The source is left valid but unspecified.`},
{q:`Why can't you copy a unique_ptr?`, s:`Copy se 2 maalik ban jaate aur dono delete karte: double free. Isliye sirf move allowed hai.`, a:`Copying would create two owners of the same memory and both would delete it, causing a double free. unique_ptr is move-only so ownership stays unique.`},
{q:`What does shared_ptr cost compared to unique_ptr?`, s:`3 cheezein: (1) atomic counter jo slow hai, (2) extra control block, (3) double size. Isliye default unique_ptr.`, a:`An atomic reference-count update on every copy and destruction, an extra control block allocation, and twice the pointer size. unique_ptr has zero overhead, so it is the default.`},
{q:`Why does a polymorphic base class need a virtual destructor?`, s:`Warna Base pointer se delete karne par sirf Base ka destructor chalega. Derived ka hissa saaf nahi hoga: UB aur leak.`, a:`Deleting a derived object through a base pointer with a non-virtual destructor only runs the base destructor. That is undefined behaviour and leaks the derived part. A virtual destructor makes the call dispatch to the derived destructor first.`},
{q:`Explain the Rule of 3, 5 and 0.`, s:`3: destructor likha to copy constructor aur copy assignment bhi likho. 5: plus move constructor aur move assignment. 0 (best): aise members use karo jo khud manage karein, kuch mat likho.`, a:`Rule of 3: if you write a destructor, you also need copy construction and copy assignment. Rule of 5 adds the two move operations. Rule of 0 is the goal: use self-managing members and write none of them.`},
{q:`Why is vector::push_back amortized O(1), and what can it break?`, s:`Bhar jaaye to double size ki jagah lekar sab shift karta hai. Ye kabhi kabhi hota hai, isliye average O(1). Lekin shift ke baad purane pointers aur iterators bekaar ho jaate hain.`, a:`When full, vector allocates a larger buffer, usually double, and moves the elements. That happens rarely enough that the average is O(1). Reallocation invalidates all pointers, references and iterators into the vector.`},
{q:`map vs unordered_map — which for a symbol table?`, s:`unordered_map, kyunki sirf naam se dhoondhna hai, sorted order nahi chahiye. O(1) average vs O(log n).`, a:`unordered_map, because lookup is by exact name and sorted order is not needed, so O(1) average beats O(log n). map is better when you need sorted iteration or a guaranteed O(log n) bound.`},
{q:`What is a vtable?`, s:`Har class ki functions ke address wali table. Har object me chhupa vptr us table ko point karta hai. Virtual call = vptr padho, table me dekho, call karo.`, a:`A per-class table of virtual function addresses. Each object holds a hidden vptr pointing to its class's vtable, and a virtual call looks up the function through it at runtime.`},
{q:`What is a dangling pointer?`, s:`Aisa pointer jo delete ho chuki memory ko point kar raha hai. Usko use karna UB hai.`, a:`A pointer that still refers to memory that has already been freed. Dereferencing it is undefined behaviour.`}
]
});

</table></div>`},
{t:`Space me recursion stack bhi ginta hai`, b:`<p>Recursive DFS me tum koi array nahi banate, phir bhi space <strong>O(1) nahi</strong> hai.</p><p>Har call ek stack frame banata hai. Tree seedhi line jaisa (skewed) ho to depth n hogi, yaani <strong>O(n) space</strong>. Interviewer yahi check karta hai ki tum bhool to nahi gaye.</p>`},
{t:`Worst vs average vs amortized`, b:`<ul><li><strong>Worst case:</strong> sabse bure input pe ek operation ka time.</li><li><strong>Average case:</strong> random input pe expected time (hash table O(1)). Ye luck pe depend karta hai.</li><li><strong>Amortized:</strong> operations ki poori series ka average, aur ye <strong>guarantee</strong> hai. Jaise vector push_back: ek push slow ho sakta hai, lekin n pushes total O(n).</li></ul><p>Real life: mobile ka monthly bill. Ek din zyada kharcha hua, lekin mahine ka average kam hi rehta hai.</p>`}
],
say:`Big-O describes how running time grows with input size. Space complexity includes the recursion stack, so a recursive DFS on a skewed tree uses O(n) space. Amortized cost is the average over a sequence of operations with a guarantee, unlike average case which depends on the input distribution. For example, vector push_back is amortized O(1).`,
hook:`Recursion stack bhi space hai. Amortized = guaranteed average.`,
check:[[`n = 10⁵ ho to O(n²) chalega?`,`Nahi. 10¹⁰ operations, bahut slow. O(n log n) chahiye.`]]
},
{
h:`Dijkstra negative edge pe fail kyun hota hai?`,
words:[
[`Graph`,`Nodes (jagah) aur edges (raaste) ka jaal.`],
[`Edge weight`,`Raaste ki length ya cost.`],
[`Greedy`,`Har step pe abhi jo sabse achha dikhe wahi choose karna, peeche mud ke nahi dekhna.`],
[`Priority queue`,`Aisi queue jo hamesha sabse chhoti value pehle deti hai.`]
],
steps:[
{t:`Dijkstra kya karta hai?`, b:`<ol><li>Source se sabki distance infinity maano, source ki 0.</li><li>Priority queue se sabse chhoti distance wala node nikalo.</li><li>Us node ko <strong>"done"</strong> maan lo. Uski distance ab final hai.</li><li>Uske padosiyon ki distance update karo.</li><li>Repeat.</li></ol>`},
{t:`Chhupa hua assumption`, b:`<p>Step 3 me Dijkstra maan leta hai: <strong>"jo node nikla, uski distance ab kabhi chhoti nahi hogi."</strong></p><p>Ye tabhi sach hai jab koi raasta length <strong>ghata na sake</strong>, yaani saare weights ≥ 0.</p><p>Real life: ek traveller jo shehar pahunchte hi "done" ka stamp laga deta hai aur dobara nahi sochta.</p>`},
{t:`Example jahan fail hota hai`, b:`<p>Edges: <code>A→B = 1</code>, <code>A→C = 2</code>, <code>C→B = −2</code></p><ol><li>A nikla. Ab B = 1, C = 2.</li><li>B nikla (1 sabse chhota). <strong>B final = 1.</strong></li><li>C nikla (2). C→B check: 2 + (−2) = <strong>0</strong>, jo 1 se chhota hai. Lekin B already done hai, update ignore.</li><li>Dijkstra ka answer: B = 1. <strong>Sahi answer: B = 0</strong> (A→C→B).</li></ol>`},
{t:`Negative edge ho to kya use karein?`, b:`<ul><li><strong>Bellman-Ford:</strong> saare edges ko <strong>V−1 baar</strong> relax karo. O(V·E).</li><li><strong>V−1 kyun?</strong> Shortest path me zyada se zyada V−1 edges hote hain. Har round ek aur edge wale paths ko sahi karta hai.</li><li><strong>V-th round</strong> me bhi kuch update hua, to graph me <strong>negative cycle</strong> hai.</li></ul>`},
{t:`Bonus: BFS unweighted graph me sahi kyun hai?`, b:`<p>BFS layer by layer chalta hai: pehle 1 edge door wale, phir 2 edge door wale. To jab kisi node tak pehli baar pahunche, wo <strong>sabse kam edges</strong> wala raasta hi hoga.</p>`}
],
say:`Dijkstra is greedy: once a node is popped from the priority queue, its distance is treated as final. That is only correct when all edge weights are non-negative, because then extending a path can never make it shorter. A negative edge can make a later path cheaper after a node has already been finalized. For example, with A to B cost 1, A to C cost 2 and C to B cost minus 2, Dijkstra returns 1 but the true answer is 0. For negative edges I would use Bellman-Ford, which also detects negative cycles.`,
hook:`Dijkstra "done" ka stamp lagata hai. Negative edge us stamp ko galat saabit karta hai.`,
check:[[`Bellman-Ford me V-th round me update aaye to?`,`Graph me negative cycle hai.`]]
},
{
h:`Segment tree, Fenwick tree aur lazy propagation`,
words:[
[`Range query`,`Array ke ek hisse ka sawaal. Jaise index 2 se 7 tak ka sum.`],
[`Point update`,`Ek index ki value badalna.`],
[`Range update`,`Ek poore hisse ki value badalna. Jaise 2 se 7 tak sab me +5.`]
],
steps:[
{t:`Problem kya hai?`, b:`<p>Array hai. Baar baar poochha jaata hai "L se R ka sum kya hai?" aur beech beech me values badalti hain.</p><ul><li>Seedha loop: har query O(n). Slow.</li><li>Prefix sum: query O(1), lekin har update pe poora prefix dobara banana padega, O(n).</li></ul><p>Dono O(log n) me chahiye. Isliye ye trees hain.</p>`},
{t:`Fenwick tree (BIT)`, b:`<ul><li>Sirf <strong>sum</strong> jaise operations (jinka ulta ho sake, jaise sum ka minus).</li><li>Memory: n. Code: ~10 lines.</li><li>Query aur update dono O(log n).</li></ul><p>Real life: <strong>pocket calculator</strong>. Chhota, fast, kaam limited.</p>`},
{t:`Segment tree`, b:`<ul><li>Koi bhi operation jo jod ke ho sake: <strong>min, max, gcd, sum</strong>.</li><li>Memory: ~4n. Code: ~50 lines.</li><li>Range update bhi support karta hai (lazy ke saath).</li></ul><p>Real life: <strong>scientific calculator</strong>. Bada, lekin sab kuch karta hai.</p>`},
{t:`Lazy propagation`, b:`<p>Range update me har leaf ko update karoge to O(n) lagega.</p><p>Lazy me: jo node poore range ko cover karta hai, uspe ek <strong>sticky note</strong> laga do: "iske andar sabko +5 karna hai". Andar tabhi jaao jab zaroorat pade. Tab note neeche pass karo.</p><p>Isse range update bhi <strong>O(log n)</strong>.</p>`},
{t:`Kab kya choose karein?`, b:`<div class="tbl-wrap"><table>
<tr><th>Zaroorat</th><th>Choose karo</th></tr>
<tr><td>Sirf sum + point update</td><td>Fenwick (chhota, fast)</td></tr>
<tr><td>min / max / gcd</td><td>Segment tree</td></tr>
<tr><td>Range update</td><td>Segment tree + lazy</td></tr>
</table></div>`}
],
say:`A Fenwick tree handles prefix sums with point updates in O(log n), uses n memory and is very short to write, but only works for invertible operations like sum. A segment tree supports any associative operation such as min, max or gcd, uses about 4n memory, and with lazy propagation supports range updates in O(log n) by storing pending updates on nodes and pushing them down only when needed.`,
hook:`Sum = Fenwick. Min/max/gcd ya range update = Segment tree + lazy.`,
check:[[`Range minimum query ke liye Fenwick chalega?`,`Normally nahi. Min ka "ulta" nahi hota. Segment tree use karo.`]]
},
{
h:`Patterns pehchaano + LRU cache + cycle detection`,
words:[
[`Pattern`,`Problem ke statement me aisa ishara jo batata hai kaunsi technique lagegi.`],
[`Doubly linked list`,`Har node aage aur peeche dono ka address rakhta hai.`]
],
steps:[
{t:`Statement dekh ke technique pehchaano`, b:`<div class="tbl-wrap"><table>
<tr><th>Statement me ye dikhe</th><th>Technique</th></tr>
<tr><td>Sorted array, pair ka sum</td><td>Two pointers</td></tr>
<tr><td>Lagataar subarray / substring</td><td>Sliding window</td></tr>
<tr><td>"Maximum ko minimum karo"</td><td>Binary search on answer</td></tr>
<tr><td>"Pehle dekha hai kya?"</td><td>Hashing</td></tr>
<tr><td>Next greater / smaller element</td><td>Monotonic stack</td></tr>
<tr><td>Top k, k-th largest</td><td>Heap (size k)</td></tr>
<tr><td>Kitne tareeke / minimum cost, choices ke saath</td><td>DP</td></tr>
<tr><td>Minimum steps, unweighted</td><td>BFS</td></tr>
</table></div>`},
{t:`LRU cache O(1) me banao`, b:`<p>LRU = <strong>Least Recently Used</strong>. Cache bhar gaya to <strong>sabse purana use hua</strong> item hatao.</p><ul><li><strong>Hash map:</strong> key se node O(1) me dhoondho.</li><li><strong>Doubly linked list:</strong> order rakho. Sabse naya aage, sabse purana peeche.</li><li><code>get</code>: map se node lo, usko list ke aage le aao.</li><li><code>put</code>: aage daalo. Size zyada hua to <strong>peeche wala</strong> hatao aur map se bhi hatao.</li></ul><p>Doubly isliye, taaki beech ka node O(1) me nikaal sako.</p>`},
{t:`Cycle detection: directed vs undirected`, b:`<p><strong>Directed graph:</strong> DFS me 3 rang use karo:</p><ul><li>White = abhi nahi dekha</li><li>Grey = abhi recursion me chal raha hai</li><li>Black = poora ho gaya</li></ul><p>Grey node pe wapas pahunche, to cycle hai.</p><p><strong>Undirected graph:</strong> DFS me parent yaad rakho. Koi visited padosi mile jo parent nahi hai, to cycle hai. Ya Union-Find use karo.</p>`},
{t:`DP pehchaanne ka tareeka`, b:`<ul><li><strong>Optimal substructure:</strong> bada answer chhote answers se banta hai.</li><li><strong>Overlapping subproblems:</strong> same chhota sawaal baar baar aata hai.</li></ul><p><strong>Memoization</strong> (upar se neeche, recursion + cache): sirf zaroori states banta hai, lekin stack overflow ho sakta hai. <strong>Tabulation</strong> (neeche se upar, loop): recursion nahi, lekin saari states banti hain.</p>`}
],
say:`For an LRU cache with O(1) get and put, I combine a hash map from key to node with a doubly linked list ordered by recency. On get, I move the node to the front. On put, I insert at the front and evict from the tail when over capacity, removing that key from the map too. The list must be doubly linked so a node can be unlinked in O(1).`,
hook:`LRU = HashMap + Doubly Linked List.`,
check:[[`LRU me singly linked list kyun nahi?`,`Beech ka node hataane ke liye uska previous chahiye. Singly me wo O(n) me milega.`]]
}
],
cards:[
{q:`Why does Dijkstra fail with negative edge weights?`, s:`Dijkstra node nikalte hi uski distance final maan leta hai. Negative edge baad me chhota raasta bana sakta hai, lekin node already done hai. Example: A→B=1, A→C=2, C→B=−2. Answer 1 deta hai, sahi 0 hai.`, a:`Dijkstra is greedy and finalizes a node when it is popped, which is only valid if no edge can reduce a path's cost. A negative edge can create a cheaper path to an already-finalized node, so the result is wrong. Use Bellman-Ford instead.`},
{q:`Why does Bellman-Ford run V−1 iterations?`, s:`Shortest path me max V−1 edges hote hain. Har round ek extra edge wale paths sahi karta hai. V-th round me update aaye to negative cycle hai.`, a:`A shortest path without negative cycles has at most V−1 edges, and each iteration fixes all paths with one more edge. If a V-th iteration still improves a distance, there is a negative cycle.`},
{q:`Segment tree or Fenwick tree — how do you choose?`, s:`Sirf sum = Fenwick (chhota, fast). Min/max/gcd ya range update = segment tree.`, a:`Fenwick for sums or other invertible operations — n memory, very short code. Segment tree for min, max, gcd or range updates with lazy propagation — about 4n memory.`},
{q:`What does lazy propagation do?`, s:`Range update ko O(log n) banata hai. Node pe "sticky note" lagao ki andar sabko update karna hai, aur neeche tabhi bhejo jab zaroorat ho.`, a:`It makes range updates O(log n) by storing a pending update on a node that covers the range, and pushing it to the children only when that subtree is visited later.`},
{q:`What is the space complexity of recursive DFS?`, s:`O(height), recursion stack ki wajah se. Skewed tree me O(n), balanced me O(log n).`, a:`O(h), where h is the recursion depth — O(log n) on a balanced tree but O(n) on a skewed one, because the call stack counts as space.`},
{q:`What is amortized complexity?`, s:`Operations ki poori series ka guaranteed average. Ek operation slow ho sakta hai, lekin total theek rehta hai. Jaise vector push_back.`, a:`The average cost per operation over a sequence, with a guarantee on the total. For example, n vector push_backs cost O(n) in total even though one push can be O(n).`},
{q:`Design an LRU cache with O(1) operations.`, s:`HashMap (key se node) + Doubly Linked List (naya aage, purana peeche). Get pe node aage lao. Put pe aage daalo, bhar jaaye to peeche wala hatao.`, a:`A hash map from key to node plus a doubly linked list ordered by recency. Get moves the node to the front; put inserts at the front and evicts the tail when over capacity. Doubly linked so unlinking is O(1).`},
{q:`How do you detect a cycle in a directed vs undirected graph?`, s:`Directed: DFS + 3 rang, grey node pe wapas aaye to cycle. Undirected: parent track karo, ya Union-Find.`, a:`Directed: DFS with white/grey/black colouring — an edge to a grey node is a back edge, so there is a cycle. Undirected: DFS tracking the parent, or union-find where an edge joining two nodes already in the same set forms a cycle.`},
{q:`How do you recognize a DP problem?`, s:`Do cheezein: bada answer chhote answers se banta ho (optimal substructure), aur same chhota sawaal baar baar aaye (overlapping subproblems).`, a:`It has optimal substructure — the answer is built from answers to subproblems — and overlapping subproblems, so the same subproblem is solved many times. Memoization computes only reachable states; tabulation avoids recursion overhead.`}
]
});
