<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Projects Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --bg:#f6f6f9; --surface:#ffffff; --sunk:#eff0f5; --text:#15161c; --dim:#555a6b; --faint:#8a8fa0;
  --line:#e1e3ea; --accent:#4f46e5; --accent-soft:#eceafd; --on-accent:#fff;
  --good:#15803d; --good-soft:#e6f5eb; --warn:#a15c07; --warn-soft:#fdf1df; --bad:#be123c; --bad-soft:#fde8ee;
  --info:#0e7490; --info-soft:#e3f5f8; --code:#0f1117; --code-text:#e6e8ef;
  --shadow:0 1px 2px rgba(15,17,23,.05),0 10px 30px -18px rgba(15,17,23,.3);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1016; --surface:#171821; --sunk:#12131a; --text:#e9eaf2; --dim:#a3a7b8; --faint:#737889;
    --line:#2a2c38; --accent:#8b83ff; --accent-soft:#221f3f; --on-accent:#0d0b1a;
    --good:#4ade80; --good-soft:#10261a; --warn:#f5b454; --warn-soft:#2a1f10; --bad:#fb7194; --bad-soft:#2d1219;
    --info:#5ad0e6; --info-soft:#0f2328; --code:#0b0c12; --code-text:#e6e8ef;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1016; --surface:#171821; --sunk:#12131a; --text:#e9eaf2; --dim:#a3a7b8; --faint:#737889;
  --line:#2a2c38; --accent:#8b83ff; --accent-soft:#221f3f; --on-accent:#0d0b1a;
  --good:#4ade80; --good-soft:#10261a; --warn:#f5b454; --warn-soft:#2a1f10; --bad:#fb7194; --bad-soft:#2d1219;
  --info:#5ad0e6; --info-soft:#0f2328; --code:#0b0c12; --code-text:#e6e8ef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15.5px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--sunk);border:1px solid var(--line);padding:.05em .35em;border-radius:6px}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand-dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#22d3ee);display:grid;place-items:center;color:#fff;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--dim)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.stats{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.pill{padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--text)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;font-size:13px}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
.learn{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.side-topic{margin:6px 0 10px}
.side-topic h4{margin:6px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
.side-item{width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:9px;display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--dim)}
.side-item:hover{background:var(--sunk);color:var(--text)}
.side-item[aria-current="true"]{background:var(--accent-soft);color:var(--text);font-weight:600}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;margin-top:2px}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.mobile-nav{display:none}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 30px;box-shadow:var(--shadow);min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.lesson h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:30px;line-height:1.15;margin:6px 0 10px;letter-spacing:-.02em}
.why{background:var(--info-soft);border:1px solid color-mix(in oklab,var(--info) 30%,transparent);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14.5px}
.why b{color:var(--info)}
.block{margin:22px 0}
.block h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.block p{margin:.55em 0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.word{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px}
.word b{display:block;font-size:14px}
.word span{font-size:13.5px;color:var(--dim)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0}
ol.steps>li{counter-increment:s;position:relative;padding:2px 0 12px 42px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
ul.bul{margin:.4em 0;padding-left:1.2em}
ul.bul li{margin:.25em 0}
.code{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--code)}
.code-head{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;font:12px "JetBrains Mono",monospace;color:#9aa3b8;border-bottom:1px solid #22252f}
.code pre{margin:0;padding:12px 14px;overflow:auto;color:var(--code-text);font:13px/1.6 "JetBrains Mono",ui-monospace,monospace;white-space:pre}
.code-note{padding:8px 12px;border-top:1px solid #22252f;color:#c5cad8;font-size:13px;background:#10121a}
.diagram{border:1px solid var(--line);border-radius:14px;background:var(--sunk);padding:14px;overflow:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--text)}
.diagram figcaption{font-size:13px;color:var(--dim);margin-top:8px;text-align:center}
.callout{border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.callout .ct{font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.callout.trap{background:var(--bad-soft);border-color:color-mix(in oklab,var(--bad) 35%,transparent)}
.callout.trap .ct{color:var(--bad)}
.callout.tip{background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 35%,transparent)}
.callout.tip .ct{color:var(--good)}
.callout.honest{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 35%,transparent)}
.callout.honest .ct{color:var(--warn)}
.callout.analogy{background:var(--info-soft);border-color:color-mix(in oklab,var(--info) 35%,transparent)}
.callout.analogy .ct{color:var(--info)}
.say{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.say .lang{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.say p{margin:.4em 0}
details.qa{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
details.qa summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"Q";flex:none;width:22px;height:22px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent)}
details.qa[open] summary{border-bottom:1px solid var(--line)}
details.qa .ans{padding:10px 14px 12px 46px;color:var(--text)}
.remember{display:grid;gap:8px}
.remember div{background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.num{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk)}
.num b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;letter-spacing:-.02em}
.num span{font-size:13px;color:var(--dim)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
table.t tr:last-child td{border-bottom:0}
.lesson-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.center{max-width:820px;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);min-height:220px}
.card .q{font-family:"Space Grotesk",Inter,sans-serif;font-size:22px;line-height:1.3;letter-spacing:-.01em}
.card .meta{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.card .hint{margin-top:14px;background:var(--info-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.card .a{margin-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades button{border-radius:12px;padding:10px 6px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.grades small{display:block;font-weight:500;color:var(--faint);font-size:11.5px}
.g-again{color:var(--bad)} .g-hard{color:var(--warn)} .g-good{color:var(--good)} .g-easy{color:var(--info)}
.muted{color:var(--dim)}
.timer{font:600 28px "JetBrains Mono",monospace}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rev-topic{margin-bottom:26px}
.rev-topic h2{font-family:"Space Grotesk",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.kbd{font:12px "JetBrains Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--sunk)}


.resume-line{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14.5px}
.resume-line .lang{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:700}
.diagram svg{width:100%}
.d-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.d-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.d-good{fill:var(--good-soft);stroke:var(--good);stroke-width:1.5}
.d-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.d-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.d-info{fill:var(--info-soft);stroke:var(--info);stroke-width:1.5}
.d-t{fill:var(--text);font:600 14px Inter,system-ui,sans-serif}
.d-s{fill:var(--dim);font:500 12px Inter,system-ui,sans-serif}
.d-m{fill:var(--text);font:500 12.5px "JetBrains Mono",ui-monospace,monospace}
.d-line{stroke:var(--dim);stroke-width:1.6;fill:none}
.d-life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.d-dash{stroke-dasharray:5 4}
.d-ah{fill:var(--dim)}
.d-accline{stroke:var(--accent);stroke-width:2;fill:none}
.d-badline{stroke:var(--bad);stroke-width:2;fill:none}
.d-goodline{stroke:var(--good);stroke-width:2;fill:none}

@media (max-width:900px){
  .learn{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:block;margin-bottom:12px}
  .mobile-nav select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
  .lesson{padding:20px 16px}
  .lesson h1{font-size:24px}
  .stats{margin-left:0;width:100%}
  .grades{grid-template-columns:repeat(2,1fr)}
  .card .q{font-size:19px}
}
@media print{.top,.side,.mobile-nav,.lesson-foot{display:none}.learn{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-dot" id="brandIcon"></span><span id="brandTitle"></span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-view="learn">Padho</button>
      <button class="tab" role="tab" data-view="practice">Practice</button>
      <button class="tab" role="tab" data-view="revision">Revision</button>
      <button class="tab" role="tab" data-view="mock">Mock</button>
    </nav>
    <div class="stats">
      <span class="pill" id="statLessons"></span>
      <span class="pill" id="statDue"></span>
      <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
// Small SVG builders so lesson diagrams stay readable in both themes.
// Colours come from CSS classes (.d-box, .d-acc, ...) defined in the shell.
var D = window.D = (function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const DEFS = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ah"/></marker></defs>'

  function svg(w, h, body, label) {
    return `<svg viewBox="0 0 ${w} ${h}" style="min-width:${Math.min(w, 600)}px" role="img" aria-label="${esc(label || 'diagram')}" xmlns="http://www.w3.org/2000/svg">${DEFS}${body}</svg>`
  }

  // Multi-line text: lines split on \n, centred on (x, y).
  function text(x, y, s, cls = 'd-t', anchor = 'middle', lh = 16) {
    const lines = String(s).split('\n')
    const top = y - ((lines.length - 1) * lh) / 2
    return lines.map((l, i) => `<text x="${x}" y="${top + i * lh}" class="${cls}" text-anchor="${anchor}" dominant-baseline="middle">${esc(l)}</text>`).join('')
  }

  function box(x, y, w, h, title, sub, kind = 'box', r = 10) {
    let out = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="d-${kind}"/>`
    if (sub) {
      out += text(x + w / 2, y + h / 2 - 9, title, 'd-t')
      out += text(x + w / 2, y + h / 2 + 11, sub, 'd-s', 'middle', 14)
    } else {
      out += text(x + w / 2, y + h / 2, title, 'd-t')
    }
    return out
  }

  function arrow(x1, y1, x2, y2, label, cls = 'd-line', dashed = false, labelDy = -8) {
    let out = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}${dashed ? ' d-dash' : ''}" marker-end="url(#ah)"/>`
    if (label) out += text((x1 + x2) / 2, (y1 + y2) / 2 + labelDy, label, 'd-s')
    return out
  }

  function path(d, cls = 'd-line', marker = true, dashed = false) {
    return `<path d="${d}" class="${cls}${dashed ? ' d-dash' : ''}" ${marker ? 'marker-end="url(#ah)"' : ''}/>`
  }

  // Left-to-right chain of boxes that wraps into rows. items: [title, sub?, kind?]
  function flow(items, opts = {}) {
    const w = opts.w || 150, h = opts.h || 60, gx = opts.gap || 40, gy = opts.gapY || 44, per = opts.perRow || 4, pad = 12
    const rows = Math.ceil(items.length / per)
    const W = pad * 2 + per * w + (per - 1) * gx
    const H = pad * 2 + rows * h + (rows - 1) * gy
    let body = ''
    const pos = items.map((_, i) => {
      const r = Math.floor(i / per), c = i % per
      return [pad + c * (w + gx), pad + r * (h + gy)]
    })
    items.forEach((it, i) => {
      const [x, y] = pos[i]
      body += box(x, y, w, h, it[0], it[1], it[2] || 'box')
      if (i + 1 < items.length) {
        const [nx, ny] = pos[i + 1]
        if (ny === y) body += arrow(x + w, y + h / 2, nx - 3, ny + h / 2, it[3])
        else body += path(`M${x + w / 2},${y + h} L${x + w / 2},${y + h + gy / 2} L${nx + w / 2},${y + h + gy / 2} L${nx + w / 2},${ny - 3}`)
      }
    })
    return svg(W, H, body, opts.label)
  }

  // Sequence diagram. actors: [name]; steps: [from, to, label, kind] where kind is
  // 'ok' | 'bad' | 'acc' | 'dash'. from === to draws a note box on that lifeline.
  function seq(actors, steps, opts = {}) {
    const colW = opts.colW || 180, rowH = opts.rowH || 44, top = 58, pad = 14
    const W = pad * 2 + actors.length * colW
    const H = top + steps.length * rowH + 26
    const cx = (i) => pad + colW * i + colW / 2
    let body = ''
    actors.forEach((a, i) => {
      body += box(cx(i) - colW / 2 + 12, 8, colW - 24, 38, a, null, 'acc')
      body += `<line x1="${cx(i)}" y1="46" x2="${cx(i)}" y2="${H - 8}" class="d-life"/>`
    })
    steps.forEach((s, k) => {
      const [f, t, label, kind] = s
      const y = top + k * rowH + rowH / 2 + 6
      if (f === t) {
        const bw = colW - 20
        body += `<rect x="${cx(f) - bw / 2}" y="${y - 15}" width="${bw}" height="30" rx="8" class="d-${kind === 'bad' ? 'bad' : kind === 'ok' ? 'good' : 'warn'}"/>`
        body += text(cx(f), y, label, 'd-s')
      } else {
        const cls = kind === 'bad' ? 'd-badline' : kind === 'ok' ? 'd-goodline' : kind === 'acc' ? 'd-accline' : 'd-line'
        const dir = t > f ? 1 : -1
        body += arrow(cx(f) + dir * 4, y, cx(t) - dir * 6, y, null, cls, kind === 'dash')
        body += text((cx(f) + cx(t)) / 2, y - 11, label, 'd-s')
      }
    })
    return svg(W, H, body, opts.label)
  }

  return { esc, svg, text, box, arrow, path, flow, seq }
})()

window.LAB = {
  id: "projects-lab",
  title: "Projects Lab",
  icon: "🛠️",
  topics: [
    {
      id: "start", title: "Shuru karo", short: "Start", color: "#64748b",
      lessons: [{
        id: "p-how", title: "Project interview ka format",
        why: "Project round me interviewer 'walk me through' se shuru karke ek specific architecture decision aur failure mode pe 15 minute drill karta hai.",
        blocks: [
          { t: "steps", title: "Har project ke liye 4 essential pillars ready rakho", items: [
            "**30-Second Architectural Elevator Pitch:** High-level problem, technology stack, and verified scale metric.",
            "**Whiteboard Architecture Diagram:** Data flow, trust boundaries, async queues, and failure isolation.",
            "**2 Deep Design Decisions with Trade-offs:** Option A chosen vs Option B rejected; exact reason why.",
            "**1 Catastrophic Failure / Production Bug Story:** Root cause, kernel/runtime observability, and structural remediation."
          ]},

            { t: "steps", title: "Frontend Pipeline Architecture & Implementation Details", items: [
              "**1. Lexical Analysis (Scanner):**\n🟢 **Basic:** Code ko char-by-char padho. `>` aur `=` ek sath dikhe toh combine kar lo. Spaces/comments ignore karo.\n🔴 **Deep:** Consumes UTF-8 characters. Implements maximal munch (longest match): `>=` is recognized as a single relational token, not `>` followed by `=`. Skips whitespace and C++ style line/block comments. Preserves line and column coordinates for every token.",
              "**2. Recursive Descent Parsing Loop:**\n🟢 **Basic:** Rules ko tree ki tarah left ya right ki taraf attach karte jao recursive functions (function calling itself) ka use karke.\n🔴 **Deep:** Left-associative operators (e.g. `+ - * /`) are implemented using a `while` loop that repeatedly matches current-level operators and binds leftward. Right-associative operators (e.g. `=`) recursively call `parse_expression()` on the right-hand side, creating a right-leaning AST branch.",
              "**3. Disambiguating Nested Templates:** When parsing types like `vector<vector<int>>`, lexer encounters `>>`. In template context, parser detects type parsing mode and splits `>>` into two consecutive `>` closing tokens without requiring backtracking.",
              "**4. Panic-Mode Error Recovery (`synchronize()`):**\n🟢 **Basic:** Agar syntax error ho, toh rukna nahi. Agli semi-colon (;) ya new block tak aage badho aur next errors find karo.\n🔴 **Deep:** When an unrecoverable syntax error occurs, parser emits a diagnostic and enters panic mode: it discards tokens until it encounters a semicolon `;` or a token beginning a new statement (`if`, `while`, `for`, `return`, `let`). This prevents cascading syntax errors and reports multiple independent issues in a single pass.",
              "**5. Semantic Analysis & Type System:** Traverses the AST. Manages symbol tables using `std::vector<std::unordered_map<std::string, Symbol>>`. Enforces: (a) variable declaration before use; (b) no re-declaration in the same block; (c) immutable assignment restrictions on `const` identifiers; (d) strict type checks: binary arithmetic operands must share matching types (no implicit numeric coercion; explicit casting requires `as<T>()`); (e) control-flow validation: `break`/`continue` restricted strictly to loop bodies."
            ]},
            { t: "code", file: "src/parser.cpp (Precedence & Panic Mode)", lang: "cpp", code: `ExprPtr Parser::parse_term() { // Handles + and - (Level 11)
    ExprPtr expr = parse_factor(); // Higher precedence parsed first
    while (match(TokenType::PLUS) || match(TokenType::MINUS)) {
        TokenType op = previous().type;
        ExprPtr right = parse_factor();
        expr = make_binary(previous().line, op, std::move(expr), std::move(right));
    }
    return expr; // While-loop enforces left-associativity
}

ExprPtr Parser::parse_assignment() { // Handles = (Level 1)
    ExprPtr expr = parse_ternary();
    if (match(TokenType::EQUAL)) {
        Token equals = previous();
        ExprPtr value = parse_assignment(); // Right-associative recursion
        if (auto var = std::dynamic_pointer_cast<VariableExpr>(expr)) {
            return std::make_shared<AssignExpr>(equals.line, var->name, std::move(value));
        }
        error(equals, "Invalid l-value: target of assignment must be a mutable variable.");
    }
    return expr;
}

void Parser::synchronize() { // Panic-mode error recovery boundary
    advance();
    while (!is_at_end()) {
        if (previous().type == TokenType::SEMICOLON) return;
        switch (peek().type) {
            case TokenType::KW_IF: case TokenType::KW_WHILE: case TokenType::KW_FOR:
            case TokenType::KW_RETURN: case TokenType::KW_LET: case TokenType::KW_CONST:
                return;
            default: advance();
        }
    }
}` },
            { t: "callout", kind: "tip", title: "Recursive Descent vs Pratt Parsing (Whiteboard Trade-off)", text: [
              "**Recursive Descent:** Each precedence tier has its own explicit function (`parse_term()`, `parse_factor()`). Easy to debug, natural for statements and control flow, trivial to attach custom syntax error handlers. Trade-off: deep call stacks and boilerplate for languages with many operators.",
              "**Pratt Parsing (Top-Down Operator Precedence):** Table-driven; associates numeric 'binding power' with each token. Much fewer functions. Trade-off: harder to read for non-compiler engineers and tricky to integrate C++ style declaration vs expression ambiguities.",
              "MiniLang chose Recursive Descent for maximum readability, explicit AST ownership, and fine-grained diagnostic control."
            ]},
            { t: "followups", items: [
                            ["How do you resolve the 'dangling else' ambiguity in recursive descent?", "In MiniLang, when parsing an `if` statement, the parser greedily binds an optional `else` block to the innermost active `if` statement. This matches standard C/C++ semantics and avoids ambiguous AST branching."],
              ["Why does MiniLang disallow implicit type coercion (e.g. int to float)?", "Implicit type coercion conceals arithmetic bugs, precision loss, and unexpected overload resolution. MiniLang enforces strict type equality on binary operators, requiring explicit `as<float>(x)` casts to make type conversions deliberate and visible in the AST."],
              ["How does your parser prevent infinite recursion on left-recursive grammars?", "In standard BNF grammar, a rule like `Expr -> Expr '+' Term` is directly left-recursive, which causes infinite function recursion in top-down parsers. We transform the grammar into iterative form: `Expr -> Term ('+' Term)*`. In C++, this is implemented as a while-loop inside `parse_term()`, eliminating recursion while preserving left-associative AST construction."],
              ["How is memory managed for the Abstract Syntax Tree?", "All AST nodes inherit from an abstract base class `ASTNode`. Children are managed via `std::unique_ptr<ASTNode>` for strict single-ownership hierarchy, or `std::shared_ptr` where sub-expressions are shared during constant folding and symbol resolution."],
              ["What is the difference between an l-value and an r-value in MiniLang?", "An l-value represents an expression with an identifiable memory address (such as a named variable `x` or array index `arr[i]`). An r-value is a temporary value (`5`, `x + 2`). The assignment parser validates that the left-hand node evaluates to a valid l-value before emitting an assignment AST node."]
            ]},

              "**1. Value Representation (`Value` Variant):** Values are stored as `std::variant<int64_t, double, bool, std::string, PointerValue, ArrayValue>`. Dynamic type verification ensures safe operations at runtime.",
              "**2. Call Frame Memory Layout:** Stack contains both local variables and evaluation temporaries. When a function is called (`OP_CALL argc`), the VM instantiates `CallFrame { size_t return_ip; size_t base_pointer; Function* fn; }`. Callee locals are indexed as `stack[base_pointer + slot_index]`.",

                            ["How does the VM handle recursion and stack overflow?", "Each function call creates a CallFrame and consumes evaluation stack space. To prevent host stack exhaustion, the VM maintains an explicit maximum recursion depth limit (e.g. 1,024 frames) and max stack depth (65,536 values), throwing a controlled runtime exception instead of crashing the process."],
              ["How does Emscripten bridge C++ exceptions to JavaScript in the browser?", "By default, Emscripten catches C++ exceptions via JavaScript try-catch blocks if compiled with `-fexceptions`. To maintain performance, MiniLang uses return-code error propagation for VM errors, exposing human-readable error strings across the C ABI via `Module.ccall()`."],
              ["Why choose a Stack VM over a Register VM like Lua 5.1?", "Stack-based VMs are simpler to compile for: codegen does not require register allocation algorithms (such as graph coloring or linear scan). Instructions are compact (1 byte opcode with zero register operands). However, Register VMs execute significantly fewer total instructions (roughly 30–40% fewer) because intermediate values don't need continuous push and pop cycles. For an educational language, Stack VM provides the best engineering balance."],

              ["Round Robin", "O(1)", "Assumes identical request execution times.", "Slow backend builds massive request queue, causing cascading timeout failure."],
              ["Random", "O(1)", "Statistically uniform over millions of requests.", "High variance under bursts; can overwhelm already struggling nodes."],
              ["**Least-Connections**", "**O(N)**", "**Dynamically diverts traffic away from slow backends.**", "**Selected policy: ties broken via rotating atomic index to prevent single-node bias.**"],

            { t: "code", file: "loadbalancer/main.go (Core Routing Engine)", lang: "go", code: `// Least-connections routing excluding backends already attempted for this request
func (lb *LoadBalancer) selectBackendExcluding(tried map[*Backend]bool) *Backend {
    n := len(lb.backends)
    startIdx := int(lb.currIndex.Add(1)) // Rotating start index: breaks ties fairly!
    var best *Backend
    var bestLoad int64
    
    for i := 0; i < n; i++ {
        b := lb.backends[(startIdx+i)%n]
        if tried[b] { continue }
        
        load := b.InFlight.Load() // Atomic zero-mutex counter
        if !b.Alive.Load() {
            load += 1 << 20 // Heavy penalty: down nodes used only as absolute last resort
        }
        
        if best == nil || load < bestLoad {
            best, bestLoad = b, load
        }
    }
    return best
}` },
            { t: "steps", title: "Request Lifecycle & Retry State Machine", items: [
              "**1. Request Body Buffering:**\n🟢 **Basic:** Request ke data ko memory me temporary store karna taaki retry karna pade toh wapis bhej sake.\n🔴 **Deep:** Incoming request body is buffered into a reusable `sync.Pool` byte buffer (capped at 1 MiB). If body > 1 MiB, returns `413 Payload Too Large`. Buffering is mandatory to allow resending the payload if retry is required.",
              "**2. Target Selection:** `selectBackendExcluding(tried)` finds healthy node with minimum `InFlight` connections. Increments `InFlight.Add(1)` atomically.",
              "**3. Forwarding via `http.Transport`:**\n🟢 **Basic:** Backend ko request bhej kar check karna. Agar error aaye (5xx) aur client ko ab tak kuch return nahi hua ho, toh retry flag true karo.\n🔴 **Deep:** Executes `RoundTrip`. If backend returns connection error or HTTP 5xx AND no response headers have been sent to client, request is marked for retry.",
              "**4. Safe Retry Execution:** Backend is added to `tried` map. Loop selects next best untried backend, rewinds the buffered body reader, and re-executes.",
              "**5. Success & Header Cleanup:** Copies response headers (stripping hop-by-hop headers per RFC 7230), streams response body, and decrements `InFlight.Add(-1)` in a deferred block.",
              "**6. Exhaustion:** If all 3 backends fail, returns `502 Bad Gateway` with JSON diagnostics.",
              "**7. Active Health Daemon:** Dedicated goroutine probes `/health` every 2 seconds (timeout: 2s). 3 consecutive failures mark node `Alive = false`. A single successful probe immediately restores `Alive = true`."
            ]},

            { t: "callout", kind: "honest", title: "Distributed Systems Trade-offs & Vulnerabilities", text: [
              "1. **Single Point of Failure (SPOF):** The load balancer is a single Go process. In enterprise production, two LB nodes should run with a shared floating Virtual IP using VRRP (Keepalived) or AWS ALB.",
              "2. **Acknowledge-Before-Commit:** Backends accept writes into in-memory queue and acknowledge client before PostgreSQL transaction commits to maximize write throughput. If a container crashes, in-flight messages in memory are lost. Production requires WAL durability.",
              "3. **Throughput Ceiling:** Adding backends 1 -> 3 showed flat throughput (~500 req/s) because the single-threaded CPU budget on the LB container became the bottleneck."
            ]},
            { t: "followups", items: [
                            ["What happens if all 3 backends fail health checks simultaneously?", "Instead of dropping all incoming traffic with instant 502 errors, our least-connections algorithm applies a large additive penalty (`+2^20`) to down backends rather than excluding them. If all backends are marked dead (e.g. during a transient health probe failure), the load balancer still attempts routing as a graceful degradation fallback."],
              ["Why must hop-by-hop headers be stripped by a reverse proxy?", "RFC 7230 specifies that headers like `Connection`, `Keep-Alive`, `Proxy-Authenticate`, and `Transfer-Encoding` govern the transport connection between client and proxy. Forwarding them to upstream backends causes protocol desynchronization, connection hangs, and potential HTTP request smuggling vulnerabilities."],
              ["Why is least-connections superior to round-robin for this workload?", "In a chat application, `GET /feed` requests complete in ~2 ms while `POST /message` requests perform cryptographic verification, deduplication, and database writes taking ~25 ms. Round-robin blindly assigns equal requests, causing nodes handling write bursts to accumulate backlogs. Least-connections monitors real-time in-flight requests, automatically routing new traffic to nodes with spare processing capacity."],
              ["How does the backend guarantee idempotency during retries?", "Every message has a client-generated UUID. Backend inserts use PostgreSQL `INSERT INTO messages (id, body) VALUES ($1, $2) ON CONFLICT (id) DO NOTHING`. If a retried request hits a second backend, PostgreSQL ignores the duplicate, ensuring zero double-insertion."],
              ["Why assign down backends a penalty (+2^20) instead of removing them from the array?", "If a temporary network glitch causes the health check daemon to mark all 3 backends down simultaneously, a strict exclusion policy would cause the load balancer to drop 100% of incoming traffic immediately. By applying a large penalty rather than exclusion, the load balancer still attempts routing as a desperate fallback if all nodes are marked down."]
            ]},

          ]
        },

        {
          id: "l-oom", title: "OOM debugging story + Go memory concepts",
          why: "Ye software engineering interviews ki gold standard debugging story hai: Linux kernel cgroups, memory profiling, Go runtime GC tuning, aur load benchmarking.",
          blocks: [
            { t: "resume", text: "Traced an **18% error rate** to **OOM kills** (cgroup memory events); cut memory via snapshot caching, `sync.Pool` buffers, and GOMEMLIMIT/GOGC tuning: **0 errors over 60,000 requests** at up to **2,500 concurrent users**." },
            { t: "words", items: [
              ["cgroups v2 (Control Groups)", "🟢 **Basic (Hinglish):** Linux ke andar ek box (container) banana aur limit set karna ki yeh application is box se bahar ka CPU ya RAM use nahi kar sakti.\n\n🔴 **Deep Tech:** Linux kernel mechanism that isolates and limits resource usage (CPU, memory, disk I/O, network) for process hierarchies."],
              ["oom_kill", "🟢 **Basic (Hinglish):** Jab container ki RAM full ho jati hai, toh Linux OS gussa ho kar process ko seedha kill (murder) kar deta hai bina koi warning diye.\n\n🔴 **Deep Tech:** Linux kernel Out-Of-Memory Killer event. When `memory.current > memory.max`, the kernel terminates the highest `oom_score` process with SIGKILL (exit code 137)."],
              ["GOMEMLIMIT (Go 1.19+)", "🟢 **Basic (Hinglish):** Go runtime ko ek warning limit dena ki 'bhai limit aane wali hai, jaldi se kachra (garbage) saaf karo taaki OS hume kill na kar de'.\n\n🔴 **Deep Tech:** Soft memory limit informing the Go runtime memory scavenger to trigger garbage collection aggressively as total usage approaches the container budget."],
              ["GOGC", "🟢 **Basic (Hinglish):** Ek setting jo decide karti hai ki kachra kab saaf hoga (GOGC=50 matlab jaldi-jaldi saaf karo, GOGC=100 matlab aaram se karo).\n\n🔴 **Deep Tech:** Target heap growth percentage between collections: `NextGC = LiveHeap * (1 + GOGC/100)`. Default is 100."],
              ["sync.Pool", "🟢 **Basic (Hinglish):** Baar-baar nayi thali (memory buffer) lane ki jagah, purani dhuli hui thaliyo ka ek pool bana lena.\n\n🔴 **Deep Tech:** Concurrent object cache in Go runtime that reduces allocation churn and memory fragmentation by recycling allocated byte buffers."],
              ["Kernel Socket Buffers", "🟢 **Basic (Hinglish):** Jab 2500 log connect hote hain, toh unki active connection ka apna ek memory buffer hota hai, jo Linux kernel hide karke rakhta hai par cgroup me count hota hai.\n\n🔴 **Deep Tech:** TCP receive (`rmem`) and transmit (`wmem`) buffers allocated by the Linux kernel per open connection, charged directly to the container's cgroup memory."]
            ]},
            { t: "table", title: "Linux Kernel Memory Accounting (Inside 512 MiB Container)", head: ["Memory Subsystem", "Typical Allocation Under Load", "Visibility to Go Profiler (pprof)", "Kernel Accounting Role"], rows: [
              ["Go Active Heap", "150 – 250 MiB", "Visible via pprof / runtime.ReadMemStats", "Allocated by Go runtime TCMalloc-style allocator for live objects."],

              ["TCP Socket Buffers", "80 – 120 MiB (at 2,500 conns)", "Completely INVISIBLE to Go heap profiler!", "Kernel network stack allocates buffer space per TCP socket; charged to cgroup!"],

            { t: "steps", title: "Incident Response Playbook: How the Bug was Uncovered", items: [
              "**1. Symptom Recognition:**\n🟢 **Basic:** Load badhaya toh 18% errors aane lage, par jo requests pass huyi woh bahut fast thi (matlab backend free tha).\n🔴 **Deep:** Graded load test ramping to 2,500 users showed ~18% failed requests. However, successful requests completed with fast sub-10ms response times, and there were zero HTTP timeouts.",
              "**2. Root Cause Deduction:**\n🟢 **Basic:** Agar DB ya CPU ka issue hota toh timeouts aate. Fast errors ka matlab connection hi refuse ho gaya kyuki process crash ho gaya tha.\n🔴 **Deep:** If backends were bottlenecked by CPU or disk, latency would increase and client requests would timeout (504). Instant errors with zero latency meant **Connection Refused (ECONNREFUSED)**: the server listening port was closed because the process was dead.",
              "**3. Kernel Proof:**\n🟢 **Basic:** Linux ki logs (memory.events) me dekha ki Linux kernel gussa ho gaya tha aur memory full hone par kill kar raha tha.\n🔴 **Deep:** Checked Linux cgroup statistics: `cat /sys/fs/cgroup/memory.events` revealed **oom_kill 121**. The container was exceeding its 512 MiB limit and the Linux kernel was killing the load balancer.",
              "**4. Why the Bug Remained Masked:** The process supervisor script had a `sleep 1` loop before restarting the dead binary. During that 1-second window, all incoming connections were refused. Backends rebuilt feed state from Postgres upon boot, so post-test data integrity checks passed 100%, masking the crash.",
              "**5. The Memory Fixes:**",
              "   - (a) **sync.Pool Body Buffering:** Eliminated per-request `io.ReadAll` allocations for 1 MiB bodies, reducing heap garbage rate by 70%.",
              "   - (b) **Tuning GOMEMLIMIT & GOGC:** Set `GOMEMLIMIT=450MiB` and `GOGC=50`. This instructed Go's GC pacer to collect aggressively when approaching container limits.",
              "   - (c) **Reducing Socket Buffer Limits:** Tuned connection pool sizes from 3x600 @ 8 KiB down to 3x512 @ 4 KiB, reclaiming ~17 MiB of kernel memory.",
              "   - (d) **Snapshot Caching on Backends:** Replaced full-table lock copies on `/feed` with atomic pointer swapping of immutable pre-rendered JSON buffers.",
              "   - (e) **Supervisor Tuning:** Cut restart delay from 1,000 ms down to 50 ms.",
              "**6. Verification:** Executed two back-to-back graded load tests: **0 errors over 60,000 requests** up to 2,500 users; peak memory stabilized at **364 MiB of 512 MiB**; zero new OOM kills."
            ]},
            { t: "code", file: "loadbalancer/buffer_pool.go (sync.Pool Implementation)", lang: "go", code: `var bufferPool = sync.Pool{
    New: func() interface{} {
        // Pre-allocate 64 KiB buffer, capable of dynamic growth up to 1 MiB
        b := make([]byte, 0, 64*1024)
        return &b
    },
}

func readRequestBody(r *http.Request) ([]byte, error) {
    bufPtr := bufferPool.Get().(*[]byte)
    buf := (*bufPtr)[:0] // Reset slice length while keeping underlying capacity
    
    // Read up to 1 MiB + 1 byte to detect overflow
    limitedReader := io.LimitReader(r.Body, 1024*1024 + 1)
    bytesRead, err := io.ReadAll(limitedReader)
    if err != nil {
        bufferPool.Put(bufPtr)
        return nil, err
    }
    if len(bytesRead) > 1024*1024 {
        bufferPool.Put(bufPtr)
        return nil, ErrPayloadTooLarge
    }
    
    // Clean return to pool deferred after request forwarding completes
    return bytesRead, nil
}` },
            { t: "say", length: "60 seconds", text: "Under graded load tests ramping to 2,500 concurrent users, our Go load balancer suffered an 18% request failure rate. Yet, successful requests had sub-10ms response times and there were zero timeouts. This signature pointed to connection refusals rather than saturation. Inspecting Linux cgroups via `/sys/fs/cgroup/memory.events` revealed 121 OOM kill events. The Go garbage collector was unaware of the 512 MiB container constraint, and incoming connection bursts created garbage faster than the default GC reclaimed it, while kernel socket buffers pushed total memory over the limit. I re-architected memory usage: implementing `sync.Pool` for request body buffers, tuning `GOMEMLIMIT=450MiB` and `GOGC=50`, shrinking outbound connection pools, and caching feed snapshots. In subsequent validation runs, the system achieved zero errors across 60,000 requests up to 2,500 users, with peak memory settling at 364 MiB." },
            { t: "followups", items: [
                            ["What is the difference between resident set size (RSS) and virtual memory (VIRT)?", "VIRT is the total address space mapped by the process, including shared libraries and allocated but uncommitted memory. RSS is the actual physical RAM pages mapped into the process. Linux cgroup memory accounting tracks RSS plus kernel buffers and active page cache; VIRT does not trigger OOM kills, but exceeding 512 MiB RSS does."],
              ["How does Go's memory scavenger return memory to the OS kernel?", "When Go's GC frees heap memory, it marks the pages as idle. In modern Go (1.16+), the runtime uses `MADV_DONTNEED` (or `MADV_FREE`) syscalls to inform the Linux kernel that the physical RAM can be reclaimed, lowering the process's RSS footprint within the container cgroup."],
              ["Why didn't the default Go Garbage Collector prevent the OOM kill?", "By default, Go GC runs relative to the live heap via `GOGC=100`, meaning it triggers only after the live heap doubles. Under rapid traffic spikes, heap allocations outpace GC pacing. Furthermore, the Go runtime only monitors heap memory; it cannot see kernel socket buffers or page caches, which are counted against the cgroup's 512 MiB ceiling. Setting `GOMEMLIMIT` establishes a global memory target, compelling the runtime to scavenge memory aggressively before kernel limits are breached."],
              ["What is the latency trade-off of setting GOGC=50?", "Lowering GOGC from 100 to 50 causes the GC to run twice as frequently, consuming roughly 15-20% more CPU cycles. In our 1-CPU container, this increased median request latency slightly from 4.2 ms to 6.1 ms. However, this was an acceptable trade-off because it completely prevented catastrophic process termination and dropped errors from 18% to 0%."],
              ["Why couldn't you reproduce this bug on your local MacBook / development machine?", "Development machines have 16+ GiB of RAM with no cgroup limits enabled. When the Go process briefly spiked to 700 MiB during local tests, the OS effortlessly satisfied the allocation. The bug was an emergent property of the 512 MiB Linux cgroup constraint, proving that performance testing must occur in production-identical resource-constrained environments."]
            ]},

              "**1. Authentication & Security:** User logs in -> password verified via `bcrypt` (work factor: 12) -> signs JWT containing `userId` and `elo` -> stored in client `localStorage`. Express routes protected by JWT middleware and rate limited (10 requests/minute on auth and submission endpoints).",

              "**5. Room Joining & Live Progress:** Players enter the match page and emit `match:join`. Server validates participation and subscribes sockets to `match:<matchId>`. Whenever a player submits code, evaluation results are broadcast as `match:progress` (e.g. `testsPassed: 7/10`), updating the opponent's progress bar in real time.",

            { t: "code", file: "services/matchmaking.ts (Closest ELO Pair Algorithm)", lang: "ts", code: `interface QueueEntry {
    userId: string;
    socketId: string;
    elo: number;
    joinedAt: number;
}

// O(N log N) closest pair matchmaking algorithm
function findBestMatch(queue: QueueEntry[]): [QueueEntry, QueueEntry] | null {
    if (queue.length < 2) return null;
    
    // Sort queue by ELO rating
    const sorted = [...queue].sort((a, b) => a.elo - b.elo);
    let minDiff = Infinity;
    let bestIndex = 0;
    
    // Closest pair in 1D is guaranteed to be adjacent in sorted order
    for (let i = 0; i < sorted.length - 1; i++) {
        const diff = Math.abs(sorted[i].elo - sorted[i + 1].elo);
        if (diff < minDiff) {
            minDiff = diff;
            bestIndex = i;
        }
    }
    
    return [sorted[bestIndex], sorted[bestIndex + 1]];
}` },

              ["Race Condition", "🟢 **Basic (Hinglish):** Do logo ne exact ek same millisecond pe submit button dabaya, aur server confuse ho gaya ki winner kon hai.\n\n🔴 **Deep Tech:** Flaw where system output depends unpredictably on the execution sequence or timing of concurrent threads."],
              ["Check-Then-Act Flaw", "🟢 **Basic (Hinglish):** Tumne check kiya ki ticket available hai, fir purse nikala, par utne mein kisi aur ne ticket book kar li aur tumhara payment cut gaya.\n\n🔴 **Deep Tech:** Anti-pattern where a program checks a condition (e.g. `if (winner_id == null)`) and then acts (`UPDATE`), allowing concurrent threads to slip between check and act."],
              ["ELO Rating System", "🟢 **Basic (Hinglish):** Chess wala rating system. Agar pro khiladi noob se haar jaye toh uska bahut ELO kam hoga, aur noob ka bahut ELO badhega.\n\n🔴 **Deep Tech:** Zero-sum competitive rating method where score changes depend on expected outcome vs actual match performance."],
              ["Test Harness", "🟢 **Basic (Hinglish):** User ke code ko ek invisible box me daalna jisme humare secret test cases mix hote hain, aur result check karna.\n\n🔴 **Deep Tech:** Server-generated wrapper script that bundles user code with hidden test inputs, asserts outputs, and captures execution time and memory."]
            ]},
            { t: "table", title: "Database Concurrency Handling: The Single-Winner Problem", head: ["Approach", "Concurrency Flaw / Mechanism", "Database Impact", "Production Verdict"], rows: [
              ["Naive App Check", "App queries `SELECT winner_id`. If null, runs `UPDATE`.", "Both concurrent requests read null before either writes -> **TWO WINNERS CREATED!**", "Unacceptable (Data Corruption)"],
              ["Pessimistic Lock", "`SELECT winner_id FROM matches FOR UPDATE`", "Acquires exclusive row lock. Works, but risks deadlocks and holds lock across network calls.", "Acceptable but slower"],
              ["**Atomic UPDATE**", "**UPDATE matches SET winner_id = $1 WHERE id = $2 AND winner_id IS NULL**", "**PostgreSQL row-level lock ensures exactly ONE transaction updates row (rowsAffected = 1); concurrent runner gets 0!**", "**Gold Standard Selected Policy**"]
            ]},
            { t: "code", file: "services/grading.ts (Atomic Winner Settlement)", lang: "ts", code: `// Database transaction settling match victory atomically
export async function settleMatchWin(matchId: string, winnerId: string, loserId: string) {
    return await db.transaction(async (tx) => {
        // Atomic conditional update: exactly ONE execution can succeed
        const result = await tx
            .update(matches)
            .set({
                winnerId: winnerId,
                status: 'completed',
                endedAt: new Date()
            })
            .where(and(eq(matches.id, matchId), isNull(matches.winnerId)))
            .returning();
            
        // If rowsAffected is 0, the opponent already claimed victory a millisecond earlier!
        if (result.length === 0) {
            return { won: false, reason: 'Opponent finished first' };
        }
        
        // Calculate new ELO ratings using standard zero-sum formula
        const [winner, loser] = await Promise.all([
            tx.query.users.findFirst({ where: eq(users.id, winnerId) }),
            tx.query.users.findFirst({ where: eq(users.id, loserId) })
        ]);
        
        const { winnerDelta, loserDelta } = calculateEloDelta(winner.elo, loser.elo);
        
        await tx.update(users).set({ elo: winner.elo + winnerDelta }).where(eq(users.id, winnerId));
        await tx.update(users).set({ elo: loser.elo + loserDelta }).where(eq(users.id, loserId));
        
        return { won: true, winnerDelta, loserDelta };
    });
}` },
            { t: "callout", kind: "tip", title: "ELO Rating Formula Derivation & Invariants", text: [
              "**Expected Score Equation:** `E_A = 1 / (1 + 10^{(R_B - R_A) / 400})`",
              "If Player A (1600 ELO) plays Player B (1200 ELO): `ΔR = -400 -> E_A = 1 / (1 + 10^{-1}) = 1 / 1.1 ≈ 0.909` (91% expected win probability).",
              "**Rating Adjustment:** `R'_A = R_A + K · (S_A - E_A)`, where `K = 32` and `S_A = 1` for win, `0` for loss.",
              "**Mathematical Invariant (Zero-Sum):** `E_A + E_B = 1.0` always. Consequently, `ΔR_A + ΔR_B = K(S_A - E_A) + K(S_B - E_B) = K[(S_A + S_B) - (E_A + E_B)] = K[1 - 1] = 0`. Points gained by winner exactly equal points lost by loser!"
            ]},
            { t: "steps", title: "Automated Test Harness Execution Pipeline", items: [
              "**1. Code Ingestion:** User submits solution via Monaco Editor (`POST /matches/:id/submit`).",
              "**2. Test Harness Synthesis:**\n🟢 **Basic:** Backend user ke function ko ek bade testing function me pack karta hai.\n🔴 **Deep:** Backend injects user function into an ephemeral driver script. The driver executes 10 test cases in memory, redirecting stdout/stderr and tracking microsecond execution time.",
              "**3. Sandbox Dispatch:** Driver payload is dispatched via HTTPS to Wandbox execution API (`https://wandbox.org/api/compile.json`).",
              "**4. Sandbox Isolation Parameters:**\n🟢 **Basic:** Wandbox ko instruct karna ki bas 5 sec CPU time aur 256MB RAM hi dena, taaki infinite while-loop pe crash na ho.\n🔴 **Deep:** Wandbox compiles in an isolated sandbox with compiler flags (e.g. `-O3 -std=c++17`), enforcing 5-second CPU timeout and 256 MiB memory cap to prevent infinite loops or memory bombs.",
              "**5. Output Parsing:** Backend parses stdout: validates matching outputs. If all 10 pass, invokes `settleMatchWin()` inside atomic database transaction.",
              "**6. Broadcast:** Emits `match:ended` with winner username and ELO deltas to the Socket.IO match room."
            ]},
            { t: "followups", items: [
                            ["How do you prevent code injection and container escapes in Wandbox execution?", "User code is never executed on our application server. We dispatch it to Wandbox's isolated API, which runs the code inside ephemeral containers with dropped Linux capabilities (`CAP_SYS_ADMIN`), read-only root filesystems, strict `seccomp` system call filtering, 5-second CPU time limits, and 256 MiB memory caps."],
              ["Why is the ELO K-factor set to 32?", "In competitive ranking systems, K determines rating volatility. A higher K (e.g. 64) causes wild swings from single match wins, while a lower K (e.g. 16) requires hundreds of matches to calibrate. K = 32 is the standard chess/competitive gaming standard for rapid calibration of new players while maintaining rating stability."],
              ["What happens if both players submit 100% correct code within 5 milliseconds of each other?", "This is a classic concurrent race condition. Both grading jobs complete and invoke `settleMatchWin()`. The first transaction to reach PostgreSQL acquires the row lock on `matches` row and executes `UPDATE ... WHERE winner_id IS NULL`. It succeeds and returns 1 row. The second transaction attempts the same query, but because `winner_id` is now populated, the `WHERE winner_id IS NULL` clause evaluates to false. It receives 0 affected rows, identifies that it lost the race, and returns gracefully without corrupting ELO."],
              ["Why did you use Wandbox API instead of running Docker containers locally on Render?", "Running untrusted user code on the application server poses severe container breakout and resource exhaustion vulnerabilities (fork bombs, CPU starvation). On free/low-tier hosting like Render, running Docker-in-Docker is unsupported. Wandbox provides an isolated, hardened, remote execution infrastructure without managing our own Kubernetes sandbox cluster."]
            ]},
            { t: "remember", items: ["Atomic UPDATE with WHERE winner_id IS NULL prevents check-then-act race condition", "ELO is zero-sum: points gained by winner strictly equal points lost by loser (K=32)", "Wandbox sandbox executes untrusted code with CPU and memory resource limits"] }
          ]
        }
      ],
      revision: {
        pitch: "AlgoRace is a real-time 1v1 coding race platform with 102 problems and 1,020 test cases. Architected with contract-first OpenAPI, Orval-generated React Query hooks, and Socket.IO rooms. Solved the concurrent winner race condition via an atomic PostgreSQL UPDATE transaction with WHERE winner_id IS NULL, automated grading via Wandbox API, and implemented an ELO matchmaking system.",
        numbers: [["102", "Competitive coding problems"], ["1,020", "Curated test cases"], ["30", "REST endpoints"], ["K = 32", "ELO scale factor"], ["10s", "Disconnect reconnect grace timer"], ["5s / 256MB", "Wandbox execution sandbox limits"]],
        flow: ["Auth (JWT + bcrypt)", "Matchmaking (O(N log N) adjacent scan in sorted ELO array)", "Socket room join (match:id)", "Live race updates (match:progress)", "Wandbox grading harness", "Atomic win settlement (WHERE winner_id IS NULL)", "Zero-sum ELO calculation"],
        traps: ["Single-process in-memory queue cannot scale horizontally across servers without Redis", "Check-then-act winner verification fails under concurrency; atomic UPDATE is mandatory", "Remote Wandbox dependency introduces external latency for code execution"]
      }
    }
  ]
};

</script>
<script>
(function () {
  const LAB = window.LAB
  const KEY = LAB.id + ':v1'
  const MIN = 60e3, HOUR = 36e5, DAY = 864e5
  const NEW_PER_SESSION = 15

  // ---------- storage ----------
  function load() {
    try { return Object.assign({ done: {}, cards: {}, view: 'learn', lesson: null }, JSON.parse(localStorage.getItem(KEY) || '{}')) }
    catch (e) { return { done: {}, cards: {}, view: 'learn', lesson: null } }
  }
  const S = load()
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  // Tiny inline markup: **bold**, `code`, *italic*, and line breaks.
  function md(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>')
  }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return (h >>> 0).toString(36) }

  const lessons = []
  LAB.topics.forEach((t) => t.lessons.forEach((l, i) => lessons.push(Object.assign(l, { topic: t, index: i }))))
  const byId = Object.fromEntries(lessons.map((l) => [l.id, l]))

  // Every lesson's explicit cards plus its follow-ups become practice cards.
  const cards = []
  lessons.forEach((l) => {
    ;(l.cards || []).forEach((c) => cards.push({ id: l.id + ':c:' + hash(c.q), q: c.q, hint: c.hint, a: c.a, lesson: l }))
    ;(l.blocks || []).forEach((b) => {
      if (b.t === 'followups') b.items.forEach(([q, a]) => cards.push({ id: l.id + ':f:' + hash(q), q, a, lesson: l }))
    })
  })

  const now = () => Date.now()
  const dueCount = () => cards.filter((c) => S.cards[c.id] && S.cards[c.id].due <= now()).length
  const newCount = () => cards.filter((c) => !S.cards[c.id]).length

  function renderStats() {
    const done = lessons.filter((l) => S.done[l.id]).length
    document.getElementById('statLessons').innerHTML = `<b>${done}/${lessons.length}</b> lessons`
    document.getElementById('statDue').innerHTML = `<b>${dueCount()}</b> due · ${newCount()} new`
  }

  // ---------- blocks ----------
  function block(b, lesson) {
    switch (b.t) {
      case 'p': return `<div class="block">${(Array.isArray(b.text) ? b.text : [b.text]).map((x) => `<p>${md(x)}</p>`).join('')}</div>`
      case 'resume': return `<div class="block"><div class="resume-line"><div class="lang">Resume line jo defend karni hai</div>${md(b.text)}</div></div>`
      case 'h': return `<div class="block"><h3>${esc(b.text)}</h3></div>`
      case 'words': return `<div class="block"><h3>📘 Naye words</h3><div class="words">${b.items.map(([w, m]) => `<div class="word"><b>${md(w)}</b><span>${md(m)}</span></div>`).join('')}</div></div>`
      case 'steps': return `<div class="block">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<ol class="steps">${b.items.map((x) => `<li>${md(x)}</li>`).join('')}</ol></div>`
      case 'list': return `<div class="block">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<ul class="bul">${b.items.map((x) => `<li>${md(x)}</li>`).join('')}</ul></div>`
      case 'code': return `<div class="block"><div class="code"><div class="code-head"><span>${esc(b.file || b.lang || 'code')}</span><span>${esc(b.lang || '')}</span></div><pre>${esc(b.code.replace(/^\n/, ''))}</pre>${b.note ? `<div class="code-note">${md(b.note)}</div>` : ''}</div></div>`
      case 'diagram': return `<div class="block"><figure class="diagram" style="margin:0">${b.svg}${b.caption ? `<figcaption>${md(b.caption)}</figcaption>` : ''}</figure></div>`
      case 'callout': {
        const icon = { trap: '⚠️', tip: '✅', honest: '🧭', analogy: '💡' }[b.kind] || '•'
        return `<div class="block"><div class="callout ${b.kind}"><div class="ct">${icon} ${esc(b.title)}</div>${(Array.isArray(b.text) ? b.text : [b.text]).map((x) => `<p style="margin:.3em 0">${md(x)}</p>`).join('')}</div></div>`
      }
      case 'say': return `<div class="block"><h3>🎤 Interview me bolo</h3><div class="say"><div class="lang">English · ${esc(b.length || 'about 45 seconds')}</div>${(Array.isArray(b.text) ? b.text : [b.text]).map((x) => `<p>${md(x)}</p>`).join('')}</div></div>`
      case 'followups': return `<div class="block"><h3>🔁 Interviewer follow-ups</h3>${b.items.map(([q, a]) => `<details class="qa"><summary>${md(q)}</summary><div class="ans">${md(a)}</div></details>`).join('')}</div>`
      case 'remember': return `<div class="block"><h3>🧠 Yaad rakho</h3><div class="remember">${b.items.map((x) => `<div>${md(x)}</div>`).join('')}</div></div>`
      case 'check': return `<div class="block"><h3>✍️ Khud check karo</h3>${b.items.map(([q, a]) => `<details class="qa"><summary>${md(q)}</summary><div class="ans">${md(a)}</div></details>`).join('')}</div>`
      case 'table': return `<div class="block">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="tbl"><table class="t"><thead><tr>${b.head.map((h) => `<th>${md(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
      case 'numbers': return `<div class="block">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div class="numbers">${b.items.map(([n, l]) => `<div class="num"><b>${esc(n)}</b><span>${md(l)}</span></div>`).join('')}</div></div>`
      default: return ''
    }
  }

  // ---------- views ----------
  const app = document.getElementById('app')

  function renderLearn() {
    let current = byId[S.lesson] || lessons[0]
    S.lesson = current.id
    const side = LAB.topics.map((t) => `<div class="side-topic"><h4><span class="swatch" style="background:${t.color}"></span>${esc(t.short || t.title)}</h4>${t.lessons.map((l) => `<button class="side-item" data-lesson="${l.id}" aria-current="${l.id === current.id}"><span class="tick ${S.done[l.id] ? 'on' : ''}">${S.done[l.id] ? '✓' : ''}</span><span>${esc(l.title)}</span></button>`).join('')}</div>`).join('')
    const options = LAB.topics.map((t) => `<optgroup label="${esc(t.short || t.title)}">${t.lessons.map((l) => `<option value="${l.id}" ${l.id === current.id ? 'selected' : ''}>${S.done[l.id] ? '✓ ' : ''}${esc(l.title)}</option>`).join('')}</optgroup>`).join('')
    const idx = lessons.indexOf(current)
    const prev = lessons[idx - 1], next = lessons[idx + 1]
    app.innerHTML = `<div class="learn">
      <aside class="side" aria-label="Lessons">${side}</aside>
      <div>
        <div class="mobile-nav"><select id="lessonSelect" aria-label="Choose lesson">${options}</select></div>
        <article class="lesson">
          <div class="crumb" style="color:${current.topic.color}">${esc(current.topic.title)} · Lesson ${current.index + 1}/${current.topic.lessons.length}</div>
          <h1>${esc(current.title)}</h1>
          ${current.why ? `<div class="why"><b>Interviewer ye kyun poochta hai:</b> ${md(current.why)}</div>` : ''}
          ${(current.blocks || []).map((b) => block(b, current)).join('')}
          <div class="lesson-foot">
            <button class="btn" data-go="${prev ? prev.id : ''}" ${prev ? '' : 'disabled'}>← Pichla</button>
            <button class="btn ${S.done[current.id] ? 'good' : 'primary'}" id="doneBtn">${S.done[current.id] ? '✓ Samajh gaya (done)' : 'Samajh gaya — mark done'}</button>
            <button class="btn" data-go="${next ? next.id : ''}" ${next ? '' : 'disabled'}>Agla →</button>
          </div>
        </article>
      </div></div>`
    app.querySelectorAll('[data-lesson]').forEach((b) => b.addEventListener('click', () => go(b.dataset.lesson)))
    app.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => b.dataset.go && go(b.dataset.go)))
    document.getElementById('lessonSelect').addEventListener('change', (e) => go(e.target.value))
    document.getElementById('doneBtn').addEventListener('click', () => { S.done[current.id] = !S.done[current.id]; save(); renderLearn(); renderStats() })
  }
  function go(id) { S.lesson = id; save(); renderLearn(); window.scrollTo({ top: 0 }) }

  // ---------- spaced repetition ----------
  let session = null
  let topicFilter = 'all'
  function buildSession() {
    const pool = cards.filter((c) => topicFilter === 'all' || c.lesson.topic.id === topicFilter)
    const due = pool.filter((c) => S.cards[c.id] && S.cards[c.id].due <= now()).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due)
    const fresh = pool.filter((c) => !S.cards[c.id]).slice(0, NEW_PER_SESSION)
    session = { queue: [...due, ...fresh], revealed: false, seen: 0 }
  }
  function schedule(card, grade) {
    const st = S.cards[card.id] || { ease: 2.5, ivl: 0, reps: 0, lapses: 0 }
    if (grade === 0) { st.lapses++; st.reps = 0; st.ivl = 0; st.ease = Math.max(1.3, st.ease - 0.2); st.due = now() + MIN }
    else if (grade === 1) { st.ease = Math.max(1.3, st.ease - 0.15); st.ivl = st.ivl ? st.ivl * 1.2 : 10 * MIN; st.due = now() + st.ivl }
    else if (grade === 2) { st.reps++; st.ivl = st.ivl >= DAY ? st.ivl * st.ease : st.reps > 1 ? DAY : 4 * HOUR; st.due = now() + st.ivl }
    else { st.reps++; st.ease += 0.15; st.ivl = st.ivl >= DAY ? st.ivl * st.ease * 1.3 : 2 * DAY; st.due = now() + st.ivl }
    S.cards[card.id] = st
    save()
    return st
  }
  function fmtWait(ms) { return ms < HOUR ? Math.round(ms / MIN) + ' min' : ms < DAY ? Math.round(ms / HOUR) + ' hr' : Math.round(ms / DAY) + ' din' }
  function preview(card, grade) {
    const st = Object.assign({ ease: 2.5, ivl: 0, reps: 0, lapses: 0 }, S.cards[card.id] || {})
    if (grade === 0) return '1 min'
    if (grade === 1) return fmtWait(st.ivl ? st.ivl * 1.2 : 10 * MIN)
    if (grade === 2) return fmtWait(st.ivl >= DAY ? st.ivl * st.ease : st.reps + 1 > 1 ? DAY : 4 * HOUR)
    return fmtWait(st.ivl >= DAY ? st.ivl * (st.ease + 0.15) * 1.3 : 2 * DAY)
  }
  function filterChips() {
    return `<div class="filters">${[['all', 'Sab topics'], ...LAB.topics.map((t) => [t.id, t.short || t.title])].map(([id, label]) => `<button class="chip" data-topic="${id}" aria-pressed="${topicFilter === id}">${esc(label)}</button>`).join('')}</div>`
  }
  function bindChips(rerender) {
    app.querySelectorAll('[data-topic]').forEach((b) => b.addEventListener('click', () => { topicFilter = b.dataset.topic; session = null; rerender() }))
  }
  function renderPractice() {
    if (!session) buildSession()
    const card = session.queue[0]
    if (!card) {
      app.innerHTML = `<div class="center">${filterChips()}<div class="panel"><h2 style="margin-top:0">🎉 Is session ke cards khatam!</h2><p class="muted">Due cards: ${dueCount()} · New cards bache: ${newCount()}. Thodi der baad wapas aao, ya lessons padho.</p><button class="btn primary" id="again">Naya session shuru karo</button></div></div>`
      bindChips(renderPractice)
      document.getElementById('again').addEventListener('click', () => { session = null; renderPractice() })
      return
    }
    const isNew = !S.cards[card.id]
    app.innerHTML = `<div class="center">${filterChips()}
      <div class="bar" style="margin-bottom:12px"><i style="width:${Math.round((session.seen / (session.seen + session.queue.length)) * 100)}%"></i></div>
      <div class="card">
        <div class="meta">${esc(card.lesson.topic.short || card.lesson.topic.title)} · ${esc(card.lesson.title)} ${isNew ? '· NEW' : ''}</div>
        <div class="q">${md(card.q)}</div>
        ${session.revealed ? `${card.hint ? `<div class="hint"><b>Samjho:</b> ${md(card.hint)}</div>` : ''}<div class="a say"><div class="lang">Answer</div><p>${md(card.a)}</p></div>` : `<p class="muted" style="margin-top:18px">Pehle khud bolo (out loud!), phir answer dekho. <span class="kbd">Space</span></p>`}
        ${session.revealed ? `<div class="grades">${['Again', 'Hard', 'Good', 'Easy'].map((g, i) => `<button class="g-${g.toLowerCase()}" data-grade="${i}">${g}<small>${preview(card, i)} · ${i + 1}</small></button>`).join('')}</div>` : `<div style="margin-top:16px"><button class="btn primary" id="reveal">Answer dikhao</button></div>`}
      </div>
      <p class="muted" style="font-size:13px;margin-top:10px">Session me bache: ${session.queue.length}</p></div>`
    bindChips(renderPractice)
    const reveal = document.getElementById('reveal')
    if (reveal) reveal.addEventListener('click', () => { session.revealed = true; renderPractice() })
    app.querySelectorAll('[data-grade]').forEach((b) => b.addEventListener('click', () => grade(Number(b.dataset.grade))))
  }
  function grade(g) {
    const card = session.queue.shift()
    const st = schedule(card, g)
    if (st.due - now() < 20 * MIN) session.queue.splice(Math.min(3, session.queue.length), 0, card)
    session.seen++
    session.revealed = false
    renderPractice(); renderStats()
  }

  // ---------- revision ----------
  function renderRevision() {
    app.innerHTML = `<div class="center">${LAB.topics.map((t) => {
      const r = t.revision || {}
      return `<section class="panel rev-topic">
        <div class="crumb" style="color:${t.color}">Cheat sheet</div>
        <h2>${esc(t.title)}</h2>
        ${r.pitch ? `<div class="block"><h3>⏱️ 30-second pitch</h3><div class="say"><div class="lang">English</div><p>${md(r.pitch)}</p></div></div>` : ''}
        ${r.numbers ? block({ t: 'numbers', title: '🔢 Numbers jo yaad hone chahiye', items: r.numbers }) : ''}
        ${r.flow ? block({ t: 'steps', title: '🧭 2-minute walkthrough', items: r.flow }) : ''}
        ${r.traps ? block({ t: 'list', title: '⚠️ Traps / honest answers', items: r.traps }) : ''}
        ${r.questions ? `<div class="block"><h3>❓ Top questions</h3>${r.questions.map(([q, a]) => `<details class="qa"><summary>${md(q)}</summary><div class="ans">${md(a)}</div></details>`).join('')}</div>` : ''}
      </section>`
    }).join('')}</div>`
  }

  // ---------- mock ----------
  let mock = null
  function newMock() {
    const pool = cards.filter((c) => topicFilter === 'all' || c.lesson.topic.id === topicFilter)
    mock = { card: pool[Math.floor(Math.random() * pool.length)], start: now(), revealed: false, limit: 90 }
  }
  let mockTimer = null
  function renderMock() {
    if (!mock) newMock()
    clearInterval(mockTimer)
    const c = mock.card
    app.innerHTML = `<div class="center">${filterChips()}
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="meta">Mock interview · ${esc(c.lesson.topic.short || c.lesson.topic.title)}</div><div class="timer" id="timer">1:30</div></div>
        <div class="q">${md(c.q)}</div>
        <p class="muted">Timer chalu hai. Interviewer ke saamne jaise bolo — structure: <b>context → what I did → result → trade-off</b>.</p>
        ${mock.revealed ? `${c.hint ? `<div class="hint"><b>Samjho:</b> ${md(c.hint)}</div>` : ''}<div class="a say"><div class="lang">Model answer</div><p>${md(c.a)}</p></div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn good" data-self="2">Achha bola ✓</button><button class="btn" data-self="0">Aur practice chahiye</button></div>` : `<button class="btn primary" id="mockReveal" style="margin-top:12px">Model answer dikhao</button>`}
      </div></div>`
    bindChips(() => { mock = null; renderMock() })
    const tick = () => {
      const left = Math.max(0, mock.limit - Math.floor((now() - mock.start) / 1000))
      const el = document.getElementById('timer')
      if (el) { el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.style.color = left < 15 ? 'var(--bad)' : '' }
    }
    tick(); mockTimer = setInterval(tick, 500)
    const r = document.getElementById('mockReveal')
    if (r) r.addEventListener('click', () => { mock.revealed = true; renderMock() })
    app.querySelectorAll('[data-self]').forEach((b) => b.addEventListener('click', () => { schedule(c, Number(b.dataset.self)); renderStats(); mock = null; renderMock() }))
  }

  // ---------- shell ----------
  function setView(v) {
    S.view = v; save()
    clearInterval(mockTimer)
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.view === v))
    ;({ learn: renderLearn, practice: renderPractice, revision: renderRevision, mock: renderMock })[v]()
    window.scrollTo({ top: 0 })
  }
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setView(t.dataset.view)))
  document.addEventListener('keydown', (e) => {
    if (S.view !== 'practice' || !session || e.target.closest('input,select,textarea')) return
    if (e.code === 'Space' && !session.revealed && session.queue[0]) { e.preventDefault(); session.revealed = true; renderPractice() }
    else if (session.revealed && ['1', '2', '3', '4'].includes(e.key)) grade(Number(e.key) - 1)
  })
  const themeBtn = document.getElementById('themeBtn')
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme }
  applyTheme(localStorage.getItem('lab-theme'))
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    const next = cur === 'dark' ? 'light' : 'dark'
    try { localStorage.setItem('lab-theme', next) } catch (e) {}
    applyTheme(next)
  })
  document.getElementById('brandTitle').textContent = LAB.title
  document.getElementById('brandIcon').textContent = LAB.icon || '★'
  renderStats()
  setView(S.view || 'learn')
})()
</script>
</body>
</html>
