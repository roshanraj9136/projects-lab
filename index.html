<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hinglish interview prep for my projects: MiniLang, the Go load balancer, and AlgoRace.">
<style>
:root{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Projects Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F5F5F8; --surface:#FFFFFF; --sunk:#EEEEF3; --raise:#FFFFFF;
  --text:#16161D; --dim:#5A5A6B; --faint:#8A8A9C;
  --line:#DEDEE6; --line-soft:#EAEAF0;
  --accent:#5B3FE8; --accent-2:#7C63F0; --accent-soft:#EFEBFE; --on-accent:#FFFFFF;
  --crit:#C22A46; --crit-soft:#FCEBEE;
  --mod:#9C5A06; --mod-soft:#FBF1E0;
  --liab:#9E1D67; --liab-soft:#FBE9F3;
  --good:#15803D; --good-soft:#E6F5EB;
  --g-again:#C22A46; --g-hard:#9C5A06; --g-good:#15803D; --g-easy:#1D6FA8;
  --shadow:0 1px 2px rgba(22,22,29,.05), 0 8px 24px -14px rgba(22,22,29,.22);
  --dgrid:#D9D9E4; --dfill:#F0EEFC; --dfill2:#EDEDF3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131319; --surface:#1B1B24; --sunk:#15151C; --raise:#20202B;
    --text:#E9E9F2; --dim:#9E9EB2; --faint:#75758A;
    --line:#2C2C39; --line-soft:#24242F;
    --accent:#9B87FF; --accent-2:#B4A3FF; --accent-soft:#241F3D; --on-accent:#14101F;
    --crit:#F2718A; --crit-soft:#2E151C;
    --mod:#E9A94E; --mod-soft:#2A1F12;
    --liab:#EE7FBB; --liab-soft:#2C1523;
    --good:#57D98A; --good-soft:#11251A;
    --g-again:#F2718A; --g-hard:#E9A94E; --g-good:#57D98A; --g-easy:#6BB8EA;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.8);
    --dgrid:#33333F; --dfill:#241F3D; --dfill2:#22222D;
  }
}
:root[data-theme="dark"]{
  --bg:#131319; --surface:#1B1B24; --sunk:#15151C; --raise:#20202B;
  --text:#E9E9F2; --dim:#9E9EB2; --faint:#75758A;
  --line:#2C2C39; --line-soft:#24242F;
  --accent:#9B87FF; --accent-2:#B4A3FF; --accent-soft:#241F3D; --on-accent:#14101F;
  --crit:#F2718A; --crit-soft:#2E151C;
  --mod:#E9A94E; --mod-soft:#2A1F12;
  --liab:#EE7FBB; --liab-soft:#2C1523;
  --good:#57D98A; --good-soft:#11251A;
  --g-again:#F2718A; --g-hard:#E9A94E; --g-good:#57D98A; --g-easy:#6BB8EA;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.8);
  --dgrid:#33333F; --dfill:#241F3D; --dfill2:#22222D;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ================= shell ================= */
.top{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:0 18px;
}
.top-in{
  max-width:1240px; margin:0 auto;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  min-height:58px; padding-block:9px;
}
.brand{
  font-weight:800; font-size:17px; letter-spacing:-.02em;
  display:flex; align-items:center; gap:9px; margin-right:auto;
}
.brand .mk{
  width:24px; height:24px; border-radius:6px; flex:none;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;
}
.modes{display:flex; gap:3px; background:var(--sunk); padding:3px; border-radius:9px}
.mode{
  border:0; background:transparent; color:var(--dim); cursor:pointer;
  font-size:13px; font-weight:600; padding:6px 14px; border-radius:7px; transition:.15s;
}
.mode:hover{color:var(--text)}
.mode[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.due-pill{
  font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600;
  padding:4px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent);
  white-space:nowrap;
}
.due-pill.zero{background:var(--sunk); color:var(--faint)}

.layout{max-width:1240px; margin:0 auto; display:flex; gap:0; align-items:flex-start}

/* ================= sidebar ================= */
.side{
  width:246px; flex:none; position:sticky; top:58px;
  max-height:calc(100vh - 58px); overflow-y:auto;
  padding:22px 12px 40px 18px;
}
.side-h{
  font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); padding:0 10px; margin:0 0 9px;
}
.side-h + .side-h{margin-top:22px}
.nav{display:flex; flex-direction:column; gap:1px; list-style:none; margin:0; padding:0}
.nav button{
  width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
  color:var(--dim); font-size:13.5px; font-weight:500; padding:8px 10px; border-radius:7px;
  display:flex; align-items:center; gap:8px; transition:.13s; line-height:1.35;
}
.nav button:hover{background:var(--sunk); color:var(--text)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav .tick{
  width:5px; height:5px; border-radius:99px; flex:none; background:var(--line);
}
.nav button[data-done="1"] .tick{background:var(--good)}
.nav .nm{flex:1; min-width:0}
.nav .ct{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  font-variant-numeric:tabular-nums;
}

/* ================= main ================= */
.main{flex:1; min-width:0; padding:26px 18px 90px}

.lede-wrap{margin-bottom:26px}
.crumb{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); margin:0 0 10px;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
}
.tier{padding:3px 8px; border-radius:4px; font-weight:600; letter-spacing:.08em}
.tier.crit{background:var(--crit-soft); color:var(--crit)}
.tier.mod{background:var(--mod-soft); color:var(--mod)}
.tier.liab{background:var(--liab-soft); color:var(--liab)}
h1.topic{
  font-size:clamp(27px,5vw,38px); font-weight:800; letter-spacing:-.028em;
  line-height:1.08; margin:0 0 12px; text-wrap:balance;
}
.why{
  font-family:"Source Serif 4",Georgia,serif; font-size:16.5px; line-height:1.6;
  color:var(--dim); margin:0; max-width:66ch;
  padding-left:14px; border-left:2px solid var(--accent);
}

/* -------- reading content -------- */
.sec{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);
}
.sec > h2{
  font-size:19px; font-weight:700; letter-spacing:-.018em; margin:0 0 14px;
  display:flex; align-items:baseline; gap:10px;
}
.sec > h2 .ix{
  font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;
  color:var(--accent); flex:none;
}
.prose{font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.68; max-width:68ch}
.prose p{margin:0 0 13px}
.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 13px; padding-left:22px}
.prose li{margin-bottom:6px}
.prose strong{font-weight:600; color:var(--text)}
.prose em{font-style:italic}
.prose code{
  font-family:"JetBrains Mono",monospace; font-size:13.5px;
  background:var(--sunk); padding:1.5px 5px; border-radius:4px;
}
.prose a{color:var(--accent)}

pre{
  font-family:"JetBrains Mono",monospace; font-size:13px; line-height:1.6;
  background:var(--sunk); border:1px solid var(--line-soft); border-radius:9px;
  padding:14px 16px; overflow-x:auto; margin:0 0 14px;
}
pre .cm{color:var(--faint); font-style:italic}
pre .kw{color:var(--accent)}
pre .st{color:var(--good)}

.key{
  font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.6;
  background:var(--accent-soft); border-left:3px solid var(--accent);
  padding:13px 16px; border-radius:0 8px 8px 0; margin:0 0 14px; color:var(--text);
}
.key b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent); margin-bottom:4px; font-weight:700;
}
.trap{
  font-family:"Source Serif 4",Georgia,serif; font-size:15.5px; line-height:1.6;
  background:var(--mod-soft); border-left:3px solid var(--mod);
  padding:13px 16px; border-radius:0 8px 8px 0; margin:0 0 14px;
}
.trap b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--mod); margin-bottom:4px; font-weight:700;
}
.say{
  border:1px solid var(--good); background:var(--good-soft);
  border-radius:9px; padding:14px 16px; margin:0 0 14px;
  font-family:"Source Serif 4",Georgia,serif; font-size:15.5px; line-height:1.62;
}
.say b{
  display:block; font-family:"Bricolage Grotesque",sans-serif;
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--good); margin-bottom:5px; font-weight:700;
}

.tbl-wrap{overflow-x:auto; margin:0 0 14px; border:1px solid var(--line); border-radius:9px}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:440px}
th,td{padding:9px 13px; text-align:left; border-bottom:1px solid var(--line-soft)}
th{
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint);
  font-weight:600; background:var(--sunk);
}
tr:last-child td{border-bottom:0}
td code{font-family:"JetBrains Mono",monospace; font-size:12.5px}

/* -------- diagram -------- */
figure{margin:0 0 16px}
.dg{
  background:var(--sunk); border:1px solid var(--line); border-radius:11px;
  padding:18px 14px; overflow-x:auto;
}
.dg svg{display:block; margin:0 auto; max-width:100%; height:auto}
figcaption{
  font-size:12.5px; color:var(--faint); margin-top:9px; text-align:center;
  font-family:"Bricolage Grotesque",sans-serif;
}
.d-lbl{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:500}
.d-ttl{font-family:"Bricolage Grotesque",sans-serif; font-size:12px; font-weight:700; letter-spacing:.03em}
.d-sm{font-family:"JetBrains Mono",monospace; font-size:9.5px}

/* ================= drill ================= */
.drill{max-width:720px; margin:0 auto}
.drill-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin-bottom:20px; font-size:13px; color:var(--dim);
}
.drill-bar .qct{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
.pbar{flex:1 1 120px; height:5px; border-radius:3px; background:var(--sunk); overflow:hidden; min-width:90px}
.pbar i{display:block; height:100%; background:var(--accent); transition:width .3s}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:30px 28px; min-height:290px;
  display:flex; flex-direction:column;
}
.card-top{
  display:flex; align-items:center; gap:9px; margin-bottom:18px;
  font-family:"JetBrains Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
}
.box-chip{padding:3px 8px; border-radius:4px; background:var(--sunk); color:var(--dim); font-weight:600}
.cq{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:21px; line-height:1.42; font-weight:400; margin:0 0 20px;
}
.cq code{font-family:"JetBrains Mono",monospace; font-size:17px; background:var(--sunk); padding:2px 6px; border-radius:4px}
.ca{
  font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.65;
  border-top:1px solid var(--line); padding-top:18px; margin-top:auto; color:var(--dim);
}
.ca.hide{display:none}
.ca strong{color:var(--text); font-weight:600}
.ca code{font-family:"JetBrains Mono",monospace; font-size:13.5px; background:var(--sunk); padding:1.5px 5px; border-radius:4px}
.ca ul{margin:9px 0 0; padding-left:20px}
.ca li{margin-bottom:5px}

.reveal{
  margin-top:auto; align-self:flex-start;
  background:var(--accent); color:var(--on-accent); border:0; cursor:pointer;
  font-size:14px; font-weight:600; padding:11px 24px; border-radius:9px; transition:.15s;
}
.reveal:hover{background:var(--accent-2)}
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px}
.grades.hide{display:none}
.gr{
  border:1px solid var(--line); background:var(--surface); cursor:pointer;
  padding:11px 6px; border-radius:9px; transition:.14s;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.gr:hover{border-color:currentColor; background:var(--sunk)}
.gr .gl{font-size:13.5px; font-weight:700}
.gr .gi{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--faint)}
.gr[data-g="again"] .gl{color:var(--g-again)}
.gr[data-g="hard"] .gl{color:var(--g-hard)}
.gr[data-g="good"] .gl{color:var(--g-good)}
.gr[data-g="easy"] .gl{color:var(--g-easy)}

.done-state{
  text-align:center; padding:56px 24px; background:var(--surface);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
}
.done-state h3{font-size:22px; font-weight:700; margin:0 0 9px; letter-spacing:-.02em}
.done-state p{color:var(--dim); margin:0 auto 18px; max-width:44ch; font-size:14.5px}
.done-state .big{font-size:40px; margin-bottom:14px}

.mini{
  border:1px solid var(--line); background:var(--surface); color:var(--dim);
  cursor:pointer; font-size:13px; font-weight:600; padding:9px 18px; border-radius:8px;
}
.mini:hover{color:var(--text); border-color:var(--dim)}

.kbd{
  font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
  padding:1px 5px; background:var(--surface);
}
.hint{margin-top:16px; text-align:center; font-size:12px; color:var(--faint)}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:880px){
  .layout{flex-direction:column}
  .side{
    position:static; width:100%; max-height:none; padding:14px 18px 0;
    display:flex; gap:18px; overflow-x:auto;
  }
  .side-block{flex:none; min-width:200px}
  .side-h+.side-h{margin-top:0}
  .main{padding-top:18px}
}
@media (max-width:520px){
  .grades{grid-template-columns:repeat(2,1fr)}
  .sec{padding:18px 16px}
  .card{padding:22px 18px}
  .cq{font-size:18.5px}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mk">&gt;_</span> Projects Lab</div>
    <span class="due-pill" id="duePill">—</span>
    <div class="modes">
      <button class="mode" data-m="learn" aria-pressed="true">Learn</button>
      <button class="mode" data-m="drill" aria-pressed="false">Drill</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================
   DIAGRAMS — all inline SVG, theme-aware via CSS variables
   ========================================================= */
const C = {
  ink:'var(--text)', dim:'var(--dim)', faint:'var(--faint)',
  line:'var(--dgrid)', fill:'var(--dfill)', fill2:'var(--dfill2)',
  acc:'var(--accent)', good:'var(--good)', crit:'var(--crit)', mod:'var(--mod)',
  surf:'var(--surface)'
};

function svg(w, h, inner){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img">' +
    '<defs>' +
      '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.dim + '"/></marker>' +
      '<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.acc + '"/></marker>' +
      '<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="' + C.crit + '"/></marker>' +
    '</defs>' + inner + '</svg>';
}
function box(x,y,w,h,label,opt){
  opt = opt || {};
  const f = opt.fill || C.surf, s = opt.stroke || C.line, r = opt.r === undefined ? 6 : opt.r;
  const tc = opt.tc || C.ink, dash = opt.dash ? ' stroke-dasharray="4 3"' : '';
  let o = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r +
    '" fill="' + f + '" stroke="' + s + '" stroke-width="1.2"' + dash + '/>';
  if(label){
    const lines = Array.isArray(label) ? label : [label];
    const cls = opt.cls || 'd-lbl';
    const lh = opt.lh || 13;
    const start = y + h/2 - (lines.length-1)*lh/2 + 4;
    lines.forEach((ln,i) => {
      o += '<text x="' + (x+w/2) + '" y="' + (start + i*lh) + '" text-anchor="middle" fill="' +
        tc + '" class="' + cls + '">' + ln + '</text>';
    });
  }
  return o;
}
function txt(x,y,s,opt){
  opt = opt || {};
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (opt.anchor||'start') +
    '" fill="' + (opt.c||C.dim) + '" class="' + (opt.cls||'d-lbl') + '">' + s + '</text>';
}
function line(x1,y1,x2,y2,opt){
  opt = opt || {};
  return '<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" stroke="' + (opt.c||C.line) +
    '" stroke-width="' + (opt.w||1.3) + '"' + (opt.dash?' stroke-dasharray="4 3"':'') +
    (opt.m?' marker-end="url(#' + opt.m + ')"':'') + ' fill="none"/>';
}
function path(d,opt){
  opt = opt || {};
  return '<path d="' + d + '" stroke="' + (opt.c||C.line) + '" stroke-width="' + (opt.w||1.3) +
    '" fill="' + (opt.f||'none') + '"' + (opt.dash?' stroke-dasharray="4 3"':'') +
    (opt.m?' marker-end="url(#' + opt.m + ')"':'') + '/>';
}

const DIAGRAMS = {};
/* =================== MiniLang =================== */
DIAGRAMS.mlPipeline = () => {
  let s = '';
  const st = [['Source', '.ml code'], ['Lexer', 'tokens'], ['Parser', 'AST'], ['Semantic', 'types/scopes'], ['Optimizer', 'fold/DCE'], ['Codegen', 'bytecode'], ['VM', 'run']];
  st.forEach((x, i) => {
    const X = 6 + i * 86;
    const hi = i === 6;
    s += box(X, 22, 76, 50, x, { fill: hi ? C.fill : C.surf, stroke: hi ? C.acc : C.line, tc: hi ? C.acc : C.ink, cls: 'd-sm', lh: 13 });
    if (i < 6) s += line(X + 76, 47, X + 84, 47, { m: 'ar', c: C.dim });
  });
  s += txt(90, 96, '── front end: samajhna ──', { anchor: 'middle', cls: 'd-sm', c: C.faint });
  s += txt(390, 96, '── back end: chalana ──', { anchor: 'middle', cls: 'd-sm', c: C.faint });
  s += path('M560 72 L560 118 L380 118', { c: C.dim, m: 'ar', dash: true });
  s += box(230, 104, 148, 30, 'WebAssembly (browser)', { fill: C.fill2, cls: 'd-sm' });
  s += path('M430 72 L430 150 L378 150', { c: C.dim, m: 'ar', dash: true });
  s += box(230, 138, 148, 26, 'C++ transpiler → g++', { fill: C.fill2, cls: 'd-sm' });
  return svg(612, 172, s);
};

DIAGRAMS.tokens = () => {
  let s = '';

}`, after:`<p>Ye <code>tests/08_pointers.ml</code> hai — dikhne me C++ jaisa, lekin chalta hai MiniLang ke apne compiler + VM pe.</p>`},
{t:`Pipeline`, d:`mlPipeline`, b:`<p>Source → <strong>Lexer</strong> (tokens) → <strong>Parser</strong> (AST) → <strong>Semantic analyzer</strong> (types, scopes) → <strong>Optimizer</strong> (folding, propagation, DCE) → <strong>Codegen</strong> (bytecode) → <strong>VM</strong> (60 opcodes). Wahi C++ code Emscripten se <strong>WebAssembly</strong> ban ke browser IDE me chalta hai. Bonus: <code>minilang compile</code> AST ko C++ me transpile karke <code>g++ -O3</code> se native binary.</p>`},
{t:`4 numbers yaad karo`, b:`<div class="tbl-wrap"><table><tr><th>Number</th><th>Kya</th></tr><tr><td><strong>7,000+</strong></td><td>lines C++17</td></tr><tr><td><strong>13</strong></td><td>precedence levels in parser</td></tr><tr><td><strong>60</strong></td><td>VM opcodes</td></tr><tr><td><strong>14</strong></td><td>end-to-end tests, GitHub Actions CI</td></tr></table></div>`},
{t:`Live demo`, b:`<p><strong>minilang-one.vercel.app</strong> — Monaco editor me code likho, Run karo, ya Debug me ek-ek bytecode instruction step karke stack aur variables dekho. Sab browser me, koi server nahi.</p>`}
],
say:`MiniLang is a compiler and virtual machine I built from scratch in C++17, about seven thousand lines, for a statically typed C++-style language with functions, recursion, pointers and vector, queue and stack containers. Source goes through a lexer, a hand-written recursive-descent parser with 13 precedence levels and panic-mode error recovery, a semantic analyzer with scoped symbol tables and type checking, and an optimizer that does constant folding, propagation and dead-code elimination. The code generator emits bytecode for a stack-based VM with 60 opcodes. The same C++ compiles to WebAssembly, so it runs in a browser IDE with a step-through debugger, and 14 end-to-end tests run in CI.`,

],
steps:[
{t:`Chaar tarike, ek table`, b:`<div class="tbl-wrap"><table><tr><th>Approach</th><th>Kaise</th><th>Example</th><th>MiniLang me?</th></tr><tr><td>Tree-walking interpreter</td><td>AST nodes pe recursion se chalao</td><td>simple scripting</td><td>Nahi</td></tr><tr><td>Bytecode VM</td><td>AST → bytecode → VM loop</td><td>JVM, CPython, Lua</td><td><strong>Haan (main)</strong></td></tr><tr><td>AOT native</td><td>machine code</td><td>g++, rustc</td><td>transpiler ke through</td></tr><tr><td>Transpiler</td><td>language → language</td><td>TypeScript → JS</td><td><strong>Haan</strong> (MiniLang → C++)</td></tr></table></div>`},
{t:`Bytecode VM kyun chuna?`, b:`<ul><li><strong>Tree-walk se fast:</strong> flat instruction array, pointer-chasing kam.</li><li><strong>Portable:</strong> bytecode + VM C++ me → WASM me bhi same chalta.</li><li><strong>Debugger aasaan:</strong> "ek instruction step karo, stack dikhao" natural hai.</li><li>Machine code generate karna (x86 registers, calling conventions) bahut zyada kaam.</li></ul>`},
{t:`Front end vs back end`, b:`<p><strong>Front end</strong> (lexer, parser, semantic) = program ko <em>samajhna</em>. <strong>Back end</strong> (optimizer, codegen, VM) = program ko <em>chalana</em>. Beech ka common language = <strong>AST</strong>. Isi wajah se ek hi AST se bytecode bhi bana aur C++ transpile bhi hua.</p>`}
],
say:`A tree-walking interpreter executes the syntax tree directly, an ahead-of-time compiler produces machine code, a transpiler turns one high-level language into another, and a bytecode VM compiles to a compact instruction set that a virtual machine runs. MiniLang's main path is a bytecode VM, like CPython or Lua: it's faster than walking the tree, portable enough to compile to WebAssembly unchanged, and it makes a step-by-step debugger natural. Because everything shares one AST, I could also add a transpiler that emits C++ and builds a native binary with g++.`,
hook:`Tree-walk = AST pe chalao. Bytecode VM = flat instructions (MiniLang). Transpiler = MiniLang → C++ → g++.`,
check:[
[`Python kis category me?`,`Bytecode VM (CPython).`],
[`AST front end aur back end ke beech kyun important?`,`Ek hi AST se kai back ends (bytecode, C++ transpile) ban sakte hain.`]
]
},
{
h:`Lexer: characters se tokens`,
words:[
[`Token`,`Meaningful tukda + type: keyword, identifier, number, operator.`],
[`Lexeme`,`Token ka asli text, jaise <code>total</code>.`],

steps:[

{t:`Lexer loop kaise chalta hai`, b:`<ol><li><code>peek()</code> se current character dekho.</li><li>Whitespace/newline → skip (newline pe <code>line++</code>, <code>column = 1</code>).</li><li>Digit → poora number padho (int ya float).</li><li>Letter/_ → poora word padho → keyword table me hai? (<code>int</code>, <code>while</code>, <code>return</code>...) → keyword token, warna IDENT.</li><li><code>"</code> → string literal.</li><li>Operator → do-character check pehle: <code>&gt;</code> ke baad <code>=</code>? → <code>GREATER_EQUAL</code>; <code>&gt;</code> ke baad <code>&gt;</code>? → <code>GREATER_GREATER</code>.</li><li>Kuch samajh na aaye → <code>TOKEN_ERROR</code> with line/column.</li></ol>`},

{t:`Tricky case: <code>&gt;&gt;</code>`, b:`<p><code>x &gt;&gt; 2</code> me <code>&gt;&gt;</code> shift operator hai. Lekin <code>vector&lt;vector&lt;int&gt;&gt;</code> me wahi <code>&gt;&gt;</code> <strong>do closing brackets</strong> hain. Lexer ko context nahi pata, woh <code>GREATER_GREATER</code> deta hai. <strong>Parser</strong> type padhte waqt (flag <code>allow_split_greater_greater_</code>) us token ko do <code>&gt;</code> maan leta hai. (C++ compilers ko bhi yahi karna padta hai.)</p>`}
],
say:`The lexer turns characters into tokens with a type, the lexeme, and a line and column for error messages. It skips whitespace, comments and preprocessor lines like #include, reads numbers, identifiers and strings, checks identifiers against a keyword table, and uses maximal munch so greater-or-equal is one token. One subtle case is the shift operator versus nested generics like vector of vector of int: the lexer can't know the context, so it emits a shift token and the parser splits it into two closing angle brackets when it's parsing a type.`,
hook:`Characters → tokens (+line/col). Maximal munch. # line skip. >> ko parser type context me split karta hai.`,
check:[
[`"a>=b" me kitne tokens?`,`3: IDENT, GREATER_EQUAL, IDENT.`],
[`vector<vector<int>> ka >> kaun handle karta hai?`,`Parser — type context me GREATER_GREATER ko do > me split.`]

},
{
h:`Parser: grammar, precedence aur recursive descent`,

[`Precedence`,`Kaunsa operator pehle bandhega: <code>*</code> &gt; <code>+</code>.`],
[`Associativity`,`Same level pe left se ya right se: <code>a - b - c</code> = <code>(a - b) - c</code>.`],

{t:`13 levels ki seedhi`, d:`precedence`},
{t:`Ek level ka code (sab levels isi pattern pe)`, code:`
ExprPtr Parser::parse_term() {                  // + -
    ExprPtr expr = parse_factor();               // pehle higher level (* / %)
    while (match(TokenType::PLUS) || match(TokenType::MINUS)) {
        TokenType op = previous().type;
        ExprPtr right = parse_factor();
        expr = make_binary(previous().line, op, std::move(expr), std::move(right));
    }
    return expr;
}`, after:`<ul><li><strong>Higher level pehle call</strong> → <code>*</code> ke operands pehle ban jaate hain → precedence apne aap sahi.</li><li><strong>while loop</strong> → <code>1 - 2 - 3</code> = <code>(1 - 2) - 3</code> → <strong>left-associative</strong>.</li></ul>`},
{t:`Walkthrough: 1 + 2 * 3`, b:`<ol><li><code>parse_term</code> → <code>parse_factor</code> → ... → primary: <strong>1</strong>.</li><li>factor me <code>*</code> nahi (agla token <code>+</code>) → 1 wapas term tak.</li><li>term me <code>+</code> match → right ke liye <code>parse_factor</code>.</li><li>factor: primary <strong>2</strong>, phir <code>*</code> match → primary <strong>3</strong> → <code>Binary(*, 2, 3)</code>.</li><li>term: <code>Binary(+, 1, Binary(*, 2, 3))</code> ✓</li></ol>`},
{t:`Assignment right-associative`, code:`
ExprPtr Parser::parse_expression() {
    ExprPtr expr = parse_ternary();
    if (match(TokenType::EQUAL)) {
        ExprPtr value = parse_expression();      // recursion → a = (b = c)
        return make_assign(line, std::move(expr), std::move(value));
    }
    // += -= *= /= %= → compound assign, same idea
    return expr;
}`, after:`<p>Loop nahi, <strong>recursion</strong> → <code>a = b = c</code> = <code>a = (b = c)</code>. Ternary <code>c ? x : y</code> bhi apna level hai.</p>`},
{t:`Parser generator (yacc/ANTLR) kyun nahi?`, b:`<ul><li>Hand-written = <strong>error messages aur recovery</strong> pe full control.</li><li>C++ quirks (<code>&gt;&gt;</code> split) aasaani se.</li><li>Debug karna aasaan — normal C++ functions.</li><li>Trade-off: grammar badi ho to zyada code.</li></ul>`}
],
say:`The parser is hand-written recursive descent. Each of the 13 precedence levels — from assignment and ternary down through logical, bitwise, equality, comparison, shift, additive, multiplicative, unary, call and primary — is a function that first calls the next tighter level for its operands, so precedence falls out naturally. A while loop inside each level builds left-associative trees, so one minus two minus three groups from the left, while assignment calls parse_expression recursively on its right side, making it right-associative. I chose hand-written parsing over a generator for control over error messages and recovery and to handle C++-style quirks.`,
hook:`Level function → pehle tighter level call → while = left-assoc, recursion = right-assoc.`,

[`Naya operator ** (power) add karna ho to?`,`Unary aur factor ke beech naya level function; right-associative ke liye recursion.`]
]
},

{t:`Tree ka shape`, d:`ast`},
{t:`Nodes kaise banaye`, code:`
using ExprPtr = std::unique_ptr<Expr>;

struct LiteralIntExpr { int64_t value; };
struct BinaryExpr     { TokenType op; ExprPtr left; ExprPtr right; };
struct VarRefExpr     { std::string name; };
struct AssignExpr     { ExprPtr lhs; ExprPtr value; };
struct CallExpr       { std::string callee; std::vector<ExprPtr> args; };
// ... more node structs

using ExprNode = std::variant<LiteralIntExpr, BinaryExpr, VarRefExpr, AssignExpr, CallExpr /* , ... */>;
struct Expr { ExprNode node; int line; };`},
{t:`Nodes pe kaam: std::visit`, code:`
std::visit([&](auto&& arg) {
    using T = std::decay_t<decltype(arg)>;
    if constexpr (std::is_same_v<T, BinaryExpr>)      { /* ... */ }
    else if constexpr (std::is_same_v<T, VarRefExpr>) { /* ... */ }
}, expr->node);`},
{t:`Variant vs inheritance (classic OOP)`, b:`<div class="tbl-wrap"><table><tr><th></th><th>std::variant</th><th>Base class + virtual</th></tr><tr><td>Memory</td><td>node inline, heap alloc kam</td><td>har node alag heap object</td></tr><tr><td>Naya pass (optimizer, codegen)</td><td>aasaan: ek aur visit</td><td>har class me virtual method ya Visitor pattern</td></tr><tr><td>Naya node type</td><td>saare visits update (compiler yaad dilata)</td><td>ek class add</td></tr></table></div><p>Compiler me node types kam badalte hain, passes zyada → variant fit.</p>`},
{t:`Ownership`, b:`<p>Har parent apne children ka <strong>unique_ptr</strong> se maalik. Root (statements vector) scope se bahar → poora tree apne aap free (RAII). Optimizer nodes <strong>move</strong> karke replace karta hai (<code>optimize_expr(std::move(a))</code>) — copy nahi.</p>`}
],
say:`AST nodes are structs held in a std::variant, with child nodes owned through unique_ptr, so the whole tree is freed automatically when the root goes out of scope. Passes like semantic analysis, optimisation and code generation use std::visit to dispatch on the node type. I chose variant over a class hierarchy because a compiler adds passes more often than node types: each pass is just another visit, and the compiler checks that I handle every alternative. The optimiser rewrites the tree by moving nodes rather than copying them.`,
hook:`variant = node types, unique_ptr = ownership (RAII), std::visit = har pass.`,

words:[
[`Syntax error`,`Code grammar tod raha hai, jaise missing semicolon.`],

{t:`Problem`, b:`<p>Pehli error pe ruk jao to user ko ek-ek karke errors theek karne padenge. Chalte raho to ek galti se 20 fake errors. Beech ka raasta: <strong>panic mode</strong>.</p>`},
{t:`synchronize() ka code`, code:`
void Parser::synchronize() {
    advance();
    while (!is_at_end()) {
        if (previous().type == TokenType::SEMICOLON) return;   // statement khatam
        switch (peek().type) {
            case TokenType::KW_FN:   case TokenType::KW_LET:  case TokenType::KW_IF:
            case TokenType::KW_WHILE: case TokenType::KW_FOR: case TokenType::KW_RETURN:
            case TokenType::KW_PRINT: case TokenType::KW_STRUCT: case TokenType::KW_ENUM:
            case TokenType::KW_SWITCH: case TokenType::KW_DO: case TokenType::KW_CONST:
                return;                                          // naya statement shuru
            default: advance();                                  // skip
        }
    }
}`},
{t:`Example`, code:`
int main() {
    int a = 10          // ; missing
    int b = ;           // expression missing
    return a + b;
}`, after:`<ol><li><code>int a = 10</code> ke baad <code>;</code> expected → error (line 2, column) → synchronize → tokens skip jab tak <code>;</code> ya statement keyword.</li><li>Agle statement se parsing wapas → <code>int b = ;</code> pe doosri <strong>real</strong> error.</li><li>Ek run me dono errors, fake cascade nahi.</li></ol>`},
{t:`Error message format`, b:`<p>ErrorReporter source line dikhata hai + line/column + message, jaise <code>Expected ';' after variable declaration at 'int'</code>. Browser IDE me yahi text output panel me.</p>`}
],
say:`When the parser hits a syntax error it reports it with line and column, then enters panic mode: synchronize skips tokens until it passes a semicolon or sees a keyword that starts a new statement, such as if, while, return or const, and parsing resumes there. That lets one run report several independent errors without a cascade of bogus ones caused by the first mistake.`,

]

],
cards:[
{q:`Walk me through MiniLang's architecture.`, s:`Lexer → recursive-descent parser (13 levels, panic mode) → semantic (scopes, types) → optimizer (fold/propagate/DCE) → codegen → 60-opcode stack VM → WASM IDE; + C++ transpiler.`, a:`A lexer produces tokens, a recursive-descent parser builds an AST, a semantic analyzer checks scopes and types, an optimizer folds constants and removes dead code, and a code generator emits bytecode for a 60-opcode stack VM. The same C++ compiles to WebAssembly for a browser IDE with a debugger, and a transpiler can also emit C++ for a native build.`},
{q:`Compiler vs interpreter vs bytecode VM?`, s:`Interpreter AST seedha chalata. AOT compiler machine code. Bytecode VM: compile → bytecode → VM loop (JVM/CPython). MiniLang = bytecode VM.`, a:`An interpreter executes source or the syntax tree directly, an ahead-of-time compiler produces machine code, and a bytecode VM compiles to a compact instruction set run by a virtual machine, like the JVM or CPython. MiniLang uses a bytecode VM.`},
{q:`Why a bytecode VM instead of a tree-walking interpreter?`, s:`Flat instructions → fast; portable → WASM; debugger step natural; native codegen se kam kaam.`, a:`A flat bytecode array is faster to execute than walking pointers through a tree, it's portable enough to compile to WebAssembly unchanged, and it makes a step-by-step debugger natural — with far less work than generating native machine code.`},
{q:`What does the lexer do? What's maximal munch?`, s:`Characters → tokens + line/col, keywords table, comments/# skip. Maximal munch: >= ek token.`, a:`It scans characters into typed tokens with line and column, recognising keywords, identifiers, numbers, strings and operators, and skipping whitespace, comments and preprocessor lines. Maximal munch means taking the longest valid token, so greater-or-equal is one token, not two.`},
{q:`How do you handle '>>' in vector<vector<int>>?`, s:`Lexer GREATER_GREATER deta; parser type context me use do > me split karta.`, a:`The lexer can't know context, so it emits a shift token. When the parser is reading a type, it's allowed to split that token into two closing angle brackets — the same trick C++ compilers use.`},
{q:`How does your parser handle precedence and associativity?`, s:`13 level functions; har function pehle tighter level call; while loop = left-assoc; assignment recursion = right-assoc.`, a:`Each of the 13 precedence levels is a function that calls the next tighter level for its operands, so tighter operators bind first. A loop within each level makes binary operators left-associative, and assignment recurses on its right side, making it right-associative.`},
{q:`Parse 1 + 2 * 3 step by step.`, s:`term → factor → 1; + match; factor → 2, * match, 3 → Binary(*,2,3); result Binary(+,1,Binary(*,2,3)).`, a:`parse_term asks parse_factor for the left operand, which returns 1 because the next token is plus. parse_term matches plus and calls parse_factor again, which reads 2, matches star, reads 3 and returns 2 times 3. The result is 1 plus the product.`},
{q:`Why hand-write the parser instead of using a generator?`, s:`Error messages + recovery control, C++ quirks, debug aasaan. Trade-off: zyada code.`, a:`Hand-written recursive descent gives full control over error messages and recovery, handles C++-style quirks like splitting shift tokens, and is easy to debug as ordinary functions. The trade-off is more code as the grammar grows.`},
{q:`How is the AST represented?`, s:`Node structs std::variant me, children unique_ptr (RAII free), passes std::visit.`, a:`Each node kind is a struct inside a std::variant, children are owned by unique_ptr so the tree frees itself, and every pass — semantic analysis, optimisation, codegen — dispatches with std::visit.`},
{q:`Why std::variant instead of a class hierarchy for AST nodes?`, s:`Passes zyada, node types kam badalte. Naya pass = ek visit; compiler missing cases pakadta; heap allocs kam.`, a:`Compilers add passes more often than node types. With variant, a new pass is just another visit and the compiler flags unhandled alternatives, with fewer allocations. A hierarchy makes adding node types easy but every pass needs virtual methods or a visitor.`},
{q:`What happens on a syntax error?`, s:`Report line/col → synchronize: skip till ; ya statement keyword → continue → kai real errors, cascade nahi.`, a:`The parser reports the error with line and column, then synchronize skips tokens until a semicolon or a statement-starting keyword, and parsing continues. One run reports multiple independent errors without a cascade caused by the first one.`}
]
});

void SemanticAnalyzer::define(const std::string& name, DataType type, int line) {
    auto& current_scope = scopes_.back();
    if (current_scope.find(name) != current_scope.end())
        error("Redefinition of variable '" + name + "' in same scope");
    current_scope[name] = Symbol{name, type, (int)scopes_.size() - 1};
}

std::optional<Symbol> SemanticAnalyzer::lookup(const std::string& name) {
    for (auto it = scopes_.rbegin(); it != scopes_.rend(); ++it)   // andar se bahar
        if (auto f = it->find(name); f != it->end()) return f->second;
    return std::nullopt;                                           // undefined
}`},

case TokenType::PLUS:
    if ((r_val > 0 && l_val > INT64_MAX - r_val) ||

    return make_int_literal(expr->line, l_val + r_val);

case TokenType::SLASH:
    if (r_val != 0) {
        if (l_val == INT64_MIN && r_val == -1) break;   // overflow

    break;                                       // /0 → runtime error rehne do`},
{t:`Math samjho: overflow check`, b:`<p><code>l + r &gt; MAX</code> check karne ke liye <code>l + r</code> compute nahi kar sakte (wahi overflow!). Rearrange: <code>l &gt; MAX − r</code> (jab r &gt; 0). <code>MAX − r</code> kabhi overflow nahi hota. Same trick minus, multiply (division se) ke liye.</p><p><code>INT64_MIN / −1</code> = +9.22×10¹⁸ jo MAX se 1 zyada → overflow. <code>-INT64_MIN</code> negation bhi guard.</p>`},

say:`Constant folding evaluates expressions with literal operands at compile time, bottom-up, so five plus ten times two becomes twenty-five, including float, boolean, string concatenation, unary, ternary and cast expressions. The optimizer itself is C++, so folding an overflowing int64 expression would be undefined behavior in the compiler. Before folding I check overflow without computing it — for addition, left greater than INT64_MAX minus right — and I skip division by zero and INT64_MIN divided by minus one. Those stay in the bytecode so the program still produces its runtime error: optimisation must never change behaviour.`,

say:`The browser IDE runs the same compiler and VM compiled to WebAssembly with Emscripten. JavaScript calls exported C functions through Module.ccall — compile, run, and debugger calls to start, step and read the stack, variables and current bytecode — and Monaco provides the editor, so everything runs client-side. Fourteen golden tests compare program output with expected files in GitHub Actions. One bug I fixed: the deployed wasm predated the optimizer, so constant folding failed only in the browser; I added a CI workflow that rebuilds wasm in a pinned Emscripten container, verified all 14 tests through wasm in Node, and made the debugger reuse the real disassembler. A remaining limitation is that runs happen on the main thread, so an infinite loop freezes the tab — a Web Worker with an instruction budget would fix it.`,
hook:`em++ → .wasm; JS ccall exports. 14 golden tests in CI. Stale wasm bug → CI rebuild. Infinite loop = tab freeze (worker fix).`,

{
h:`Tough questions + honest limitations`,

{t:`"What was the hardest part?"`, b:`<p>Achha answer: <strong>function calls + stack layout</strong> (base pointer, args as locals, return value landing in the right slot) ya <strong>overflow-safe folding</strong>. Ek specific cheez chuno aur detail me samjhao — generic "sab mushkil tha" mat bolo.</p>`},
{t:`Limitations list (ready)`, b:`<div class="tbl-wrap"><table><tr><th>Limitation</th><th>Fix</th></tr><tr><td>Stale pointer detect nahi</td><td>frame generation tags</td></tr><tr><td>Runtime int overflow check nahi (C++ UB)</td><td><code>__builtin_add_overflow</code> etc.</td></tr><tr><td>Recursion depth limit nahi</td><td>max frames → "stack overflow" runtime error</td></tr><tr><td>Infinite loop tab freeze</td><td>Web Worker + instruction budget</td></tr><tr><td>Array copy = share</td><td>copy-on-assign / copy-on-write</td></tr><tr><td>16-bit jumps/constants</td><td>wide operands</td></tr><tr><td>Performance measured nahi</td><td>benchmarks, computed goto</td></tr><tr><td>Sirf end-to-end tests</td><td>lexer/parser unit tests, fuzzing, error-message tests</td></tr></table></div>`},

say:`The honest limits are: pointers can't detect a stale slot, integer overflow isn't checked at runtime, there's no recursion depth limit, the browser run can freeze on an infinite loop, copying an array shares it, jump targets are 16-bit, I haven't benchmarked performance, and tests are end-to-end only. For each I know the fix — generation-tagged pointers, checked arithmetic, a frame limit, a Web Worker with an instruction budget, copy-on-write arrays, wider operands, benchmarks with computed-goto dispatch, and unit tests plus fuzzing. The part I found hardest and most interesting was the call-frame layout, where arguments become the callee's locals and the return value lands in the caller's slot.`,
hook:`Limits + fix pair me bolo. Hardest part = ek specific cheez (call frames / safe folding).`,

}
],
cards:[
{q:`How is bytecode encoded in MiniLang?`, s:`1-byte opcode + 16-bit big-endian operands (constant index, slot, jump target). Chunk = code + constants + lines.`, a:`Each function is a chunk with a byte array, a constant pool and per-byte line numbers. Instructions are a one-byte opcode followed by 16-bit big-endian operands such as constant indexes, local slots or jump targets.`},
{q:`How are local variables stored?`, s:`Stack slots. Declaration ki pushed value hi slot. LOAD_LOCAL n = stack[base + n]. Block end POP.`, a:`As stack slots relative to the frame's base pointer. Declaring a variable pushes its initial value, which becomes the slot; LOAD_LOCAL and STORE_LOCAL index base plus slot, and leaving a block pops its locals.`},
{q:`How do you compile a while loop?`, s:`loop_start; cond; JUMP_IF_FALSE placeholder; body; JUMP loop_start; patch exit; break→exit, continue→start.`, a:`Record the loop start, compile the condition, emit JUMP_IF_FALSE with a placeholder, compile the body, jump back to the start, then patch the placeholder to the current offset. Break jumps are patched to the exit and continue jumps to the start.`},
{q:`What is backpatching?`, s:`Forward jump ka target pata nahi → 0xFFFF placeholder, offset yaad; baad me real target likho.`, a:`When emitting a forward jump, the target isn't known yet, so you write a placeholder, remember its offset, and fill in the real address once the code after it has been generated.`},
{q:`How do function calls work in your VM?`, s:`CALL: frame {fn_index, ip 0, base = size − argc}; args = locals. RETURN: pop result, pop frame, resize(base), push result.`, a:`Arguments are pushed, then CALL pushes a frame with the function index, ip zero and a base pointer equal to stack size minus argument count, so the arguments become the callee's first locals. RETURN pops the result, pops the frame, truncates the stack to the base and pushes the result for the caller.`},
{q:`What does a Value look like in the VM?`, s:`std::variant<int64, double, bool, string, PointerValue(stack index), shared_ptr<vector<Value>>>.`, a:`A std::variant of int64, double, bool, string, a pointer that stores a stack index, and an array held by shared_ptr to a vector of values.`},
{q:`How are pointers implemented and what can go wrong?`, s:`Pointer = stack index. LOAD/STORE_DEREF bounds check. Stale slot (reused after return) detect nahi → generation tag fix.`, a:`A pointer is a stack index; dereferencing checks it's in bounds. It can't detect a stale pointer into a slot reused after the function returned — tagging pointers with a frame generation would fix that.`},
{q:`Stack VM vs register VM?`, s:`Stack: simple compiler, chhote instructions, zyada push/pop. Register: kam instructions, faster, register allocation chahiye.`, a:`A stack VM has a simpler compiler and compact instructions but more push and pop work. A register VM, like Lua's, executes fewer instructions and is usually faster but needs register allocation.`},
{q:`How does the browser IDE run C++ code?`, s:`Emscripten em++ → wasm + JS glue. JS Module.ccall exported functions (compile, run, debug_step, stack...). Monaco editor. Client-side.`, a:`Emscripten compiles the compiler and VM to WebAssembly. JavaScript calls exported C functions through Module.ccall — compile, run, step the debugger and read the stack, variables and bytecode — with Monaco as the editor, all client-side.`},
{q:`How is MiniLang tested?`, s:`14 golden end-to-end tests (.ml vs .expected, exit 0) via run_tests.sh in GitHub Actions. Missing: unit tests, fuzzing.`, a:`Fourteen end-to-end golden tests run each program and compare stdout with an expected file, in GitHub Actions. I'd add lexer and parser unit tests, error-message tests and fuzzing.`},
{q:`Tell me about a bug you fixed in MiniLang.`, s:`Live IDE me folding test fail + debugger crash → committed wasm optimizer se purana → CI me pinned emsdk rebuild, 14/14 via WASM, debugger disassembler reuse.`, a:`Constant folding failed and the debugger crashed only in the live IDE. The committed wasm predated the optimizer. I added a CI workflow that rebuilds wasm in a pinned Emscripten container, verified all 14 tests through wasm in Node, and made the debugger reuse the real disassembler.`},
{q:`What are MiniLang's main limitations?`, s:`Stale pointers, no runtime overflow check, no recursion limit, main-thread freeze, array copy shares, 16-bit jumps, no benchmarks, only e2e tests.`, a:`Stale pointers aren't detected, runtime integer overflow isn't checked, recursion has no depth limit, an infinite loop freezes the browser tab, array copies share storage, jumps are 16-bit, performance isn't benchmarked, and tests are end-to-end only — each with a known fix.`},
{q:`How would you stop an infinite loop from freezing the IDE?`, s:`Web Worker me run + instruction budget/cancel; main thread free.`, a:`Run the VM in a Web Worker so the page stays responsive, and add an instruction budget that yields or lets the user cancel after a set number of steps.`}
]
});

func (lb *LoadBalancer) selectBackendExcluding(tried map[*Backend]bool) *Backend {
    n := len(lb.backends)
    startIdx := int(lb.currIndex.Add(1))        // har call pe start aage

    var bestLoad int64

        b := lb.backends[(startIdx+i)%n]
        if tried[b] { continue }               // is request ke liye try ho chuka
        load := b.InFlight.Load()
        if !b.Alive.Load() {
            load += 1 << 20                    // down: last resort
        }
        if best == nil || load < bestLoad {    // strictly less → pehla min jeetta
            best, bestLoad = b, load
        }
    }
    return best
}`},

say:`Containers enforce limits through Linux cgroups. Here each container had memory.max of 512 MiB and cpu.max of exactly one CPU. Everything counts toward that memory limit — the Go heap, goroutine stacks, and kernel socket buffers for every TCP connection, which Go's own heap profiling doesn't show. When the limit is exceeded the kernel's OOM killer sends SIGKILL, so the process dies with no panic or log line. The evidence lives in the cgroup's memory.events file, which counts limit hits and OOM kills, and you have to read it inside the container because a dev machine without the limit never reproduces it.`,

{t:`GOGC ka math`, b:`<p>Live heap = 100 MB.</p><ul><li><code>GOGC=100</code> → GC tab jab heap ~<strong>200 MB</strong>.</li><li><code>GOGC=400</code> → ~<strong>500 MB</strong> (512 MiB container me khatarnaak!).</li><li><code>GOGC=80</code> → ~<strong>180 MB</strong>.</li></ul><p>Kam GOGC = kam peak memory, lekin GC zyada baar = zyada CPU (aur yahan sirf 1 CPU).</p>`},
{t:`GOMEMLIMIT kyun zaroori`, b:`<p>GOGC sirf "relative" hai — container limit ka pata nahi. <code>GOMEMLIMIT=240MiB</code> (LB) bolta hai: "is total ke paas aao to GC aggressive karo". Limit <strong>512 se kaafi neeche</strong> rakha kyunki kernel socket buffers aur baaki overhead Go ke hisaab se bahar hain.</p><div class="tbl-wrap"><table><tr><th>Process</th><th>GOMAXPROCS</th><th>GOMEMLIMIT</th><th>GOGC</th></tr><tr><td>Load balancer</td><td>1</td><td>240MiB</td><td>80</td></tr><tr><td>Backends</td><td>1</td><td>256MiB</td><td>80</td></tr></table></div><p>(Final README config.) <code>GOMAXPROCS=1</code> kyunki container me exactly 1 CPU.</p>`},
{t:`sync.Pool: garbage hi kam banao`, code:`
// BEFORE: har request pe naya slice → garbage
body, _ := io.ReadAll(r.Body)

// AFTER: pool se buffer lo, kaam ke baad wapas
bodyBuf := bodyPool.Get().(*[]byte)
defer bodyPool.Put(bodyBuf)
b, err := readAllInto((*bodyBuf)[:0], io.LimitReader(r.Body, maxRetryBody+1))`, after:`<p>Hazaaron requests/sec × naya buffer = allocation rate itna ki GC peeche reh jaata, heap limit tak phool jaata. Pool se buffers reuse → allocation rate aur peak heap dono kam.</p>`}
],
say:`Go's garbage collector runs when the heap grows by GOGC percent over the live heap — at the default of 100, a 100 MB live heap can reach 200 MB before collection, and a high GOGC like 400 is dangerous in a 512 MiB container. GOGC knows nothing about container limits, so GOMEMLIMIT gives the runtime a soft budget and it collects more aggressively near it; I set it well below 512 MiB because kernel socket buffers also count against the container. The other lever is producing less garbage: sync.Pool reuses request buffers instead of allocating one per request. Lower GOGC costs CPU, which matters on a single core, so I combined a moderate GOGC with a memory limit.`,
hook:`GOGC=100 → heap 2× live. GOMEMLIMIT = soft budget (512 se neeche, sockets ke liye jagah). sync.Pool = garbage kam.`,

{

{t:`2. Inference`, b:`<p>Overload hota to latency badhti aur <strong>timeouts</strong> aate. Instant failures + fast successes = kuch moments pe <strong>koi listen hi nahi kar raha</strong> → process mar raha/restart ho raha.</p>`, d:`oomLoop`},

{t:`4. Kyun chhupa raha`, b:`<p>Correctness metric (feed integrity) <strong>100%</strong> dikhta tha — kyunki backends restart pe Postgres se feed rebuild kar lete the. <strong>Green metric ne crash mask kar diya.</strong> Isliye "sab theek dikh raha" pe bharosa nahi kiya, error pattern follow kiya.</p>`},

say:`The pattern mattered more than the number. About 18% of requests failed, but successful requests were fast, errors clustered in the first seconds of each load stage, and there were zero timeouts. Overload would have produced slow responses and timeouts; instant failures meant nothing was listening at those moments. Reading memory.events inside the load balancer's container showed 121 OOM kills, and the supervisor waited a full second before restarting, so every kill meant a second of refused connections, triggered by connection bursts at stage starts. It had stayed hidden because feed integrity still read 100% — backends rebuilt their feeds from Postgres after restarts. I also found the backends copying the entire feed under the write lock on every feed request.`,

{t:`Verification`, b:`<ul><li><strong>Do graded runs back to back</strong> (bina reset): static ladder + breakpoint ramp = <strong>60,000 requests</strong>, 2,500 users tak.</li><li>Errors: <strong>0</strong>.</li><li><code>memory.events</code>: <strong>koi naya oom_kill nahi</strong>.</li><li>LB peak memory: <strong>364 MB of 512</strong>.</li><li>Teeno backends ka feed identical: <strong>57,490 messages</strong>, dropped = 0.</li></ul>`},

],
say:`The fixes all targeted memory. Request bodies went into pooled buffers, the outbound connection pool shrank from 600 sockets at 8 KiB buffers per backend to 512 at 4 KiB, saving about 17 MiB of resident memory, the latency sample reservoir dropped from 200,000 to 8,192, warmup connections went from 256 to 64, every node got GOMEMLIMIT with GOGC 80, and backends reused a fresh feed snapshot instead of copying the whole feed per request. As defence in depth, the restart delay went from one second to 50 milliseconds. Two back-to-back graded runs then had zero errors over 60,000 requests up to 2,500 users, no new OOM kills, peak load-balancer memory of 364 of 512 MB, and identical 57,490-message feeds on all three backends.`,
hook:`Pool bodies · 3×512@4KiB (~17 MiB) · samples 8,192 · warmup 64 · GOMEMLIMIT+GOGC 80 · snapshotFresh · restart 50 ms → 0/60,000, 364/512 MB, 57,490 feed.`,
check:[

{t:`"3 backends se throughput kyun nahi badha?"`, b:`<p><strong>Honest answer:</strong> 1 → 3 backends pe throughput ~flat (~500 req/s). Matlab bottleneck backends nahi — <strong>single-CPU load balancer</strong> (ya load generator/client pacing) hai. Load balancing ka fayda tab dikhega jab backends saturate hon. Next: LB ka CPU profile (<code>pprof</code>), LB ko zyada CPU / multiple LB instances.</p>`},
{t:`"LB single point of failure hai?"`, b:`<p>Haan. Fix: <strong>2+ LB instances</strong> + floating virtual IP (keepalived/VRRP) ya DNS/cloud LB aage. LB ki state (health, counters) local hai, har instance khud rebuild kar leta. Postgres bhi SPOF → streaming replica + failover.</p>`},

cards:[
{q:`Tell me about the hardest bug you debugged.`, s:`18% errors; fast successes, clustered at stage start, 0 timeouts → refusals → memory.events oom_kill 121, sleep 1 s restart; feed 100% masked it → memory fixes → 0/60,000.`, a:`Under graded load my Go load balancer failed about 18% of requests. Successful requests were fast, errors clustered at the start of each load stage and there were no timeouts, which pointed to refused connections rather than overload. The container's memory.events showed 121 OOM kills, and the supervisor waited a second before restarting. Feed integrity still looked perfect because backends rebuilt from Postgres, which had masked it. I cut memory with pooled buffers, smaller connection buffers, bounded samples, GOMEMLIMIT and GOGC, and snapshot caching, and got zero errors over 60,000 requests at up to 2,500 users.`},
{q:`What is a cgroup and how did you use it to debug?`, s:`Linux resource limits for containers. memory.max 512 MiB, cpu.max 1 CPU; memory.events oom_kill count = proof.`, a:`Cgroups are the Linux mechanism containers use to limit resources. Reading memory.max and cpu.max confirmed 512 MiB and one CPU, and memory.events counted limit hits and 121 OOM kills, which proved the process was being killed.`},
{q:`Why did zero timeouts matter?`, s:`Overload → slow + timeouts. Instant failures + fast successes → koi listen nahi → process dead.`, a:`Overload would have produced slow responses and timeouts. Instant failures alongside fast successful requests meant nothing was listening at those moments — the process was dying and restarting.`},
{q:`What counts toward a container's memory limit?`, s:`Go heap, stacks, runtime, kernel socket buffers (pprof me nahi), page cache.`, a:`Everything the cgroup charges: the Go heap, goroutine stacks and runtime overhead, kernel socket buffers for every connection — which Go's heap profile doesn't show — and page cache.`},
{q:`Explain GOGC and GOMEMLIMIT.`, s:`GOGC: heap live se kitna % badhe tab GC (100 = 2×). GOMEMLIMIT: soft total budget, paas aane pe aggressive GC.`, a:`GOGC sets how much the heap may grow over the live heap before a collection — 100 means it can double. GOMEMLIMIT is a soft total memory budget; near it the runtime collects more aggressively, which is what makes Go respect container limits.`},
{q:`Why set GOMEMLIMIT well below 512 MiB?`, s:`Kernel socket buffers + non-heap overhead container me ginte; Go unhe manage nahi karta. LB 240MiB.`, a:`Kernel socket buffers and other non-heap memory also count against the container but aren't controlled by the Go runtime, so the heap budget — 240 MiB for the load balancer — leaves room for them.`},
{q:`How does sync.Pool reduce memory pressure?`, s:`Har request naya buffer = high allocation rate → GC peeche → heap spike. Pool reuse → allocations kam.`, a:`Allocating a new buffer per request creates garbage faster than the collector reclaims it under load, inflating the heap. A pool reuses buffers across requests, cutting the allocation rate and peak heap.`},
{q:`List the memory fixes you made.`, s:`Pool bodies; conn pool 3×600@8KiB → 3×512@4KiB (~17 MiB); samples 200k → 8,192; warmup 256 → 64; GOMEMLIMIT + GOGC 80; snapshotFresh; restart 1 s → 50 ms.`, a:`Pooled request buffers, a smaller outbound connection pool with 4 KiB buffers saving about 17 MiB, a latency reservoir cut from 200,000 to 8,192 samples, fewer warmup connections, GOMEMLIMIT with GOGC 80 on every node, and cached feed snapshots on the backends — plus a 50-millisecond restart delay as defence in depth.`},
{q:`Isn't shortening the restart delay just hiding crashes?`, s:`Asli fix memory (zero new oom_kill). Delay sirf defense in depth.`, a:`It would be if that were the fix. The real fix was memory reduction — verified by zero new OOM kills — and the shorter delay only limits the impact if a crash ever happens again.`},
{q:`How did you verify the fix?`, s:`2 graded runs back-to-back, 60,000 requests to 2,500 users: 0 errors, no new oom_kill, LB peak 364/512 MB, 3 backends same 57,490 feed.`, a:`Two back-to-back graded runs totalling 60,000 requests up to 2,500 users had zero errors, no new OOM kills, a peak load-balancer memory of 364 of 512 MB, and all three backends reporting the same 57,490-message feed.`},
{q:`Why didn't adding backends increase throughput in your benchmarks?`, s:`~500 rps flat 1 vs 3 backends → single-CPU LB (ya client) bottleneck. Next: pprof.`, a:`Throughput stayed around 500 requests per second with one or three backends, so the single-CPU load balancer or client pacing was the bottleneck, not backend capacity. The next step would be profiling the load balancer.`},
{q:`How would you remove single points of failure?`, s:`Multiple LBs + floating VIP (keepalived/VRRP) / DNS / cloud LB; Postgres replica + failover.`, a:`Run multiple load balancers behind a floating virtual IP with keepalived, or behind DNS or a cloud load balancer, and add a PostgreSQL streaming replica with failover.`},
{q:`How would you scale to 10× traffic?`, s:`Measure (pprof) → scale proxy tier / Envoy → more backends → feed pagination → queue for writes → rate limit + backpressure.`, a:`Measure first to confirm the bottleneck, scale out the proxy tier or use a proven proxy with more cores, add backends, paginate feed reads, move writes through a durable queue if volume demands, and add rate limiting and backpressure at the edge.`}
]
});

function pickClosestPair() {
  if (queue.length < 2) return null;
  const sorted = [...queue].sort((a, b) => a.elo - b.elo);     // O(n log n)
  let bestI = 0, bestDiff = Infinity;
  for (let i = 0; i < sorted.length - 1; i++) {
    const diff = Math.abs(sorted[i].elo - sorted[i + 1].elo);  // sirf adjacent
    if (diff < bestDiff) { bestDiff = diff; bestI = i; }
  }
  return [sorted[bestI], sorted[bestI + 1]];
}`},

const K_FACTOR = 32;
export function computeElo(winnerElo, loserElo) {
  const expectedWinner = 1 / (1 + 10 ** ((loserElo - winnerElo) / 400));
  const expectedLoser  = 1 - expectedWinner;
  const winnerNewElo = Math.round(winnerElo + K_FACTOR * (1 - expectedWinner));
  const loserNewElo  = Math.max(0, Math.round(loserElo + K_FACTOR * (0 - expectedLoser)));
  return { winnerNewElo, loserNewElo };
}`},
{t:`Example 1: barabar (1200 vs 1200)`, b:`<p>expected = 1/(1+10⁰) = <strong>0.5</strong>. Winner: 32 × (1 − 0.5) = <strong>+16</strong>. Loser: 32 × (0 − 0.5) = <strong>−16</strong>.</p>`},

{t:`Example 3: upset (1200 beats 1400)`, b:`<p>expected = 1/(1+10^(200/400)) = 1/(1+3.16) = <strong>0.24</strong>. Winner: 32 × 0.76 = 24.3 → <strong>+24</strong>. Loser: <strong>−24</strong>.</p><p><strong>Intuition:</strong> umeed ke mutabik jeet = kam points; upset = zyada. Total points (roughly) conserve hote hain. <code>Math.max(0, …)</code> → rating negative nahi.</p>`},

cards:[
{q:`What happens if both players solve the problem at the same time?`, s:`Transaction me UPDATE matches SET winner WHERE id AND winner_id IS NULL RETURNING. Pehla lock + commit; doosra wait, WHERE re-check → 0 rows → no win/ELO.`, a:`Both run a conditional update inside a transaction that sets the winner only where winner_id is still null. The first takes the row lock, updates one row, applies ELO and commits; the second waits, re-evaluates the WHERE clause against the committed row, updates zero rows and returns without any rating change.`},
{q:`Why isn't checking winnerId in application code enough?`, s:`Dono requests ne pehle null padha; check aur set ke beech gap. Atomic SQL statement chahiye.`, a:`Both requests may read the match before either writes, so both see null. The check and the set must happen in one atomic statement so the database arbitrates.`},
{q:`Explain ACID.`, s:`Atomicity sab ya kuch nahi; Consistency constraints; Isolation parallel txs alag; Durability commit ke baad safe.`, a:`Atomicity means all operations commit or none do; consistency means constraints always hold; isolation keeps concurrent transactions from seeing each other's partial work; durability means committed data survives crashes.`},
{q:`What is a lost update and where could it happen in AlgoRace?`, s:`Read-modify-write parallel → ek update gum. wins: winnerUser.wins + 1 JS me. Fix: SQL wins + 1 / FOR UPDATE.`, a:`Two transactions read a value and both write a modified version, so one change is lost. AlgoRace increments wins and losses in application code, so simultaneous settlements for the same user could lose one; incrementing in SQL or locking the user row fixes it.`},
{q:`How does PostgreSQL handle two UPDATEs on the same row under READ COMMITTED?`, s:`Doosra lock ka wait; pehla commit → doosra new row version pe WHERE re-evaluate.`, a:`The second update blocks on the first's row lock; after the first commits, it re-evaluates its WHERE condition against the newly committed row version and only updates if it still matches.`},
{q:`Explain your ELO calculation.`, s:`E = 1/(1+10^((Rl−Rw)/400)); Δ = 32(1−E); floor 0. 1200v1200 ±16; 1400 beats 1200 +8; upset +24.`, a:`The winner's expected score is one over one plus ten to the rating difference over 400, and ratings move by K = 32 times actual minus expected, floored at zero. Equal 1200 players move 16 points; a 1400 beating a 1200 gains about 8, while the upset gains about 24.`},
{q:`How does the disconnect grace period work?`, s:`disconnect → queue se hatao, opponent ko notify, 10 s timer per active match; match:join cancel; warna awardOpponentWin (same IS NULL guard).`, a:`On disconnect the user leaves the queue, opponents in active matches are notified, and a 10-second timer starts per match. Rejoining the match room cancels it; otherwise the opponent is awarded the win through the same winner_id IS NULL guard.`},
{q:`Why emit match:finished only after commit?`, s:`Transaction ke andar emit + rollback → clients ko fake winner. Commit ke baad = DB aur UI consistent.`, a:`If the event is emitted inside the transaction and it rolls back or loses the race, clients see a winner the database doesn't have. Emitting after commit keeps the UI consistent with the source of truth.`},
{q:`Tell me about a bug you fixed in AlgoRace.`, s:`match:leave bina data → throw → poora API crash; async handlers unhandled rejections. Fix: guards, try/catch + logger, .catch on promises, unhandledRejection logger; emit after commit.`, a:`A malformed socket event could crash the whole API: match:leave without data threw, and async handlers had unhandled promise rejections. I reproduced it, added input guards, try-catch with logging, catches on fire-and-forget promises and a process-level unhandledRejection logger, and moved the finish event after commit. Type checks and builds passed and the API stayed healthy after redeploying.`},
{q:`What breaks if you run AlgoRace on two API instances?`, s:`Queues alag, socket rooms per instance, timers + rate limits alag. Fix: Redis ZSET queue, Socket.IO Redis adapter, Redis rate-limit store, sticky sessions.`, a:`Matchmaking queues, socket rooms, disconnect timers and rate-limit counters are all per process, so players on different instances wouldn't match or receive events. I'd move them to Redis — a sorted-set queue, the Socket.IO Redis adapter and a shared rate-limit store — with sticky sessions.`},
{q:`How many concurrent users can AlgoRace handle?`, s:`Load test nahi kiya — guess nahi. k6/Artillery + socket scenario; event-loop lag, DB pool, grading latency (likely bottleneck).`, a:`I haven't load-tested it, so I won't guess. I'd use k6 or Artillery with socket scenarios and watch event-loop lag, database pool usage and grading latency — the external code-execution API is the likely first bottleneck.`}
]
